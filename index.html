    core:"O laço 'for i in 1 2 3' executa 3 vezes, criando backup1, backup2 e backup3 e movendo cada arquivoN.txt para o respectivo diretório. O comando final conta, com 'ls -d backup*/ | wc -l', quantos diretórios cujo nome começa com 'backup' existem: 3.",
    detail:"A sintaxe 'for i in 1 2 3; do ... done' é válida e itera sobre a lista literal de valores 1, 2 e 3 — não há erro de sintaxe, e cada iteração cria exatamente um diretório novo.",

{
  id:"lnx-09", topicId:"admin-linux", tier:"P1", format:"codigo",
  source:"inedita", insp:"Combinação grep/cut sobre /etc/passwd — mesmo mecanismo da prova de Infraestrutura de 2018 (Q48)",
  stem:`Considere que o arquivo /etc/passwd de um servidor contém, entre outras, exatamente estas três linhas:

<pre class="codeblock">root:x:0:0:root:/root:/bin/bash
maria:x:1001:1001:Maria Silva:/home/maria:/bin/bash
daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin</pre>

Um administrador executa o comando:

<pre class="codeblock">grep -v nologin /etc/passwd | cut -d: -f1</pre>

Qual é a saída desse comando, considerando apenas essas três linhas?`,
  options:{
    A:"root",
    B:"root<br>maria",
    C:"root<br>maria<br>daemon",
    D:"daemon",
    E:"o comando falha, pois -v não é uma opção válida do grep"
  },
  correct:"B",
  explanation:{
    core:"'grep -v nologin' seleciona as linhas que NÃO contêm a palavra 'nologin', removendo a linha do usuário daemon (cujo shell é /usr/sbin/nologin) e mantendo as linhas de root e maria. Em seguida, 'cut -d: -f1' extrai apenas o primeiro campo (separado por ':'), que é o nome de usuário — resultando em 'root' e 'maria'.",
    detail:"A opção '-v' do grep inverte a seleção (mostra o que NÃO casa com o padrão) — é um uso legítimo e muito comum do comando, não um erro.",
    wrong:{
      A:"Falta a linha de 'maria', que também não contém 'nologin' e por isso não é removida pelo grep -v.",
      C:"Inclui 'daemon', mas essa linha contém 'nologin' e é justamente a removida pelo grep -v.",
      D:"É exatamente a linha removida pelo comando, não a que sobra — 'daemon' contém 'nologin' e por isso é excluída pelo grep -v.",
      E:"'-v' é uma opção padrão e amplamente documentada do grep, usada para inverter a seleção de linhas — não gera erro."
    }
  }
},

  source:"inedita", insp:"Rastreamento de herança/polimorfismo em Java — mesmo mecanismo das provas de 2006/2011/2018",
  stem:`Analise o programa Java a seguir:

<pre class="codeblock">class Animal {
    String som() { return "..."; }
    String som(int vezes) {
        String r = "";
        for (int i = 0; i < vezes; i++) r += som();
        return r;
    }
}
class Cachorro extends Animal {
    @Override
    String som() { return "Au"; }
}
public class Main {
    public static void main(String[] args) {
        Animal a = new Cachorro();
        System.out.println(a.som(3));
    }
}</pre>

Ao ser executado, o programa imprime:`,

  explanation:{
    core:"Mesmo com a variável declarada como tipo Animal, o objeto real referenciado é um Cachorro — por polimorfismo (ligação dinâmica), qualquer chamada a som() sem argumento, mesmo feita de DENTRO do método som(int) herdado de Animal, é resolvida em tempo de execução para a versão sobrescrita em Cachorro.",
    detail:"O método som(int), herdado de Animal (Cachorro não o sobrescreve), chama internamente som() três vezes. Cada uma dessas chamadas é despachada dinamicamente para Cachorro.som(), que retorna \"Au\" — resultando em \"Au\"+\"Au\"+\"Au\" = \"AuAuAu\".",

    }
  }
},

{
  id:"sto-07", topicId:"storage-virtualizacao", tier:"P2", format:"calculo",
  source:"inedita", insp:"Cálculo de capacidade útil em arranjo RAID — item 6 do Anexo IV (Infraestrutura)",
  stem:"Um administrador configura um arranjo RAID 5 com 5 discos de 2 TB cada. Desconsiderando arredondamentos e overhead adicional, qual é a capacidade útil aproximada de armazenamento desse arranjo?",
  options:{ A:"2 TB", B:"4 TB", C:"6 TB", D:"8 TB", E:"10 TB" },
  correct:"D",
  explanation:{
    core:"RAID 5 dedica a capacidade equivalente a 1 disco para paridade, distribuída entre todos os discos do arranjo. Capacidade útil = (N−1) × tamanho do disco = (5−1) × 2 TB = 8 TB.",
    detail:"É essa perda de 'um disco equivalente' para paridade que diferencia RAID 5 de simplesmente somar a capacidade de todos os discos (o que resultaria, errado, em 10 TB).",
    wrong:{
      A:"Corresponde à capacidade de um único disco, não do arranjo completo.",
      B:"Corresponde a (N−1)/2 × tamanho do disco — fórmula de um RAID espelhado (RAID 1), não do RAID 5.",
      C:"Corresponde a (N−2) × tamanho do disco — fórmula de dupla paridade (RAID 6), não do RAID 5 (paridade simples).",
      E:"Corresponde à soma bruta de todos os discos (N × tamanho), sem descontar a capacidade usada para paridade."
    }
  }
},
{
  id:"sto-08", topicId:"storage-virtualizacao", tier:"P2", format:"cenario",
  source:"inedita", insp:"Escolha de nível de RAID por requisito de tolerância a falha — item 6 do Anexo IV (Infraestrutura)",
  stem:"Uma aplicação crítica exige que o arranjo de discos continue operando normalmente mesmo que até dois discos falhem simultaneamente, garantindo essa tolerância de forma determinística (não apenas provável) para qualquer combinação de dois discos. Qual nível de RAID atende a esse requisito com o menor número de discos dedicados à paridade?",
  options:{ A:"RAID 0", B:"RAID 1", C:"RAID 5", D:"RAID 6", E:"RAID 10" },
  correct:"D",
  explanation:{
    core:"RAID 6 usa dupla paridade, distribuída entre os discos, o que garante — para QUALQUER combinação de até 2 discos que falhem — que os dados ainda possam ser reconstruídos.",
    detail:"RAID 5 tolera apenas 1 falha simultânea (uma segunda falha antes da reconstrução causa perda de dados); RAID 10 pode tolerar mais de uma falha em alguns casos, mas não de forma garantida para QUALQUER combinação de dois discos (se os dois discos de um mesmo par espelhado falharem, os dados desse par são perdidos) — por isso RAID 6 é a resposta que atende à garantia determinística pedida.",
    wrong:{
      A:"RAID 0 (apenas distribuição, sem redundância) não tolera nenhuma falha de disco — a perda de qualquer disco compromete todo o arranjo.",

      C:"RAID 5 tolera apenas 1 falha simultânea, através de paridade simples — uma segunda falha antes da reconstrução causa perda de dados.",
      E:"RAID 10 pode, em alguns casos específicos, sobreviver a duas falhas, mas não de forma garantida para qualquer combinação de dois discos — se ambos os discos de um mesmo espelho falharem, os dados são perdidos."
    }
  }
},

  id:"sql-21", topicId:"sql-dados", tier:"P1", format:"visual",
  source:"inedita", insp:"Transformação de modelo E-R em esquema relacional com alternativas quase idênticas — item 1.2 do Anexo IV, no formato de comparação minuciosa usado na prova de 2018 (Q40)",
  stem:`Considere o seguinte modelo conceitual: CLIENTE se relaciona com PEDIDO numa cardinalidade 1:N (um cliente faz vários pedidos; um pedido pertence a exatamente um cliente). PRODUTO se relaciona com PEDIDO numa cardinalidade N:N (um pedido pode conter vários produtos; um produto pode aparecer em vários pedidos), sendo QUANTIDADE um atributo próprio dessa relação N:N (não pertence nem a PEDIDO nem a PRODUTO isoladamente).

As cinco alternativas a seguir são muito parecidas entre si — apenas uma preserva corretamente a semântica do modelo descrito. Assinale-a.`,

    A:`<pre class="codeblock">CREATE TABLE CLIENTE (ID_CLIENTE NUMBER PRIMARY KEY, NOME VARCHAR2(100))

  ID_PEDIDO NUMBER PRIMARY KEY, DATA DATE,

  ID_PEDIDO NUMBER NOT NULL, ID_PRODUTO NUMBER NOT NULL, QUANTIDADE NUMBER NOT NULL,
  PRIMARY KEY (ID_PEDIDO, ID_PRODUTO),

  FOREIGN KEY (ID_PRODUTO) REFERENCES PRODUTO(ID_PRODUTO))</pre>`,
    C:`<pre class="codeblock">CREATE TABLE CLIENTE (ID_CLIENTE NUMBER PRIMARY KEY, NOME VARCHAR2(100))
CREATE TABLE PRODUTO (ID_PRODUTO NUMBER PRIMARY KEY, DESCR VARCHAR2(100))

    E:`<pre class="codeblock">CREATE TABLE CLIENTE (ID_CLIENTE NUMBER PRIMARY KEY, NOME VARCHAR2(100))

{
  id:"sql-22", topicId:"sql-dados", tier:"P1", format:"calculo",
  source:"inedita", insp:"Identificação da 3FN a partir de dependências funcionais comparando múltiplos esquemas — mesmo mecanismo da prova de 2018 (Q42)",
  stem:`Considere a seguinte notação: tabelas descritas por um nome e uma lista de colunas, separadas por vírgulas; colunas que participam da chave primária estão sublinhadas; dependências funcionais entre colunas são indicadas pelo símbolo →. Todos os esquemas abaixo atendem à 1FN e à 2FN.

<pre class="codeblock">T1(x1,x2,x3)
  x1 → x2
  x2 → x3

T2(y1,y2,y3,y4)
  y1 → y2
  y1 → y3
  y1 → y4

T3(z1,z2,z3)
  z1 → z2
  z1 → z3
  z2 → z3</pre>

Dos três esquemas acima, o único que está na Terceira Forma Normal (3FN) é:`,
  options:{ A:"apenas T1", B:"apenas T2", C:"apenas T3", D:"T1 e T2", E:"nenhum dos três" },
  correct:"B",
  explanation:{
    core:"Em T2, todos os atributos não-chave (y2, y3, y4) dependem diretamente da chave y1, sem nenhuma dependência transitiva entre atributos não-chave — está na 3FN.",
    detail:"T1 viola a 3FN porque x1→x2→x3 é uma dependência transitiva (x3 depende de x2, que é não-chave). T3 também viola a 3FN: apesar de z1→z3 existir diretamente, a dependência adicional z2→z3 é, por si só, uma dependência entre dois atributos não-chave (z2 determinando z3) — o que já caracteriza uma violação de 3FN, independentemente de existir também uma dependência direta da chave.",
    wrong:{
      A:"T1 tem dependência transitiva clara (x1→x2→x3), violando a 3FN.",
      C:"T3 tem a dependência z2→z3 entre dois atributos não-chave, o que viola a 3FN mesmo com z1→z3 também existindo.",
      D:"T1 não está na 3FN (dependência transitiva) — apenas T2 atende ao critério.",
      E:"T2 atende plenamente à 3FN — não é correto afirmar que nenhum dos três esquemas está nessa forma normal."
    }
  }
},

  id:"sql-23", topicId:"sql-dados", tier:"P1", format:"calculo",
  source:"inedita", insp:"Identificação de operações conflitantes em um escalonamento (schedule) — mesmo mecanismo da prova de Infraestrutura de 2012 (Q57)",
  stem:`Considere o escalonamento (schedule) de operações de duas transações concorrentes, na seguinte ordem cronológica:

<pre class="codeblock">1) R1(A)
2) W2(A)
3) R1(B)
4) W1(A)
5) R2(B)</pre>

Duas operações são consideradas conflitantes quando pertencem a transações diferentes, acessam o mesmo item de dado, e pelo menos uma delas é uma escrita (write). Quantos pares de operações conflitantes existem nesse escalonamento?`,
  options:{ A:"0", B:"1", C:"2", D:"3", E:"4" },
  correct:"C",
  explanation:{
    core:"Os únicos pares que envolvem transações diferentes sobre o MESMO item, com pelo menos uma escrita, são: (R1(A), W2(A)) — mesmo item A, transações diferentes, uma escrita — CONFLITO; e (W2(A), W1(A)) — mesmo item A, transações diferentes, ambas escritas — CONFLITO. Total: 2 pares conflitantes.",
    detail:"R1(B) e R2(B) acessam o mesmo item B, mas são duas LEITURAS — leitura×leitura nunca é conflitante, mesmo entre transações diferentes. As operações da MESMA transação (como R1(A) e W1(A), ambas de T1) não contam como conflito entre si, pois conflito é definido especificamente entre transações diferentes.",
    wrong:{

      D:"Inclui algum par que não atende à definição de conflito — como um par leitura-leitura (R1(B)/R2(B)), que nunca é conflitante.",
      E:"Superestima a contagem, provavelmente incluindo pares da mesma transação ou pares leitura-leitura, que não se qualificam como conflitantes."
    }
  }
},

{
  id:"es-23", topicId:"eng-software", tier:"P1", format:"calculo",
  source:"inedita", insp:"Complexidade ciclomática via grafo com nós/arcos dados diretamente — mesmo mecanismo da prova de 2018 (Q25)",
  stem:"Um grafo de fluxo de um programa possui 8 nós e 11 arestas. De acordo com a fórmula de McCabe (M = Arestas − Nós + 2), a complexidade ciclomática desse grafo é:",
  options:{ A:"3", B:"5", C:"9", D:"11", E:"19" },
  correct:"B",
  explanation:{
    core:"Aplicando a fórmula diretamente: M = 11 − 8 + 2 = 5.",
    detail:"Não há atalho conceitual aqui — é substituição direta na fórmula. O erro mais comum é esquecer a constante \"+2\" ou trocar a ordem da subtração.",
    wrong:{
      A:"Corresponde a 11 − 8, esquecendo de somar a constante \"+2\" da fórmula.",
      C:"Corresponde a nós + 1 (8+1), confundindo com a fórmula alternativa \"decisões + 1\" sem contar decisões de fato.",
      D:"Repete apenas o número de arestas, sem aplicar a fórmula.",
      E:"Corresponde a nós + arestas (8+11), somando os dois valores em vez de subtrair."
    }
  }
},
{
  id:"es-24", topicId:"eng-software", tier:"P1", format:"calculo",
  source:"inedita", insp:"Contagem de Pontos de Função Não Ajustados com tabela de pesos IFPUG — mesmo mecanismo da prova de 2018 (Q30)",
  stem:`Um sistema passou por uma contagem de pontos de função, resultando na tabela abaixo (quantidade de cada tipo de função, por nível de complexidade):

<pre class="codeblock">                                  Baixa   Média   Alta
Entrada Externa (EI)                2       1      0
Saída Externa (EO)                  1       2      1
Consulta Externa (EQ)               0       1      0
Arquivo Lógico Interno (ILF)        1       0      1
Arquivo de Interface Externa (EIF)  0       1      0</pre>

Usando os pesos-padrão do método IFPUG (EI: 3/4/6 · EO: 4/5/7 · EQ: 3/4/6 · ILF: 7/10/15 · EIF: 5/7/10, para baixa/média/alta respectivamente), quantos Pontos de Função Não Ajustados (PFNA) tem esse sistema?`,
  options:{ A:"58", B:"61", C:"64", D:"67", E:"70" },
  correct:"C",
  explanation:{
    core:"EI: 2×3 + 1×4 + 0×6 = 10. EO: 1×4 + 2×5 + 1×7 = 21. EQ: 0×3 + 1×4 + 0×6 = 4. ILF: 1×7 + 0×10 + 1×15 = 22. EIF: 0×5 + 1×7 + 0×10 = 7. Soma total: 10+21+4+22+7 = 64.",
    detail:"O método é sempre o mesmo: multiplicar cada quantidade pelo peso correspondente à sua complexidade e somar tudo. Quem não tem os pesos-padrão decorados não consegue nem começar essa conta — é esse o motivo de a banca considerar essa questão difícil, mesmo sendo \"só uma soma\".",
    wrong:{
      A:"Resultado abaixo do correto — provavelmente decorrente de usar o peso da coluna \"baixa\" para alguma célula que na verdade é \"média\" ou \"alta\".",
      B:"Próximo do correto, mas com pelo menos uma multiplicação usando o peso errado dentro da mesma linha da tabela.",
      D:"Acima do correto — consistente com trocar o peso de \"média\" pelo de \"alta\" em uma das linhas.",
      E:"Bem acima do correto — consistente com múltiplos erros de peso ou com somar uma linha adicional inexistente."
    }
  }
},
{
  id:"es-25", topicId:"eng-software", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Categorização fina de custo da qualidade — mesmo mecanismo da prova de 2018 (Q26)",
  stem:"Em um projeto de desenvolvimento de software, a atividade de \"condução de revisões técnicas dos artefatos de análise e projeto, antes do início da fase de codificação\" é classificada, segundo o modelo de custo da qualidade, como um custo de:",
  options:{
    A:"avaliação, pois inspeciona o artefato em busca de defeitos já existentes.",
    B:"prevenção, pois evita que um defeito presente no artefato avance para as fases seguintes do desenvolvimento.",
    C:"falha interna, pois corrige um defeito antes da entrega ao cliente.",
    D:"falha externa, pois o defeito seria encontrado pelo cliente caso o artefato não fosse revisado.",
    E:"retrabalho, categoria autônoma e independente das demais no modelo de custo da qualidade."
  },
  correct:"B",
  explanation:{
    core:"Revisão técnica de artefato ANTES da fase seguinte (codificação) é uma atividade de prevenção: seu objetivo é impedir que o defeito passe adiante, não apenas detectá-lo depois de o produto já estar pronto.",
    detail:"A pegadinha está em confundir \"revisar/inspecionar\" com avaliação — mas a diferença correta é o MOMENTO e a INTENÇÃO: prevenção atua antes do defeito se propagar (revisão de artefato anterior à codificação); avaliação atua sobre um produto já construído (teste de um código já pronto).",
    wrong:{
      A:"Avaliação seria testar/inspecionar um PRODUTO já pronto (como um código já escrito) — aqui a revisão ocorre sobre um artefato anterior à própria codificação, prevenindo o defeito de avançar.",
      C:"Falha interna pressupõe que o defeito já foi encontrado em um produto construído e precisa de retrabalho — a revisão técnica aqui ocorre antes disso, de forma preventiva.",
      D:"Falha externa pressupõe que o defeito chegou até o cliente — o cenário descrito é justamente uma ação para evitar que isso aconteça.",
      E:"O modelo de custo da qualidade não trata \"retrabalho\" como uma quinta categoria autônoma — retrabalho é uma atividade tipicamente associada à categoria de falha (interna ou externa)."
    }
  }
},
{
  id:"es-26", topicId:"eng-software", tier:"P1", format:"codigo",
  source:"inedita", insp:"Rastreamento de sobrecarga/sobrescrita e polimorfismo em Java — mesmo mecanismo das provas de 2006, 2011 e 2018",
  stem:`Analise as classes Java a seguir:

<pre class="codeblock">class Conta {
    static int contador = 0;
    int saldo;
    Conta(int s) { saldo = s; contador++; }
    int getSaldo() { return saldo; }
}
class ContaEspecial extends Conta {
    ContaEspecial(int s) { super(s * 2); }
    int getSaldo() { return saldo + contador; }
}
public class Main {
    public static void main(String[] args) {
        Conta c1 = new Conta(5);
        ContaEspecial c2 = new ContaEspecial(3);
        System.out.println(c1.getSaldo() + c2.getSaldo());
    }
}</pre>

Ao ser executado, o programa imprime:`,
  options:{ A:"8", B:"11", C:"13", D:"14", E:"16" },
  correct:"C",
  explanation:{
    core:"c1 = new Conta(5): saldo=5, contador vira 1. c2 = new ContaEspecial(3): super(3*2=6), saldo=6, contador vira 2. c1.getSaldo() usa o método de Conta, retornando apenas saldo: 5. c2.getSaldo() usa o método sobrescrito de ContaEspecial, retornando saldo+contador: 6+2=8. Soma final: 5+8=13.",
    detail:"O ponto-chave é que 'contador' é um campo static, compartilhado por TODAS as instâncias da classe (e das subclasses) — por isso seu valor reflete o total de objetos já criados no momento de cada chamada, não um valor por instância.",
    wrong:{
      A:"Corresponde a somar apenas os dois valores de saldo (5+6=11 seria isso, mas 8 não corresponde a nenhuma combinação direta e plausível dos valores).",
      B:"Corresponde a 5+6 (somando os dois saldos brutos, sem aplicar o método getSaldo sobrescrito de ContaEspecial, que soma o contador).",
      D:"Corresponde a considerar contador=3 em vez de 2 no momento da chamada de c2.getSaldo() — nesse ponto do programa, apenas 2 objetos (c1 e c2) já foram construídos.",
      E:"Corresponde a somar saldo+contador também para c1 (5+2=7, mais 6+2=8, totalizando 15) ou outra combinação que aplica incorretamente o método sobrescrito também à instância de Conta."
    }
  }
},
{
  id:"es-27", topicId:"eng-software", tier:"P1", format:"visual",
  source:"inedita", insp:"Comparação entre dois diagramas de máquina de estados quase idênticos — mesmo mecanismo da prova de Software 2011 (Q26)",
  stem:"Máquina de Estados 1: possui os estados Aguardando e Processando, com uma transição de Aguardando para Processando disparada pelo evento \"iniciar\", e uma transição de Processando para Aguardando disparada pelo evento \"concluir\".\n\nMáquina de Estados 2: possui os mesmos dois estados e as mesmas duas transições da Máquina 1, mas adiciona uma transição extra de Processando para o próprio estado Processando (uma autotransição/self-loop), disparada pelo evento \"progresso\".\n\nA diferença essencial introduzida pela Máquina 2 é que ela permite que o objeto:",
  options:{
    A:"saia do estado Processando sem que o evento \"concluir\" ocorra.",
    B:"permaneça no estado Processando e reaja a eventos (como atualizações de progresso), sem que isso represente uma mudança de estado.",
    C:"deixe de ter o estado Aguardando como parte do seu ciclo de vida.",
    D:"tenha um estado inicial diferente do estado inicial da Máquina 1.",
    E:"transite diretamente de Aguardando para o próprio estado Aguardando ao receber o evento \"progresso\"."
  },
  correct:"B",
  explanation:{
    core:"Uma autotransição (self-loop) — transição de um estado para ele mesmo — permite que o objeto reaja a um evento (execute uma ação associada à transição) SEM sair do estado em que está. É exatamente o que a transição \"progresso\" faz no estado Processando.",
    detail:"Isso é diferente de uma transição para OUTRO estado: aqui, o estado do objeto continua sendo Processando antes e depois do evento — só a AÇÃO associada ao evento é executada.",
    wrong:{
      A:"A única transição que leva para fora de Processando continua sendo a disparada por \"concluir\" — a autotransição de \"progresso\" não leva a lugar nenhum fora de Processando.",
      C:"O estado Aguardando continua presente e inalterado na Máquina 2 — apenas uma transição nova foi adicionada dentro de Processando.",
      D:"Nada na descrição da Máquina 2 altera qual é o estado inicial — a mudança é apenas a adição de uma autotransição em Processando.",
      E:"A autotransição descrita ocorre no estado Processando, disparada por \"progresso\" — não há autotransição em Aguardando na descrição."
    }
  }
},

{

  source:"inedita", insp:"Estruturas organizacionais — item 2.5 do Anexo IV",

{

  stem:"Uma rede de farmácias implantou um sistema que, a partir de dados de estoque, validade dos lotes, histórico de vendas e preços de fornecedores, permite ao gestor simular diferentes cenários de reposição (\"e se eu comprar do fornecedor B em vez do A, qual o impacto na margem?\") e sugere a combinação de fornecedores que maximiza a margem, respeitando o prazo de validade dos produtos. O sistema não processa as vendas em si (isso é feito por outro sistema, no caixa) nem substitui o julgamento final do gestor — apenas modela cenários e recomenda caminhos.\n\nCom base na descrição, o tipo de Sistema de Informação implementado é:",
  options:{
    A:"Sistema de Processamento de Transações (SPT)",

  explanation:{
    core:"A combinação \"simular cenários hipotéticos (e se...) + recomendar, sem substituir o julgamento humano\" é a marca registrada de um Sistema de Apoio à Decisão (SAD/DSS) — voltado a decisões semiestruturadas, não a relatórios fixos nem a processamento transacional.",
    detail:"O detalhe que resolve a questão é \"não substitui o julgamento do gestor\": um Sistema Especialista tenderia a dar uma recomendação mais autônoma e definitiva, emulando o raciocínio de um especialista; um SAD apoia, mas deixa a decisão final por conta humana.",
    wrong:{
      A:"SPT registra e processa transações do dia a dia (como as vendas no caixa) — o próprio enunciado diz que essa função é de OUTRO sistema, não deste.",
      B:"SIG entrega relatórios estruturados e periódicos a partir de dados internos — não realiza simulação de cenários hipotéticos (\"e se\"), que é a característica central descrita.",
      C:"Um Sistema Especialista tenderia a emular o raciocínio de um especialista humano de forma mais autônoma e prescritiva — o enunciado enfatiza que o sistema apenas apoia, sem substituir o julgamento do gestor.",
      E:"EIS agrega informações de alto nível para a alta gestão acompanhar indicadores — não é voltado à simulação operacional de cenários de reposição de estoque."
    }
  }

{
  id:"pm-21", topicId:"gestao-projetos", tier:"P1", format:"calculo",
  source:"inedita", insp:"Cálculo de CPI/SPI (Análise de Valor Agregado) — mesmo mecanismo da prova de 2018 (Q62)",
  stem:"Em um determinado ponto de controle, um projeto apresenta Valor Agregado (EV) de R$ 80.000, Valor Planejado (PV) de R$ 100.000 e Custo Real (AC) de R$ 90.000. Calcule, respectivamente, o Índice de Desempenho de Prazo (SPI = EV/PV) e o Índice de Desempenho de Custo (CPI = EV/AC) desse projeto.",
  options:{
    A:"SPI = 0,80; CPI ≈ 0,89",
    B:"SPI = 1,25; CPI ≈ 0,89",
    C:"SPI = 0,80; CPI = 1,125",
    D:"SPI ≈ 0,89; CPI = 0,80",
    E:"SPI = 1,125; CPI = 1,25"
  },
  correct:"A",
  explanation:{
    core:"SPI = EV/PV = 80.000/100.000 = 0,80 (o projeto entregou 80% do valor planejado para este ponto, indicando atraso). CPI = EV/AC = 80.000/90.000 ≈ 0,89 (o projeto está gastando mais do que o valor entregue, indicando estouro de custo).",
    detail:"É importante lembrar o numerador fixo: tanto SPI quanto CPI usam EV (Valor Agregado) no numerador — SPI compara EV com o que foi PLANEJADO (PV); CPI compara EV com o que foi de fato GASTO (AC). Índices abaixo de 1 indicam desempenho pior do que o planejado, tanto em prazo quanto em custo.",
    wrong:{
      B:"Inverte a fração do SPI (PV/EV=1,25 em vez de EV/PV=0,80) — SPI corretamente calculado é 0,80, não 1,25.",
      C:"Inverte a fração do CPI (AC/EV=1,125 em vez de EV/AC≈0,89) — CPI corretamente calculado é aproximadamente 0,89, não 1,125.",
      D:"Troca os valores de SPI e CPI entre si — o cálculo de cada índice usa denominadores diferentes (PV para SPI, AC para CPI).",
      E:"Inverte as duas frações simultaneamente (PV/EV e AC/EV em vez de EV/PV e EV/AC)."
    }
  }
},
{
  id:"pm-22", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Regra dos 100% na construção da EAP/WBS — mesmo mecanismo da prova de Software 2011 (Q63)",
  stem:"Ao construir a Estrutura Analítica do Projeto (EAP/WBS), o Nível 2 apresenta os pacotes de trabalho \"Módulo de Pagamento\" e \"Módulo de Catálogo\", mas não inclui nenhum pacote referente à \"Documentação do Usuário\", que também compõe o escopo aprovado do projeto, conforme registrado na Declaração de Escopo. Essa EAP viola a chamada:",
  options:{
    A:"regra dos 100% (a soma do trabalho representado nos níveis inferiores da EAP deve corresponder a 100% do escopo definido no nível superior/na Declaração de Escopo, sem omissões).",
    B:"regra do caminho crítico.",
    C:"regra da decomposição binária (toda EAP deveria ter exatamente dois pacotes por nível).",
    D:"regra da conta de controle única (toda EAP deveria ter apenas uma conta de controle).",
    E:"regra do nivelamento de recursos."
  },
  correct:"A",
  explanation:{
    core:"A regra dos 100% é o princípio central de construção de uma EAP: o trabalho representado em cada nível deve corresponder a 100% do escopo do nível imediatamente acima (e, no topo, a 100% do escopo total aprovado do projeto) — nenhum elemento do escopo aprovado pode ficar de fora.",
    detail:"Ao omitir \"Documentação do Usuário\" (que está na Declaração de Escopo aprovada), a EAP deixa parte do escopo sem representação — exatamente o tipo de violação que a regra dos 100% existe para prevenir.",
    wrong:{
      B:"Caminho crítico é um conceito de cronograma (rede de atividades), não de construção da EAP.",
      C:"Não existe, no PMBOK, uma exigência de número fixo de pacotes por nível da EAP — a decomposição varia conforme a natureza do trabalho.",
      D:"Contas de controle são pontos de gerenciamento definidos dentro da EAP, mas não existe uma regra de \"conta de controle única\" — um projeto tipicamente tem várias.",
      E:"Nivelamento de recursos é uma técnica de gerenciamento de cronograma para resolver sobrealocação, sem relação com completude de escopo na EAP."
    }
  }
},

  stem:"Um analista deseja normalizar o valor 82 de um atributo cuja média, na base de dados, é 70, com desvio-padrão de 8, utilizando a técnica de normalização por escore-padrão (z-score), calculada pela fórmula z = (x − média) / desvio-padrão. Qual é o valor de z para esse dado?",
  options:{ A:"0,5", B:"1,0", C:"1,5", D:"2,0", E:"12" },
  correct:"C",
  explanation:{
    core:"z = (82 − 70) / 8 = 12 / 8 = 1,5.",

      D:"Corresponde a uma conta com desvio-padrão 6 em vez de 8, ou outro erro de substituição na fórmula.",
      E:"Corresponde apenas ao numerador da fórmula (x − média = 12), sem realizar a divisão pelo desvio-padrão."

  }

/* ============================================================
   ENGINE
   ============================================================ */
(function(){
  "use strict";

  var FORMAT_LABEL = { conceitual:"Conceitual", cenario:"Cenário", calculo:"Cálculo", codigo:"Código", porque:"Afirmação PORQUE", visual:"Interpretação visual", interpretacao:"Interpretação de texto" };
  var TIER_LABEL = { P1:"Prioridade 1", P2:"Prioridade 2", P3:"Prioridade 3" };
  var TIER_WEIGHT = { P1:4, P2:2, P3:1 };

  var topicById = {};
  TOPICS.forEach(function(t){ topicById[t.id] = t; });

  var enfaseById = {}; ENFASES.forEach(function(e){ enfaseById[e.id]=e; });
  function loadSelectedEnfase(){
    try { var v = localStorage.getItem("pn_sim_enfase"); return (v && enfaseById[v]) ? v : ENFASES[0].id; } catch(e){ return ENFASES[0].id; }
  }
  function saveSelectedEnfase(id){ try { localStorage.setItem("pn_sim_enfase", id); } catch(e){} }
  /* Cada tópico carrega um array enfase:[...] (ver window.TOPICS) — um
     mesmo tópico pode pertencer a mais de uma área quando o conteúdo do
     Anexo IV é essencialmente o mesmo texto nas duas ênfases (ex: o bloco
     de Segurança da Informação e o de Lógica/Raciocínio Lógico são quase
     idênticos entre Processos de Negócios e Infraestrutura). Uma nova área
     passa a "ter conteúdo" automaticamente assim que o primeiro tópico com
     esse enfase é adicionado — não precisa mexer aqui. */
  function topicsForEnfase(enfaseId){ return TOPICS.filter(function(t){ return t.enfase.indexOf(enfaseId) !== -1; }); }
  /* Conteúdo "de verdade" de uma ênfase é medido só pelos tópicos de
     Conhecimentos Específicos — os tópicos de Língua Portuguesa/Inglesa
     pertencem às 5 ênfases por serem comuns (Fase 2 do edital) e não
     podem, sozinhos, tirar uma área do estado "em construção". */
  function enfaseHasContent(enfaseId){
    return topicsForEnfase(enfaseId).filter(function(t){ return GERAIS_TOPIC_IDS.indexOf(t.id) === -1; }).length > 0;
  }
  function questionsForEnfase(enfaseId){
    var ids = topicsForEnfase(enfaseId).map(function(t){ return t.id; });
    return QUESTIONS.filter(function(q){ return ids.indexOf(q.topicId) !== -1; });
  }
  /* Agrupa as questões de lingua-portuguesa/lingua-inglesa por texto-base
     compartilhado (os primeiros 220 caracteres do stem identificam de
     forma estável qual PASSAGE_* deu origem à questão, sem precisar de
     um campo extra no schema). Cada grupo é um texto completo com suas
     perguntas — usado tanto para montar o quiz de Conhecimentos Gerais
     quanto para contar quantos textos existem de cada tamanho. */
  function geraisPassageGroups(topicId){
    var qs = QUESTIONS.filter(function(q){ return q.topicId === topicId; });
    var byPassage = {};
    qs.forEach(function(q){
      var key = q.stem.slice(0,220);
      byPassage[key] = byPassage[key] || [];
      byPassage[key].push(q);
    });
    return Object.keys(byPassage).map(function(k){ return byPassage[k]; });
  }

  var state = { tab:"home", quiz:null, historyCache:null, enfase: loadSelectedEnfase() };

  /* ---------- db / storage ---------- */
  var dbPromise = null;
  function getDb(){
    if (!dbPromise){
      dbPromise = (function(){
        if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
        return window.claude.use("db").catch(function(){ return null; });
      })();
    }
    return dbPromise;
  }
  function localHistory(){
    try { return JSON.parse(localStorage.getItem("pn_sim_attempts") || "[]"); } catch(e){ return []; }
  }
  function saveLocalHistory(list){
    try { localStorage.setItem("pn_sim_attempts", JSON.stringify(list.slice(0,50))); } catch(e){}
  }
  function saveAttempt(attempt){
    return getDb().then(function(db){
      if (db){
        return db.collection("attempts").add(attempt).then(function(){ return true; }).catch(function(){ return false; });
      }
      return false;
    }).then(function(savedRemote){
      if (!savedRemote){
        var list = localHistory();
        list.unshift(Object.assign({ id:"local-"+Date.now() }, attempt));
        saveLocalHistory(list);
      }
      state.historyCache = null;
    });
  }
  function loadHistory(){
    return getDb().then(function(db){
      if (db){
        return db.collection("attempts").orderBy("finishedAt","desc").limit(50).get()
          .then(function(snap){
            return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          }).catch(function(){ return localHistory(); });
      }
      return localHistory();
    });
  }

  /* ---------- utils ---------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt2(n){ return (n<10?"0":"")+n; }
  function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return fmt2(m)+":"+fmt2(s); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
  function pctColor(pct){ return pct>=70 ? "var(--good)" : (pct>=50 ? "var(--amber)" : "var(--bad)"); }

  /* Amostragem sem reposição, ponderada pelo peso de cada Prioridade —
     garante que Prioridade 1 puxe mais questões que P2/P3 conforme o
     banco crescer nas próximas fases, sem exigir mudança aqui. */
  function pickQuestions(count, topicFilter){
    var pool = questionsForEnfase(state.enfase).filter(function(q){
      if (topicFilter) return q.topicId === topicFilter;
      return GERAIS_TOPIC_IDS.indexOf(q.topicId) === -1;
    });
    var remaining = pool.slice();
    var picked = [];
    var n = Math.min(count, pool.length);
    while (picked.length < n && remaining.length){
      var totalWeight = remaining.reduce(function(sum,q){ return sum + (TIER_WEIGHT[q.tier]||1); }, 0);
      var r = Math.random() * totalWeight;
      var acc = 0, chosenIdx = 0;
      for (var i=0;i<remaining.length;i++){
        acc += TIER_WEIGHT[remaining[i].tier]||1;
        if (r <= acc){ chosenIdx = i; break; }
      }
      picked.push(remaining[chosenIdx]);
      remaining.splice(chosenIdx,1);
    }
    return shuffle(picked);
  }

  /* ---------- tabs ---------- */
  function switchTab(tab){
    state.tab = tab;
    document.querySelectorAll("#mainTabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===tab); });
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    if (tab==="home"){ document.getElementById("view-home").classList.add("active"); renderHome(); }
    if (tab==="study"){ document.getElementById("view-study").classList.add("active"); renderStudyList(); }
    if (tab==="history"){ document.getElementById("view-history").classList.add("active"); renderHistory(); }
    if (tab==="concurso"){ document.getElementById("view-concurso").classList.add("active"); renderConcurso(); }
    if (tab==="plano"){ document.getElementById("view-plano").classList.add("active"); renderPlano(); }
  }
  document.getElementById("mainTabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    if (state.quiz && state.quiz.active){
      if (!confirm("Você tem uma prova em andamento. Sair agora descarta o progresso não finalizado. Continuar?")) return;
      state.quiz = null;
    }
    switchTab(b.dataset.tab);
  });

  /* ============================================================
     HOME
     ============================================================ */
  function renderHome(){
    var host = document.getElementById("view-home");
    host.innerHTML = "";
    var enfase = enfaseById[state.enfase] || ENFASES[0];

    var head = el(
      '<header class="pagehead">'+
        '<span class="eyebrow"><span class="dot"></span>'+enfase.nome+'</span>'+
        '<h1>Gere sua prova</h1>'+
        '<p>Escolha a área do concurso e depois um modo. Ao final você recebe sua nota na hora — e só depois disso a correção detalhada, com a explicação de cada questão, é liberada para estudo.</p>'+
      '</header>'
    );
    host.appendChild(head);

    /* ---- seletor de área (ênfase), guiado pelas vagas reais do edital ---- */
    var enfaseRow = el('<div class="enfase-row"></div>');
    ENFASES.forEach(function(ef){
      var pill = el(
        '<div class="enfase-pill'+(ef.id===enfase.id?' active':'')+'" data-ef="'+ef.id+'">'+
          '<span class="en">'+ef.nome.replace("Análise de Sistemas — ","")+'</span>'+
          '<span class="ev">'+ef.vagaImediata+' · '+ef.crTotal+' no cadastro de reserva</span>'+
          (enfaseHasContent(ef.id) ? '' : '<span class="elock">🔒 em construção</span>')+
        '</div>'
      );
      pill.addEventListener("click", function(){
        state.enfase = ef.id;
        saveSelectedEnfase(ef.id);
        renderHome();
      });
      enfaseRow.appendChild(pill);
    });
    host.appendChild(enfaseRow);

    /* ---- Conhecimentos Gerais (Fase 2: Português + Inglês) — comum a
       todas as áreas, independentemente do estado do banco de
       Conhecimentos Específicos daquela ênfase. Zerar Português OU
       Inglês elimina o candidato, segundo o edital, então este bloco
       fica sempre visível, mesmo em áreas ainda "em construção".
       Português e Inglês são treinados separadamente, cada um com um
       modo Rápido (texto curto, 5 questões) e um Completo (texto
       integral, 10 questões, como na prova real). */
    var ptGroups = geraisPassageGroups("lingua-portuguesa");
    var enGroups = geraisPassageGroups("lingua-inglesa");
    function countBySize(groups, size){ return groups.filter(function(g){ return g.length===size; }).length; }
    var geraisCard = el(
      '<div class="card" style="padding:20px 24px;margin-bottom:22px;">'+
        '<h3 style="font-size:15px;margin-bottom:4px;">Conhecimentos Gerais — Português &amp; Inglês</h3>'+
        '<p style="font-size:13px;color:var(--ink-soft);max-width:66ch;margin:0 0 16px;">Fase 2 do edital, comum a todas as ênfases. Zerar qualquer uma das duas disciplinas elimina o candidato, mesmo com boa nota em Conhecimentos Específicos. Escolha o idioma e o tamanho — a cada tentativa, um texto diferente é sorteado entre os disponíveis.</p>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;">'+
          '<div style="border:1px solid var(--line);border-radius:10px;padding:14px 16px;">'+
            '<div style="font-weight:700;margin-bottom:10px;">Português</div>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
              '<button class="btn" data-lang="pt" data-size="rapido">Rápido · 5 questões ('+countBySize(ptGroups,5)+' texto'+(countBySize(ptGroups,5)===1?"":"s")+')</button>'+
              '<button class="btn primary" data-lang="pt" data-size="completo">Completo · 10 questões ('+countBySize(ptGroups,10)+' texto'+(countBySize(ptGroups,10)===1?"":"s")+')</button>'+
            '</div>'+
          '</div>'+
          '<div style="border:1px solid var(--line);border-radius:10px;padding:14px 16px;">'+
            '<div style="font-weight:700;margin-bottom:10px;">Inglês</div>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
              '<button class="btn" data-lang="en" data-size="rapido">Rápido · 5 questões ('+countBySize(enGroups,5)+' texto'+(countBySize(enGroups,5)===1?"":"s")+')</button>'+
              '<button class="btn primary" data-lang="en" data-size="completo">Completo · 10 questões ('+countBySize(enGroups,10)+' texto'+(countBySize(enGroups,10)===1?"":"s")+')</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'
    );
    geraisCard.querySelectorAll("button[data-lang]").forEach(function(btn){
      btn.addEventListener("click", function(){ startGeraisQuiz(btn.dataset.lang, btn.dataset.size); });
    });
    host.appendChild(geraisCard);

    if (!enfaseHasContent(enfase.id)){
      host.appendChild(el(
        '<div class="card enfase-empty">'+
          '<p><b>O banco de questões desta área ainda está em construção.</b></p>'+
          '<p>O simulador está sendo expandido área por área, seguindo o mesmo processo usado em Processos de Negócios: mapear o Anexo IV do edital, cruzar com o padrão histórico da Cesgranrio (quando existe prova antiga daquela ênfase) e escrever as questões em lotes com explicação completa.</p>'+
          '<p>Enquanto isso, escolha outra área no seletor acima para praticar Conhecimentos Específicos, ou use os botões acima para treinar Português e Inglês.</p>'+
        '</div>'
      ));
      return;
    }

    var topics = topicsForEnfase(enfase.id).filter(function(t){ return GERAIS_TOPIC_IDS.indexOf(t.id) === -1; });
    var pool = questionsForEnfase(enfase.id).filter(function(q){ return GERAIS_TOPIC_IDS.indexOf(q.topicId) === -1; });
    var total = pool.length;
    var byTier = {}; pool.forEach(function(q){ byTier[q.tier]=(byTier[q.tier]||0)+1; });

    var grid = el('<div class="modegrid"></div>');
    var modes = [
      { id:"rapido", name:"Treino Rápido", desc:"Aquecimento curto, questões de todos os tópicos disponíveis.", n:Math.min(10,total) },
      { id:"medio", name:"Simulado Médio", desc:"Recorte maior da prova, bom para praticar sob tempo mais curto.", n:Math.min(20,total) },
      { id:"completo", name:"Simulado Completo", desc:"Usa tudo o que já está cadastrado no banco nesta fase do projeto.", n:total }
    ];
    modes.forEach(function(m){
      var card = el(
        '<div class="card modecard" data-mode="'+m.id+'">'+

  /* ============================================================
     QUIZ RUNNER
     ============================================================ */
  function startQuiz(count, topicFilter){
    var questions = pickQuestions(count, topicFilter);
    if (!questions.length){ alert("Não há questões suficientes para esse modo ainda."); return; }
    state.quiz = {
      active:true, topicFilter: topicFilter, questions: questions,
      answers:{}, current:0, startedAt: Date.now(), timerHandle:null
    };
    switchToView("run");
    renderRunner();
    state.quiz.timerHandle = setInterval(updateTimer, 1000);
  }
  /* Simula a Fase 2 do edital (Conhecimentos Gerais): sorteia um texto
     completo de Língua Portuguesa (10 questões) e um de Língua Inglesa
     (10 questões), reproduzindo o formato real — um texto, dez
     perguntas por idioma — em vez da amostragem ponderada por tópico
     usada nos modos de Conhecimentos Específicos. */
  /* lang: "pt" ou "en". size: "rapido" (texto curto, 5 questões) ou
     "completo" (texto integral, 10 questões, como na prova real).
     Sorteia UM texto entre os disponíveis daquele tamanho, para dar
     variedade a cada nova tentativa conforme o banco de textos cresce. */
  function startGeraisQuiz(lang, size){
    var topicId = lang === "en" ? "lingua-inglesa" : "lingua-portuguesa";
    var targetSize = size === "rapido" ? 5 : 10;
    var groups = geraisPassageGroups(topicId).filter(function(g){ return g.length === targetSize; });
    var questions = groups[Math.floor(Math.random()*groups.length)] || [];
    if (!questions.length){ alert("Não há questões suficientes para esse modo ainda."); return; }
    state.quiz = {
      active:true, topicFilter:null, isGerais:true, geraisLang: lang, geraisSize: size, questions: questions,
      answers:{}, current:0, startedAt: Date.now(), timerHandle:null
    };
    switchToView("run");
    renderRunner();
    state.quiz.timerHandle = setInterval(updateTimer, 1000);
  }
  function switchToView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById("view-"+id).classList.add("active");
  }
  function updateTimer(){
    var t = document.getElementById("quizTimer");
    if (!t || !state.quiz) return;
    var sec = Math.floor((Date.now()-state.quiz.startedAt)/1000);
    t.textContent = fmtTime(sec);
  }

  function renderRunner(){
    var q = state.quiz;
    var host = document.getElementById("view-run");
    var idx = q.current;
    var question = q.questions[idx];
    var answeredCount = Object.keys(q.answers).length;

    host.innerHTML = "";
    var headMeta = '<div class="runner-meta">'+
      '<span>'+(q.topicFilter ? topicById[q.topicFilter].name : (q.isGerais ? ("Conhecimentos Gerais — "+(q.geraisLang==="en"?"Inglês":"Português")+" ("+(q.geraisSize==="rapido"?"Rápido":"Completo")+")") : "Todos os tópicos"))+'</span>'+
      '<span class="timer" id="quizTimer">00:00</span>'+
      '<span>'+answeredCount+'/'+q.questions.length+' respondidas</span>'+
    '</div>';
    var head = el('<div class="runner-head"><h2>Questão '+(idx+1)+' de '+q.questions.length+'</h2>'+headMeta+'</div>');
    host.appendChild(head);

    var bar = el('<div class="progressbar"><i style="width:'+Math.round(((idx+1)/q.questions.length)*100)+'%"></i></div>');
    host.appendChild(bar);

    var t = topicById[question.topicId];
    var card = el('<div class="card qcard"></div>');
    var meta = el('<div class="qmeta">'+
      '<span class="badge '+question.tier.toLowerCase()+'">'+TIER_LABEL[question.tier]+'</span>'+
      '<span class="badge fmt">'+(t?t.name:"")+'</span>'+
      '<span class="badge fmt">'+FORMAT_LABEL[question.format]+'</span>'+
    '</div>');
    card.appendChild(meta);
    var qtext = el('<div class="qtext"></div>');
    qtext.innerHTML = question.stem;
    card.appendChild(qtext);

    var opts = el('<div class="opts"></div>');
    ["A","B","C","D","E"].forEach(function(letter){
      var chosen = q.answers[question.id] === letter;
      var opt = el('<div class="opt'+(chosen?' selected':'')+'" data-letter="'+letter+'">'+
        '<span class="letter">'+letter+'</span><div class="otext">'+question.options[letter]+'</div>'+
      '</div>');
      opt.addEventListener("click", function(){
        q.answers[question.id] = letter;
        renderRunner();
      });
      opts.appendChild(opt);
    });
    card.appendChild(opts);
    host.appendChild(card);

    var foot = el('<div class="runner-foot"></div>');
    var prevBtn = el('<button class="btn" '+(idx===0?"disabled":"")+'>← Anterior</button>');
    prevBtn.addEventListener("click", function(){ q.current = Math.max(0, q.current-1); renderRunner(); });
    var nextWrap = el('<div style="display:flex;gap:10px;"></div>');
    if (idx < q.questions.length-1){
      var nextBtn = el('<button class="btn primary">Próxima →</button>');
      nextBtn.addEventListener("click", function(){ q.current = Math.min(q.questions.length-1, q.current+1); renderRunner(); });
      nextWrap.appendChild(nextBtn);
    } else {
      var finishBtn = el('<button class="btn primary">Finalizar prova</button>');
      finishBtn.addEventListener("click", function(){
        var missing = q.questions.length - Object.keys(q.answers).length;
        if (missing>0 && !confirm(missing+" questão(ões) sem resposta. Finalizar mesmo assim?")) return;
        finishQuiz();
      });
      nextWrap.appendChild(finishBtn);
    }
    foot.appendChild(prevBtn); foot.appendChild(nextWrap);
    host.appendChild(foot);

    var jump = el('<div class="qjump"></div>');
    q.questions.forEach(function(qq, i){
      var b = el('<button>'+(i+1)+'</button>');
      if (q.answers[qq.id]) b.classList.add("answered");
      if (i===idx) b.classList.add("current");
      b.addEventListener("click", function(){ q.current = i; renderRunner(); });
      jump.appendChild(b);
    });
    host.appendChild(jump);

    updateTimer();
  }

  function finishQuiz(){
    var q = state.quiz;
    clearInterval(q.timerHandle);
    q.active = false;
    var elapsed = Math.floor((Date.now()-q.startedAt)/1000);

    var correct = 0;
    var topicStats = {};
    q.questions.forEach(function(question){
      var tId = question.topicId;
      topicStats[tId] = topicStats[tId] || { total:0, correct:0, name: topicById[tId].name };
      topicStats[tId].total++;
      var picked = q.answers[question.id];
      var isCorrect = picked === question.correct;
      if (isCorrect){ correct++; topicStats[tId].correct++; }
    });
    var pct = Math.round((correct / q.questions.length) * 100);

    var attempt = {
      mode: q.isGerais ? ("Conhecimentos Gerais — "+(q.geraisLang==="en"?"Inglês":"Português")+" ("+(q.geraisSize==="rapido"?"Rápido":"Completo")+")") : (q.topicFilter ? "Treino por tópico" : (q.questions.length<=10 ? "Treino Rápido" : (q.questions.length<=20 ? "Simulado Médio" : "Simulado Completo"))),
      topicFilter: q.topicFilter || null,
      isGerais: !!q.isGerais,
      geraisLang: q.geraisLang || null,
      geraisSize: q.geraisSize || null,
      total: q.questions.length,
      correct: correct,
      pct: pct,
      elapsedSec: elapsed,
      finishedAt: new Date().toISOString(),
      topicStats: topicStats,
      questionIds: q.questions.map(function(x){return x.id;}),
      answers: q.answers
    };

    state.lastResult = { attempt: attempt, questions: q.questions };
    saveAttempt(attempt);
    switchToView("results");
    renderResults(state.lastResult);
  }

  /* ============================================================
     RESULTS + REVISÃO
     ============================================================ */
  function renderResults(result, opts){
    opts = opts || {};
    var attempt = result.attempt, questions = result.questions;
    var host = document.getElementById("view-results");
    host.innerHTML = "";

    if (opts.missingCount){
      host.appendChild(el('<div class="card enfase-empty" style="margin-bottom:16px;padding:16px 20px;">'+opts.missingCount+' questão(ões) desta tentativa não existe(m) mais no banco atual e foi(ram) omitida(s) da revisão abaixo.</div>'));
    }

    var msg;
    if (attempt.pct>=70) msg = "Bom desempenho — o padrão da banca está entrando. Use a correção abaixo para fechar os últimos detalhes.";
    else if (attempt.pct>=50) msg = "Passou da linha de corte simbólica (50%), mas ainda dá para consolidar. Veja abaixo onde errou antes de repetir o treino.";
    else msg = "Está abaixo dos 50% — é exatamente o sinal para revisar a Área de Estudo destes tópicos antes de tentar de novo.";

    var hero = el('<div class="card score-hero" style="--pct:'+attempt.pct+'"></div>');
    hero.innerHTML =
      '<div class="score-ring" style="--pct:'+attempt.pct+'"><div class="inner"><div class="pct" style="color:'+pctColor(attempt.pct)+'">'+attempt.pct+'%</div><div class="lbl">'+attempt.correct+'/'+attempt.total+'</div></div></div>'+
      '<div class="score-copy"><h2>'+attempt.mode+'</h2><p>'+msg+' Tempo total: '+fmtTime(attempt.elapsedSec)+'.</p></div>';
    host.appendChild(hero);

    var bars = el('<div class="card" style="padding:24px 30px;"><h3 style="font-size:15px;margin-bottom:4px;">Desempenho por tópico</h3><div class="topicbars" id="topicBars"></div></div>');
    host.appendChild(bars);
    var tb = bars.querySelector("#topicBars");
    Object.keys(attempt.topicStats).forEach(function(tid){
      var s = attempt.topicStats[tid];
      var p = Math.round((s.correct/s.total)*100);
      var row = el('<div class="topicbar-row"><span>'+s.name+'</span><span class="track"><i style="width:'+p+'%;background:'+pctColor(p)+'"></i></span><span class="val">'+s.correct+'/'+s.total+'</span></div>');
      tb.appendChild(row);
    });

    var actions = el('<div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;"></div>');
    var reviewBtn = el('<button class="btn primary">Ver correção detalhada</button>');
    var homeBtn = el('<button class="btn">'+(opts.fromHistory ? "← Voltar ao histórico" : "Nova prova")+'</button>');
    homeBtn.addEventListener("click", function(){ switchTab(opts.fromHistory ? "history" : "home"); });
    if (!opts.fromHistory) actions.appendChild(reviewBtn);
    actions.appendChild(homeBtn);
    host.appendChild(actions);

    var reviewHost = el('<div id="reviewHost"></div>');
    host.appendChild(reviewHost);

    if (opts.fromHistory){
      reviewHost.dataset.built = "1";
      renderReview(reviewHost, attempt, questions);
    } else {
      reviewBtn.addEventListener("click", function(){
        if (reviewHost.dataset.built){ reviewHost.style.display = reviewHost.style.display==="none"?"block":"none"; return; }
        reviewHost.dataset.built = "1";
        renderReview(reviewHost, attempt, questions);
      });
    }
  }

  function openHistoryDetail(attempt){
    var ids = attempt.questionIds || [];
    var questions = ids.map(function(id){ return QUESTIONS.find(function(q){ return q.id===id; }); }).filter(Boolean);
    var missingCount = ids.length - questions.length;
    switchToView("results");
    renderResults({ attempt: attempt, questions: questions }, { fromHistory:true, missingCount: missingCount });
    document.getElementById("view-results").scrollIntoView({behavior:"smooth", block:"start"});
  }

  function renderReview(host, attempt, questions){
    var wrap = el('<div style="margin-top:10px;"><h3 style="font-size:16px;margin:26px 0 4px;">Correção questão a questão</h3><p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;">Agora liberado — cada explicação foi escrita para ensinar o conceito, não só justificar o gabarito.</p></div>');
    questions.forEach(function(question, i){
      var picked = attempt.answers[question.id];
      var isCorrect = picked === question.correct;
      var t = topicById[question.topicId];
      var item = el('<div class="card review-item"></div>');
      var meta = el('<div class="qmeta">'+
        '<span class="badge '+question.tier.toLowerCase()+'">'+TIER_LABEL[question.tier]+'</span>'+
        '<span class="badge fmt">'+(t?t.name:"")+'</span>'+
        '<span class="badge fmt">'+FORMAT_LABEL[question.format]+'</span>'+
        '<span class="verdict '+(isCorrect?'ok':'no')+'">'+(isCorrect?"Você acertou":(picked?"Você errou":"Não respondida"))+'</span>'+
      '</div>');
      item.appendChild(meta);
      var qtext = el('<div class="qtext" style="font-size:15.5px;margin-bottom:16px;"></div>');
      qtext.innerHTML = "<b>"+(i+1)+".</b> "+question.stem;
      item.appendChild(qtext);

      ["A","B","C","D","E"].forEach(function(letter){
        var cls = "review-opt";
        if (letter===question.correct) cls += " correct";
        else if (letter===picked) cls += " wrong-pick";
        var tag = letter===question.correct ? " ✓ gabarito" : (letter===picked ? " ✗ sua resposta" : "");
        var o = el('<div class="'+cls+'"><span class="letter">'+letter+'</span><div class="otext">'+question.options[letter]+tag+'</div></div>');
        item.appendChild(o);
      });

      var exp = question.explanation;
      var whyList = Object.keys(exp.wrong||{}).map(function(l){
        return '<li><b>'+l+':</b> '+exp.wrong[l]+'</li>';
      }).join("");
      var explainBox = el('<div class="explain">'+
        '<h4>Explicação</h4>'+
        '<div class="core"><b>Conceito central:</b> '+exp.core+'</div>'+
        '<div class="core">'+exp.detail+'</div>'+
        (whyList ? '<h4 style="margin-top:14px;">Por que as outras erram</h4><ul class="why">'+whyList+'</ul>' : '')+
        '<button class="btn ghost studylink" data-topic="'+question.topicId+'">📖 Estudar este assunto na Área de Estudo →</button>'+
        '<div class="source-note">Questão inédita, no estilo Cesgranrio — mesmo tema/formato de: '+question.insp+'</div>'+
      '</div>');
      item.appendChild(explainBox);
      wrap.appendChild(item);
    });
    host.innerHTML = "";
    host.appendChild(wrap);
    host.querySelectorAll(".studylink").forEach(function(btn){
      btn.addEventListener("click", function(){
        switchTab("study");
        setTimeout(function(){ openStudyTopic(btn.dataset.topic); }, 30);
      });
    });
  }

    var vagas = el('<div class="card infodoc"></div>');
    var rows = ENFASES.map(function(ef){
      return '<tr'+(ef.id===enfase.id?' class="hi"':'')+'><td>'+ef.nome.replace("Análise de Sistemas — ","")+(ef.id===enfase.id?' ⭐':'')+'</td><td class="dt">'+ef.vagaImediata+'</td>'+
        '<td class="dt">'+ef.cr.AC+'</td><td class="dt">'+ef.cr.PCD+'</td><td class="dt">'+ef.cr.PN+'</td><td class="dt">'+(ef.cr.PI||0)+'</td><td class="dt">'+(ef.cr.PQ||0)+'</td><td class="dt"><b>'+ef.crTotal+'</b></td></tr>';
    }).join("");
    vagas.innerHTML =
      '<h2>Vagas de TI (Anexo I) — todas no polo Rio de Janeiro</h2>'+
      '<table><thead><tr><th>Ênfase</th><th>Vaga imediata</th><th>AC</th><th>PCD</th><th>PN</th><th>PI</th><th>PQ</th><th>Total CR</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<p style="margin-top:10px;">CR = Vagas + Cadastro de Reserva. ⭐ marca a ênfase selecionada atualmente no simulador. Remuneração do cargo (todas as ênfases): salário básico R$ 8.647,34, com garantia de remuneração mínima de R$ 14.973,62.</p>'+
      '<div class="note"><b>Nota:</b> os dados de vaga aqui são só uma referência de contexto — a decisão de qual ênfase prestar já foi feita nesta conversa com base no seu perfil, e não muda automaticamente se você só trocar a área no seletor de provas.</div>';
    host.appendChild(vagas);
  }

  /* ============================================================
     PLANO DE ESTUDOS
     Gerado dinamicamente a partir da data de hoje até a prova
     (29/11/2026) e dos tópicos já cadastrados para a ênfase
     selecionada — não é um cronograma fixo digitado uma vez, é
     recalculado a cada visita, então nunca fica desatualizado.
     ============================================================ */
  function addDays(date, n){ var d = new Date(date.getTime()); d.setDate(d.getDate()+n); return d; }
  function fmtDate(date){ return date.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" }); }

  function renderPlano(){
    var host = document.getElementById("view-plano");
    host.innerHTML = "";
    var enfase = enfaseById[state.enfase] || ENFASES[0];

    var EXAM_DATE = new Date("2026-11-29T00:00:00");
    var now = new Date();
    var msPerDay = 86400000;
    var daysLeft = Math.max(1, Math.ceil((EXAM_DATE - now) / msPerDay));

    host.appendChild(el(
      '<header class="pagehead">'+
        '<span class="eyebrow"><span class="dot"></span>'+enfase.nome+'</span>'+
        '<h1>Plano de estudos até a prova</h1>'+
        '<p>Roteiro calculado a partir de hoje até 29/11/2026, cruzando os tópicos já cadastrados para esta ênfase com um cronograma de repetição espaçada. É uma referência para organizar o ritmo, recalculada toda vez que você abre esta aba — ajuste ao seu tempo real disponível.</p>'+
      '</header>'
    ));

    if (daysLeft <= 0){
      host.appendChild(el('<div class="card infodoc"><p><b>A data de prova prevista (29/11/2026) já passou ou é hoje.</b> Se o edital foi retificado com nova data, os cálculos abaixo deixam de valer — confira o cronograma oficial na aba Concurso.</p></div>'));
      return;
    }

    var weeksLeft = Math.floor(daysLeft/7);
    var hero = el('<div class="card infodoc" style="text-align:center;"></div>');
    hero.innerHTML =
      '<div style="display:flex;justify-content:center;gap:48px;flex-wrap:wrap;">'+
        '<div><div style="font-family:Manrope,sans-serif;font-weight:800;font-size:38px;color:var(--accent-strong);">'+daysLeft+'</div><div style="color:var(--ink-soft);font-size:13px;">dias até a prova</div></div>'+
        '<div><div style="font-family:Manrope,sans-serif;font-weight:800;font-size:38px;color:var(--accent-strong);">'+weeksLeft+'</div><div style="color:var(--ink-soft);font-size:13px;">semanas cheias restantes</div></div>'+
      '</div>';
    host.appendChild(hero);

    /* ---- a ciência por trás da repetição espaçada ---- */
    var science = el('<div class="card infodoc"></div>');
    science.innerHTML =
      '<h2>Por que repetir espaçado funciona melhor do que decorar de uma vez</h2>'+
      '<p>A curva do esquecimento (Ebbinghaus) mostra que, sem revisão, a maior parte do que se estuda é esquecida em poucos dias. Repetir a mesma informação em intervalos crescentes é a forma mais estudada de empurrar esse conteúdo da memória de curto prazo para a de longo prazo — a ponto de a resposta certa "vir na hora", quase por instinto, no dia da prova.</p>'+
      '<p>Isso não é garantia estatística para este concurso específico — é o mesmo princípio por trás de qualquer método de repetição espaçada (o usado, por exemplo, em aplicativos de idiomas). Adaptamos os intervalos abaixo ao seu calendário real:</p>'+
      '<table><thead><tr><th>Quando</th><th>O que fazer</th></tr></thead><tbody>'+
        '<tr><td class="dt">Dia 0</td><td>Ler a Área de Estudo do tópico + Treino por Tópico (10-15 questões)</td></tr>'+
        '<tr><td class="dt">Dia 1</td><td>Revisão rápida: reler só os erros do treino anterior</td></tr>'+
        '<tr><td class="dt">Dia 3</td><td>Novo Treino por Tópico do mesmo assunto</td></tr>'+
        '<tr><td class="dt">Dia 7</td><td>Novo treino, já misturado com outro tópico no Treino Rápido</td></tr>'+
        '<tr><td class="dt">Dia 16</td><td>Revisão dentro de um Simulado Médio</td></tr>'+
        '<tr><td class="dt">Dia 30</td><td>Revisão final dentro de um Simulado Completo</td></tr>'+
      '</tbody></table>'+
      '<div class="note"><b>Na prática:</b> você não precisa controlar essas datas manualmente — o histórico da aba Histórico já registra quando e como você foi em cada tentativa. Use-o para ver há quanto tempo não revisa um tópico.</div>';
    host.appendChild(science);

    /* ---- fases do plano, com base nos tópicos reais da ênfase ---- */
    var topicsByTier = { P1:[], P2:[], P3:[] };
    topicsForEnfase(enfase.id).forEach(function(t){
      if (GERAIS_TOPIC_IDS.indexOf(t.id) === -1 && topicsByTier[t.tier]) topicsByTier[t.tier].push(t.name);
    });
    var totalEspecificos = topicsByTier.P1.length + topicsByTier.P2.length + topicsByTier.P3.length;

    var finalDays = Math.min(7, Math.max(3, Math.round(daysLeft*0.08)));
    var remaining = daysLeft - finalDays;
    var p1Days = Math.max(1, Math.round(remaining*0.40));
    var p2Days = Math.max(1, Math.round(remaining*0.28));
    var p3Days = Math.max(1, Math.round(remaining*0.17));
    var p4Days = Math.max(1, remaining - p1Days - p2Days - p3Days);

    var cursor = now;
    var phase1Start = cursor; var phase1End = addDays(cursor, p1Days); cursor = phase1End;
    var phase2Start = cursor; var phase2End = addDays(cursor, p2Days); cursor = phase2End;
    var phase3Start = cursor; var phase3End = addDays(cursor, p3Days); cursor = phase3End;
    var phase4Start = cursor; var phase4End = addDays(cursor, p4Days); cursor = phase4End;
    var phase5Start = cursor; var phase5End = EXAM_DATE;

    function pctAte(n){ return totalEspecificos ? Math.round((n/totalEspecificos)*100) : 0; }
    var pctFase1 = pctAte(topicsByTier.P1.length);
    var pctFase2 = pctAte(topicsByTier.P1.length + topicsByTier.P2.length);
    var pctFase3 = pctAte(totalEspecificos);

    var phases = el('<div class="card infodoc"></div>');
    phases.innerHTML =
      '<h2>Roteiro em 5 fases</h2>'+
      '<table><thead><tr><th>Fase</th><th>Período</th><th>Foco</th><th>Cobertura acumulada</th></tr></thead><tbody>'+
        '<tr class="hi"><td>1 · Núcleo (Prioridade 1)</td><td class="dt">'+fmtDate(phase1Start)+' – '+fmtDate(phase1End)+'</td>'+
          '<td>'+(topicsByTier.P1.length ? topicsByTier.P1.join(", ") : "tópicos de Prioridade 1 desta ênfase")+'. Comece também Português/Inglês em paralelo, 2 sessões por semana.</td>'+
          '<td class="dt">'+pctFase1+"% do Específicas"+'</td></tr>'+
        '<tr><td>2 · Reforço (Prioridade 2)</td><td class="dt">'+fmtDate(phase2Start)+' – '+fmtDate(phase2End)+'</td>'+
          '<td>'+(topicsByTier.P2.length ? topicsByTier.P2.join(", ") : "tópicos de Prioridade 2 desta ênfase")+'. Mantenha revisão espaçada da Prioridade 1 (Simulado Médio misturando P1+P2).</td>'+
          '<td class="dt">'+pctFase2+"% do Específicas"+'</td></tr>'+
        '<tr><td>3 · Itens sem precedente (Prioridade 3)</td><td class="dt">'+fmtDate(phase3Start)+' – '+fmtDate(phase3End)+'</td>'+
          '<td>'+(topicsByTier.P3.length ? topicsByTier.P3.join(", ") : "tópicos de Prioridade 3 desta ênfase")+'. Aumente a frequência de Conhecimentos Gerais para 3x/semana.</td>'+
          '<td class="dt">'+pctFase3+"% do Específicas"+'</td></tr>'+
        '<tr><td>4 · Simulados completos</td><td class="dt">'+fmtDate(phase4Start)+' – '+fmtDate(phase4End)+'</td>'+
          '<td>Alterne Simulado Completo (Específicas) e Simulado de Conhecimentos Gerais, cronometrando as 4h30 reais. Depois de cada um, volte à Área de Estudo só dos tópicos com pior desempenho na aba Resultados.</td>'+
          '<td class="dt">100%</td></tr>'+
        '<tr class="hi"><td>5 · Reta final</td><td class="dt">'+fmtDate(phase5Start)+' – '+fmtDate(phase5End)+'</td>'+
          '<td>Sem conteúdo novo. Revisão leve dos tópicos de Prioridade 1 e de Português/Inglês, sono em dia. Estudo de última hora tende a ajudar pouco a memória de longo prazo — o objetivo aqui é chegar descansado, não "descobrir" assunto novo.</td>'+
          '<td class="dt">manutenção</td></tr>'+
      '</tbody></table>'+
      '<div class="note"><b>Isto é uma estimativa de ritmo, não uma promessa de nota:</b> os percentuais mostram cobertura de tópicos do Anexo IV já cadastrados no simulador, calculados sobre o banco desta ênfase hoje — ajuste os prazos à sua realidade (trabalho, outras obrigações) sem culpa.</div>';
    host.appendChild(phases);
  }

  /* ---------- boot ---------- */
  renderHome();
})();
</script>
