<title>Simulador Cesgranrio TRANSPETRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Literata:opsz,wght@18..36,400;18..36,500;18..36,600&family=Literata:ital,opsz,wght@1,18..36,500&display=swap">
<style>
  :root{
    --bg:#eceef5;
    --surface:#ffffff;
    --surface-2:#e2e5f0;
    --ink:#1a1e2e;
    --ink-soft:#585f78;
    --line:#d3d7e6;
    --accent:#3a45a8;
    --accent-strong:#262f80;
    --accent-soft:#e1e3f6;
    --amber:#96631b;
    --amber-soft:#f3e6cd;
    --good:#1e7a4c;
    --good-soft:#dcf0e4;
    --bad:#b3392f;
    --bad-soft:#f7e0dd;
    --p1:#3a45a8;
    --p2:#96631b;
    --p3:#726b8a;
    --shadow: 0 1px 2px rgba(20,20,40,.05), 0 10px 26px -14px rgba(20,20,40,.25);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141f;
      --surface:#191c2b;
      --surface-2:#212437;
      --ink:#e8e9f5;
      --ink-soft:#9ea3c0;
      --line:#2c2f47;
      --accent:#8891ec;
      --accent-strong:#aeb5f5;
      --accent-soft:#242a52;
      --amber:#e0ac5c;
      --amber-soft:#332711;
      --good:#5bcf94;
      --good-soft:#153726;
      --bad:#f1897d;
      --bad-soft:#3a1c19;
      --p1:#8891ec;
      --p2:#e0ac5c;
      --p3:#b3abd6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141f;
    --surface:#191c2b;
    --surface-2:#212437;
    --ink:#e8e9f5;
    --ink-soft:#9ea3c0;
    --line:#2c2f47;
    --accent:#8891ec;
    --accent-strong:#aeb5f5;
    --accent-soft:#242a52;
    --amber:#e0ac5c;
    --amber-soft:#332711;
    --good:#5bcf94;
    --good-soft:#153726;
    --bad:#f1897d;
    --bad-soft:#3a1c19;
    --p1:#8891ec;
    --p2:#e0ac5c;
    --p3:#b3abd6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  h1,h2,h3,h4{ font-family:"Manrope",sans-serif; font-weight:800; text-wrap:balance; margin:0; color:var(--ink); }
  .stem, .qtext{ font-family:"Literata", Georgia, serif; }
  code, .mono{ font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .app{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- TOPBAR ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    max-width:1080px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:1px; margin-right:auto; }
  .brand .b1{ font-weight:800; font-size:15px; letter-spacing:-.01em; }
  .brand .b2{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  nav.tabs{ display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:10px; }
  nav.tabs button{
    border:none; background:transparent; padding:8px 16px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  nav.tabs button:hover:not(.active){ color:var(--ink); }

  .wrap{ max-width:1080px; margin:0 auto; padding:36px 24px 100px; width:100%; flex:1; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- shared bits ---------- */
  .eyebrow{ font-family:"Manrope",sans-serif; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); }
  .pagehead{ margin-bottom:30px; }
  .pagehead h1{ font-size:clamp(24px,3vw,32px); margin-bottom:8px; }
  .pagehead p{ color:var(--ink-soft); max-width:62ch; font-size:14.5px; margin:0; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px; }
  .badge.p1{ background:var(--accent-soft); color:var(--accent-strong); }
  .badge.p2{ background:var(--amber-soft); color:var(--amber); }
  .badge.p3{ background:var(--surface-2); color:var(--p3); }
  .badge.fmt{ background:var(--surface-2); color:var(--ink-soft); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  .btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px; padding:10px 18px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.block{ width:100%; justify-content:center; }

  /* ---------- HOME / MODE PICKER ---------- */
  .modegrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:8px; }
  .modecard{ padding:22px 22px 20px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .modecard:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .modecard h3{ font-size:16.5px; margin-bottom:6px; }
  .modecard p{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; min-height:34px; }
  .modecard .n{ font-family:"Manrope",sans-serif; font-weight:800; font-size:26px; color:var(--accent-strong); }
  .modecard .n small{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-left:4px; }

  .topicpick{ margin-top:14px; display:none; }
  .topicpick.show{ display:block; }
  .topicpick select{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; margin-bottom:10px; }

  .stat-strip{ display:flex; gap:26px; flex-wrap:wrap; margin-top:30px; padding-top:22px; border-top:1px solid var(--line); }
  .stat-strip .stat .n{ font-weight:800; font-size:20px; color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .stat-strip .stat .l{ font-size:12px; color:var(--ink-soft); }

  /* ---------- QUIZ RUNNER ---------- */
  .runner-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .runner-meta{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--ink-soft); font-weight:700; }
  .runner-meta .timer{ font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--surface-2); padding:4px 10px; border-radius:7px; }
  .progressbar{ height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .progressbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); border-radius:99px; }

  .qcard{ padding:28px 30px 26px; }
  .qcard .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .qcard .qtext{ font-size:17px; line-height:1.6; margin-bottom:22px; white-space:pre-wrap; }
  .qtext table{ border-collapse:collapse; font-family:ui-monospace,monospace; font-size:13px; margin:12px 10px 12px 0; display:inline-table; vertical-align:top; font-variant-numeric:tabular-nums; }
  .qtext th,.qtext td{ border:1px solid var(--line); padding:5px 11px; text-align:left; }
  .qtext th{ background:var(--surface-2); }
  .qtext .passage{ background:var(--surface-2); border-radius:10px; padding:18px 22px; margin:0 0 20px; font-size:14.5px; line-height:1.85; white-space:normal; }
  .qtext .passage-title{ font-family:"Manrope",sans-serif; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-strong); margin-bottom:10px; display:block; }
  .qtext .passage .ln{ display:inline-block; min-width:20px; color:var(--ink-soft); font-family:ui-monospace,monospace; font-size:10.5px; margin-right:6px; user-select:none; }
  .qtext .passage-source{ font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:10px; display:block; }
  .qtext .passage-q{ font-weight:600; }
  pre.codeblock{ background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:14px 16px; font-size:13px; overflow-x:auto; margin:14px 0; font-family:ui-monospace,monospace; line-height:1.5; max-width:100%; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ display:flex; gap:12px; align-items:flex-start; padding:13px 16px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); }
  .opt:hover{ border-color:var(--accent); }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .opt .letter{ font-family:"Manrope",sans-serif; font-weight:800; font-size:12.5px; width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .opt.selected .letter{ background:var(--accent); color:#fff; }
  .opt .otext{ font-size:14.5px; line-height:1.5; }

  .runner-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px; }
  .qjump{ display:flex; flex-wrap:wrap; gap:6px; margin-top:24px; }
  .qjump button{ width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:ui-monospace,monospace; }
  .qjump button.answered{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .qjump button.current{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---------- RESULTS ---------- */
  .score-hero{ display:flex; gap:34px; align-items:center; padding:32px 34px; flex-wrap:wrap; }
  .score-ring{ width:126px; height:126px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0); }
  .score-ring .inner{ width:98px; height:98px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring .pct{ font-weight:800; font-size:24px; font-family:"Manrope",sans-serif; }
  .score-ring .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .score-copy h2{ font-size:22px; margin-bottom:6px; }
  .score-copy p{ color:var(--ink-soft); font-size:14px; margin:0; max-width:52ch; }

  .topicbars{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  .topicbar-row{ display:grid; grid-template-columns:200px 1fr 60px; align-items:center; gap:14px; font-size:13px; }
  .topicbar-row .track{ height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .topicbar-row .track > i{ display:block; height:100%; border-radius:99px; }
  .topicbar-row .val{ text-align:right; font-family:ui-monospace,monospace; font-weight:700; color:var(--ink-soft); }

  .review-item{ padding:22px 26px; margin-top:14px; }
  .review-item .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .review-item .verdict{ margin-left:auto; font-size:12px; font-weight:800; padding:3px 11px; border-radius:99px; }
  .review-item .verdict.ok{ background:var(--good-soft); color:var(--good); }
  .review-item .verdict.no{ background:var(--bad-soft); color:var(--bad); }
  .review-item .qtext{ font-size:15.5px; margin-bottom:16px; }
  .review-opt{ padding:10px 14px; border-radius:9px; font-size:13.5px; margin-bottom:6px; border:1px solid var(--line); display:flex; gap:10px; }
  .review-opt .letter{ font-weight:800; font-family:"Manrope",sans-serif; }
  .review-opt.correct{ background:var(--good-soft); border-color:transparent; }
  .review-opt.wrong-pick{ background:var(--bad-soft); border-color:transparent; }
  .explain{ margin-top:16px; background:var(--surface-2); border-radius:10px; padding:16px 18px; font-size:13.5px; }
  .explain h4{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:8px; }
  .explain .core{ margin-bottom:10px; }
  .explain .why{ margin:0; padding-left:18px; }
  .explain .why li{ margin-bottom:5px; }
  .explain .studylink{ margin-top:12px; display:inline-block; font-size:12.5px; font-weight:700; }
  .source-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; font-style:italic; }

  /* ---------- STUDY AREA ---------- */
  .topiclist{ display:flex; flex-direction:column; gap:10px; }
  .topicrow{ display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; }
  .topicrow:hover{ border-color:var(--accent); }
  .topicrow .ti{ flex:1; }
  .topicrow h3{ font-size:15px; margin-bottom:2px; }
  .topicrow p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .topicrow .chev{ color:var(--ink-soft); }

  .studydoc{ padding:30px 34px 34px; }
  .studydoc h2{ font-size:22px; margin-bottom:4px; }
  .studydoc .ref{ font-size:12px; color:var(--ink-soft); font-family:ui-monospace,monospace; margin-bottom:22px; display:block; }
  .studydoc h4{ font-size:14px; margin:22px 0 8px; color:var(--accent-strong); }
  .studydoc p{ font-size:14.5px; margin:0 0 12px; max-width:74ch; }
  .studydoc ul, .studydoc ol{ font-size:14.5px; padding-left:20px; margin:0 0 12px; max-width:74ch; }
  .studydoc li{ margin-bottom:5px; }
  .studydoc table{ width:100%; border-collapse:collapse; margin:14px 0; font-size:13.5px; }
  .studydoc th,.studydoc td{ text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  .studydoc th{ font-family:"Manrope",sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .studydoc code{ background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:.92em; }
  .studydoc .tip{ background:var(--accent-soft); border-radius:10px; padding:14px 18px; font-size:13.5px; margin:16px 0; }
  .studydoc .tip b{ color:var(--accent-strong); }

  /* ---------- HISTORY ---------- */
  .hist-row{ display:flex; align-items:center; gap:16px; padding:16px 20px; margin-bottom:10px; cursor:pointer; }
  .hist-row:hover{ border-color:var(--accent); }
  .hist-row .hd{ flex:1; }
  .hist-row .mode{ font-weight:700; font-size:14px; }
  .hist-row .when{ font-size:12px; color:var(--ink-soft); }
  .hist-row .sc{ font-family:ui-monospace,monospace; font-weight:800; font-size:16px; }
  .hist-row .chev{ color:var(--ink-soft); font-size:14px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty .big{ font-size:34px; margin-bottom:10px; }

  /* ---------- ÁREA (ÊNFASE) SELECTOR ---------- */
  .enfase-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .enfase-pill{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:9px 15px; border-radius:11px; border:1px solid var(--line); background:var(--surface); cursor:pointer; min-width:150px; }
  .enfase-pill:hover{ border-color:var(--accent); }
  .enfase-pill.active{ border-color:var(--accent); background:var(--accent-soft); }
  .enfase-pill .en{ font-weight:700; font-size:13px; }
  .enfase-pill.active .en{ color:var(--accent-strong); }
  .enfase-pill .ev{ font-size:11px; color:var(--ink-soft); }
  .enfase-pill .elock{ font-size:10.5px; font-weight:700; color:var(--muted); }
  .enfase-empty{ padding:40px 30px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .enfase-empty b{ color:var(--ink); }

  /* ---------- CONCURSO (INFO) ---------- */
  .infodoc{ padding:30px 34px 34px; margin-bottom:20px; }
  .infodoc h2{ font-size:19px; margin-bottom:14px; }
  .infodoc table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:6px; }
  .infodoc th,.infodoc td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  .infodoc th{ font-family:"Manrope",sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .infodoc td.dt{ font-family:ui-monospace,monospace; white-space:nowrap; color:var(--accent-strong); font-weight:700; }
  .infodoc tr.hi td{ background:var(--accent-soft); font-weight:700; }
  .infodoc p{ font-size:14px; color:var(--ink-soft); margin:0 0 10px; max-width:74ch; }
  .infodoc .note{ background:var(--amber-soft); border-radius:10px; padding:12px 16px; font-size:13px; color:var(--amber); margin-top:14px; }

  footer.appfoot{ text-align:center; padding:26px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); }

  @media (max-width:640px){
    .topbar-row{ flex-wrap:wrap; }
    nav.tabs{ order:3; width:100%; }
    .qcard{ padding:20px 18px; }
    .score-hero{ flex-direction:column; text-align:center; }
    .topicbar-row{ grid-template-columns:110px 1fr 44px; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="b1">Simulador Cesgranrio · TI</span>
        <span class="b2">TRANSPETRO 2026 · estilo Cesgranrio</span>
      </div>
      <nav class="tabs" id="mainTabs">
        <button data-tab="home" class="active">Provas</button>
        <button data-tab="study">Área de Estudo</button>
        <button data-tab="history">Histórico</button>
        <button data-tab="concurso">Concurso</button>
        <button data-tab="plano">Plano de Estudos</button>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <!-- ===================== HOME / MODE PICKER ===================== -->
    <section class="view active" id="view-home"></section>

    <!-- ===================== QUIZ RUNNER ===================== -->
    <section class="view" id="view-run"></section>

    <!-- ===================== RESULTS ===================== -->
    <section class="view" id="view-results"></section>

    <!-- ===================== STUDY AREA ===================== -->
    <section class="view" id="view-study"></section>

    <!-- ===================== HISTORY ===================== -->
    <section class="view" id="view-history"></section>

    <!-- ===================== CONCURSO (INFO) ===================== -->
    <section class="view" id="view-concurso"></section>

    <!-- ===================== PLANO DE ESTUDOS ===================== -->
    <section class="view" id="view-plano"></section>

  </div>

  <footer class="appfoot">Banco de questões em construção área por área — Processos de Negócios já cobre as Prioridades 1, 2 e 3 do padrão Cesgranrio. Ver a aba "Concurso" para dados do edital.</footer>
</div>

<script>
/* ============================================================
   ÊNFASES (ÁREAS) DO CONCURSO — dados do Anexo I do edital
   Cada uma tem seu polo, vaga imediata e cadastro de reserva reais.
   Hoje só "processos-negocio" tem banco de questões: foi a área
   recomendada para o perfil do usuário (dev/engenharia de software).
   ============================================================ */
window.ENFASES = [
  { id:"processos-negocio", nome:"Análise de Sistemas — Processos de Negócios", polo:"Rio de Janeiro", vagaImediata:"1 vaga (PCD)", cr:{AC:5,PCD:3,PN:3,PI:0,PQ:0}, crTotal:11 },
  { id:"infraestrutura", nome:"Análise de Sistemas — Infraestrutura", polo:"Rio de Janeiro", vagaImediata:"1 vaga (AC)", cr:{AC:6,PCD:2,PN:3,PI:0,PQ:0}, crTotal:11 },

      <li>Scrum entrega em blocos de tempo fixo (Sprint); Kanban entrega assim que um item termina o fluxo.</li>
    </ul>

    <h4>Declaração de escopo</h4>
    <p>Costuma incluir: descrição do escopo do produto, critérios de aceitação, entregas (deliverables), exclusões explícitas do projeto, premissas e restrições. É diferente do Termo de Abertura (que autoriza o projeto) e da EAP (que decompõe o escopo já declarado).</p>

    <h4>Product Backlog × Sprint Backlog</h4>
    <p><b>Product Backlog</b>: lista única, ordenada e dinâmica de tudo que pode ser necessário no produto — mantida e priorizada pelo Product Owner. <b>Sprint Backlog</b>: o subconjunto de itens selecionados para a Sprint atual, mais o plano do time para entregá-los.</p>

    <h4>PMBOK 7ª edição — o que mudou</h4>
    <p>A partir da 7ª edição, o guia deixou de ser organizado centralmente em torno de 5 grupos de processos e 10 áreas de conhecimento (estrutura clássica das edições anteriores, ainda cobrada nas provas antigas) e passou a ser estruturado em torno de <b>12 princípios de gerenciamento de projetos</b> e <b>8 domínios de performance</b>. O edital de 2026 cita explicitamente "PMBOK 7ª edição" — vale conhecer essa mudança estrutural, mesmo sem precedente nas provas antigas (que são todas anteriores a 2021, ano de publicação da 7ª edição).</p>

    <h4>Story Points</h4>
    <p>Medem esforço/complexidade/incerteza RELATIVOS de um item comparado a outros já estimados — não são uma unidade de tempo (hora/dia). É essa natureza relativa que costuma ser cobrada.</p>
    <p><b>A escala do Planning Poker</b> (técnica mais usada para estimar em Story Points) segue uma progressão não linear, próxima de Fibonacci, exatamente para forçar o time a discutir quando a diferença de estimativa entre dois itens for pequena demais para importar: <code>0, 1, 2, 3, 5, 8, 13, 20, 40, 100</code>. Repare que não é a sequência de Fibonacci "pura" (que teria 21, 34 em vez de 20, 40) — é a versão adaptada e arredondada que os baralhos de Planning Poker realmente usam, e a banca já testou exatamente essa diferença sutil entre a sequência real e outras sequências numéricas parecidas (0 a 10 em ordem crescente, potências de 2, progressão aritmética simples).</p>

    <h4>Gestão de projeto × gestão de produto</h4>
    <p><b>Projeto</b>: entrega um resultado específico, com início e fim definidos, dentro de prazo/escopo. <b>Produto</b>: evolução contínua ao longo de todo o ciclo de vida, sem fim predeterminado, orientada por valor de mercado/necessidade do usuário.</p>

    <h4>Estruturas organizacionais</h4>
    <table>
      <tr><th>Estrutura</th><th>A quem o time se reporta</th><th>Autoridade do gerente de projetos</th></tr>
      <tr><td>Funcional</td><td>gerente funcional (por especialidade)</td><td>baixa ou inexistente</td></tr>
      <tr><td>Matricial</td><td>dupla subordinação (funcional + projeto)</td><td>compartilhada</td></tr>
      <tr><td>Projetizada</td><td>diretamente ao gerente de projetos</td><td>ampla</td></tr>
    </table>

    <h4>Escritório de Projetos (PMO)</h4>
    <p><b>De suporte</b>: papel consultivo — modelos, boas práticas, treinamento, baixo controle. <b>De controle</b>: exige conformidade a um framework, controle moderado. <b>Diretivo</b>: assume e gerencia os projetos diretamente, alto controle.</p>

    <h4>Áreas de conhecimento clássicas (PMBOK anterior à 7ª ed.)</h4>
    <p>Integração, Escopo, Cronograma, Custos, Qualidade, Recursos, Comunicações, <b>Riscos</b> (identificar/analisar/planejar resposta/monitorar eventos incertos), Aquisições e Partes Interessadas — cada uma cobre um aspecto de gestão diferente do projeto.</p>

    <div class="tip"><b>Como a banca cobra:</b> caminho crítico é cálculo puro — pratique montar o diagrama de rede na mão. Scrum costuma vir como "associe o papel/evento à descrição certa" ou cenário ("quem deve remover este impedimento?").</div>

    <h4>Conectivos e tabela-verdade do condicional</h4>
    <p>A proposição P → Q ("se P, então Q") só é <b>falsa</b> quando P é verdadeira e Q é falsa — em todos os outros três casos, é verdadeira. É a tabela-verdade mais cobrada e mais errada por intuição.</p>

    <h4>Negação de proposições — a pegadinha mais comum</h4>
    <ul>
      <li>Negação de <b>P → Q</b> é <b>P ∧ ¬Q</b> (não é "se não P, então não Q" — esse é um erro clássico).</li>
      <li>Negação de <b>P ∧ Q</b> (De Morgan) é <b>¬P ∨ ¬Q</b>.</li>
      <li>Negação de <b>P ∨ Q</b> (De Morgan) é <b>¬P ∧ ¬Q</b>.</li>
      <li>Negação de <b>∀x P(x)</b> ("para todo x, P(x)") é <b>∃x ¬P(x)</b> ("existe x tal que não P(x)").</li>
      <li>Negação de <b>∃x P(x)</b> é <b>∀x ¬P(x)</b>.</li>

    <p>Dada P → Q: a <b>contrapositiva</b> (¬Q → ¬P) é logicamente <b>equivalente</b> à original. A <b>recíproca</b> (Q → P) e a <b>inversa</b> (¬P → ¬Q) NÃO são equivalentes à original — são pegadinhas frequentes.</p>

    <h4>Validade de argumentos (silogismos)</h4>
    <p>Um argumento é válido quando, SE as premissas forem verdadeiras, a conclusão necessariamente também é. Clássico: "Todo A é B" + "X é A" ⊢ "X é B" (modus ponens aplicado a um quantificador universal).</p>

    <h4>Contagem de linhas da tabela-verdade</h4>

  summary:"NIST SP 800-61, threat intel/hunting, MITRE ATT&CK/CAPEC, STRIDE, pentest, ISO 31000/22301, nuvem.",
  html: `
    <h4>Resposta a incidentes (NIST SP 800-61)</h4>
    <p>Quatro fases, nesta ordem: <b>Preparação</b> (antes de qualquer incidente) → <b>Detecção e Análise</b> → <b>Contenção, Erradicação e Recuperação</b> → <b>Atividades Pós-Incidente</b> (lições aprendidas).</p>

    <h4>Threat Intelligence × Threat Hunting</h4>
    <p><b>Threat Intelligence</b>: coleta, análise e disseminação de informações sobre ameaças (atores, táticas, indicadores de comprometimento) para embasar decisões de defesa. <b>Threat Hunting</b>: busca proativa e manual por ameaças que já podem estar no ambiente, mas que as ferramentas automatizadas ainda não detectaram.</p>

    <h4>MITRE ATT&CK × MITRE CAPEC</h4>
    <p><b>ATT&CK</b>: matrizes de <b>táticas</b> (o objetivo do atacante, ex: "acesso inicial") e <b>técnicas</b> (como cada tática é executada), baseadas em comportamento adversário real observado. <b>CAPEC</b>: catálogo de padrões de ataque em nível mais amplo (mecanismos e domínios de ataque) — os dois se complementam, não são a mesma coisa.</p>

    <h4>STRIDE — modelagem de ameaças</h4>
    <table>
      <tr><th>Letra</th><th>Ameaça</th></tr>
      <tr><td>S</td><td>Spoofing — personificação (fingir ser outro usuário/sistema)</td></tr>
      <tr><td>T</td><td>Tampering — alteração não autorizada de dados/código</td></tr>
      <tr><td>R</td><td>Repudiation — negar ter realizado uma ação, sem auditoria que prove o contrário</td></tr>
      <tr><td>I</td><td>Information disclosure — exposição indevida de informação</td></tr>
      <tr><td>D</td><td>Denial of service — indisponibilidade proposital de um serviço</td></tr>
      <tr><td>E</td><td>Elevation of privilege — obter acesso maior do que o autorizado</td></tr>
    </table>

    <h4>Etapas de um teste de penetração (pentest)</h4>
    <p>Reconhecimento (Footprinting) → Varredura (Scanning) → Enumeração → <b>Ganho de Acesso (Exploitation)</b> → Escalação de Privilégios → Encobrimento de Rastros → Relatório final.</p>

    <h4>ISO 31000 × ISO 22301 × Sarbanes-Oxley</h4>
    <p><b>ISO 31000</b>: diretrizes gerais de <b>gestão de riscos</b> (qualquer tipo de risco, não só segurança). <b>ISO 22301</b>: sistema de gestão de <b>continuidade de negócios</b> especificamente. <b>Sarbanes-Oxley (SOX)</b>: lei americana de controles internos e governança financeira, frequentemente citada junto por exigir controles rigorosos de TI em empresas com ações negociadas nos EUA.</p>

    <h4>Segurança em nuvem — responsabilidade compartilhada</h4>
    <p>O provedor de nuvem responde pela segurança <b>DA nuvem</b> (infraestrutura física, virtualização); o cliente responde pela segurança <b>NA nuvem</b> (configuração de acesso, dados, aplicações que ele implanta) — a divisão exata varia conforme o modelo (IaaS/PaaS/SaaS), mas o cliente nunca fica isento de responsabilidade.</p>

    <h4>DLP e CASB</h4>
    <p><b>DLP</b> (Data Loss Prevention): detecta e previne vazamento/transmissão não autorizada de dado sensível (monitora e-mail, upload pra nuvem, dispositivo removível). <b>CASB</b> (Cloud Access Security Broker): ponto de controle entre os usuários da organização e os serviços de nuvem que eles usam, aplicando política/visibilidade/conformidade sobre esse uso.</p>

    <h4>Ciclo de Gestão de Vulnerabilidades</h4>
    <p><b>Identificação</b> (scanner encontra) → <b>Avaliação/priorização</b> (por criticidade/exposição) → <b>Correção</b> (patch/mitigação) → <b>Verificação</b> (confirma que sumiu) — é um ciclo contínuo, não uma ação única.</p>

    <h4>Segurança em IoT</h4>
    <p>Dispositivos IoT trazem desafios extras: capacidade computacional limitada (dificulta criptografia robusta), credenciais padrão de fábrica não trocadas, e dificuldade de atualizar em escala — histórico real de botnets formadas por dispositivos IoT comprometidos (ex: Mirai).</p>

    <div class="tip"><b>Como a banca cobra:</b> sem precedente direto nas provas antigas — são todos itens novos do edital 2026. Tratam-se de siglas e processos com definição bem específica; a banca tende a cobrar a definição literal de cada termo, então vale decorar a ordem das fases (incidente, pentest, gestão de vulnerabilidades) e o que cada letra do STRIDE significa.</div>
  `
},

  html: `
    <h4>Acessibilidade × Usabilidade</h4>
    <p><b>Acessibilidade</b>: garantir que pessoas com diferentes deficiências ou limitações consigam usar o sistema (ex: leitor de tela, contraste adequado, navegação por teclado). <b>Usabilidade</b>: facilidade, eficiência e satisfação de QUALQUER usuário ao usar o sistema. São conceitos relacionados, mas não sinônimos — um sistema pode ser usável para a maioria e ainda não ser acessível.</p>

    <h4>User Story — o formato clássico</h4>
    <p>"Como [persona/papel], eu quero [ação/funcionalidade], para que [benefício/motivo]." Não confundir com o formato Gherkin/BDD ("Dado que... quando... então..."), que é usado para critérios de aceite/teste, não para a história em si.</p>

    <h4>Design Thinking — as 5 fases (não necessariamente lineares)</h4>
    <p><b>Empatizar</b> (entender o usuário) → <b>Definir</b> (delimitar o problema) → <b>Idear</b> (gerar alternativas) → <b>Prototipar</b> (materializar uma ideia) → <b>Testar</b> (validar com usuários reais, retroalimentando o ciclo).</p>

    <h4>MVP (Mínimo Produto Viável)</h4>
    <p>A versão com o MENOR conjunto de funcionalidades suficiente para VALIDAR uma hipótese de negócio com usuários reais — não é "a versão mais barata possível", é a versão que permite aprender o mais rápido possível antes de investir mais.</p>

    <h4>Personas</h4>
    <p>Representações fictícias (mas baseadas em dados e padrões reais) de perfis de usuário, usadas para orientar decisões de design — não são um usuário real específico, e sim um arquétipo que representa um grupo.</p>

    <h4>Prototipação — fidelidade</h4>
    <p><b>Baixa fidelidade</b> (wireframe, papel): rápido e barato, foca em fluxo/conceito, sem detalhe visual. <b>Alta fidelidade</b>: se aproxima da aparência e comportamento reais do produto final — mais caro e demorado de produzir.</p>

    <h4>Fluxo de navegação (user flow)</h4>
    <p>Mapeia a sequência de telas/passos que um usuário percorre para completar uma tarefa — ajuda a achar ponto de atrito e simplificar o caminho até o objetivo, antes mesmo de desenhar qualquer tela em detalhe.</p>

    <h4>Interoperabilidade entre navegadores</h4>
    <p>Garantir que a aplicação web funcione e apareça de forma consistente em navegadores diferentes (Chrome, Firefox, Safari, Edge), já que cada um pode ter suporte diferente a um mesmo padrão web.</p>

    <h4>Storytelling com dados</h4>
    <p>Construir uma narrativa que combina dado + visualização + contexto para comunicar um insight de forma clara e persuasiva, guiando quem lê até uma conclusão ou decisão — não é só "colocar um gráfico", é dar sentido a ele.</p>

    <div class="tip"><b>Como a banca cobra:</b> sem precedente nas provas antigas — é conteúdo inteiramente novo no edital 2026. Espere definições literais e comparações conceituais (não cálculo), sem histórico específico da Cesgranrio para calibrar o nível de profundidade exigido.</div>
  `
},

    <h4>Por que escalar agilidade</h4>
    <p>Práticas ágeis de uma única equipe (Scrum/Kanban) resolvem bem a coordenação DENTRO de um time. Quando várias equipes precisam entregar um produto ou portfólio complexo em conjunto, surge a necessidade de frameworks de "ágil em escala" para coordenar esse trabalho entre times.</p>

    <h4>SAFe (Scaled Agile Framework) — níveis</h4>
    <p><b>Time</b> (equivalente ao Scrum/Kanban tradicional) → <b>Programa</b> (múltiplos times formam um <b>ART</b>, Agile Release Train) → <b>Grande Solução</b> (para soluções que exigem múltiplos ARTs) → <b>Portfólio</b> (alinhamento com a estratégia de negócio como um todo).</p>

    <h4>PI Planning (Program Increment Planning)</h4>
    <p>Evento do SAFe em que TODAS as equipes de um ART se reúnem (geralmente presencialmente ou em sessão dedicada) para planejar e alinhar o trabalho do próximo Incremento de Programa — é o evento de sincronização entre times, equivalente em escala a uma Sprint Planning, mas multiequipe.</p>

    <h4>Gestão de portfólio × Gestão de projeto</h4>
    <p><b>Gestão de projeto</b>: entregar um trabalho específico dentro de restrições de prazo/custo/escopo definidas. <b>Gestão de portfólio</b>: selecionar, priorizar e balancear o CONJUNTO de projetos/produtos da organização para maximizar valor em relação à estratégia, considerando recursos limitados — escopo e horizonte de decisão diferentes.</p>

    <h4>Segmentos do mercado de TI</h4>

    <h4>Inovação incremental × disruptiva</h4>
    <p><b>Incremental</b>: melhorias contínuas e graduais sobre um produto/processo já existente. <b>Disruptiva</b>: cria um novo mercado ou modelo de valor, muitas vezes deslocando tecnologias e empresas já estabelecidas — não tem relação direta com "quanto custa", e sim com o tipo de impacto que gera.</p>

    <h4>Ciclo de adoção de tecnologia (curva de difusão)</h4>
    <p>Ordem clássica de categorias de adotantes: <b>Inovadores</b> → <b>Primeiros adotantes</b> (early adopters) → <b>Maioria inicial</b> → <b>Maioria tardia</b> → <b>Retardatários</b>.</p>

    <h4>Pesquisa, Desenvolvimento e Indústria</h4>
    <p>Investimento em P&D gera novas tecnologias/processos que, posteriormente, podem ser absorvidos e escalados pela indústria — não é uma relação automática ou instantânea (pesquisa não se converte sozinha e imediatamente em produto comercial).</p>

    <h4>Obsolescência tecnológica</h4>

    <table>

    </table>
    <p><b>Equipamento por camada</b>: hub opera na física (repete tudo, sem inteligência); switch opera no enlace (aprende endereço MAC, reduz domínio de colisão); roteador opera na rede (decide rota por endereço IP, separa domínios de broadcast).</p>

    <h4>Protocolos de aplicação e suas portas — decore</h4>
    <table>
      <tr><th>Protocolo</th><th>Porta padrão</th><th>Função</th></tr>
      <tr><td>DNS</td><td>53</td><td>traduz nome de domínio para IP</td></tr>
      <tr><td>HTTP / HTTPS</td><td>80 / 443</td><td>transferência de páginas web (cifrado no HTTPS)</td></tr>
      <tr><td>FTP</td><td>21 (controle) / 20 (dados)</td><td>transferência de arquivos</td></tr>
      <tr><td>SSH</td><td>22</td><td>acesso remoto seguro (cifrado)</td></tr>
      <tr><td>TELNET</td><td>23</td><td>acesso remoto — texto puro, sem cifragem</td></tr>
      <tr><td>SMTP</td><td>25</td><td>envio de e-mail</td></tr>
      <tr><td>DHCP</td><td>67 (servidor) / 68 (cliente)</td><td>atribuição automática de IP</td></tr>
      <tr><td>SNMP</td><td>161</td><td>monitoramento/gerência de rede</td></tr>
      <tr><td>LDAP</td><td>389</td><td>acesso a diretório (ex: Active Directory)</td></tr>
    </table>

    <h4>TCP × UDP</h4>
    <p><b>TCP</b>: orientado a conexão (handshake de 3 vias), confiável (confirma entrega, reordena pacotes) — mais lento. <b>UDP</b>: sem conexão, sem garantia de entrega — mais rápido, usado onde velocidade importa mais que confiabilidade (streaming, DNS, VoIP).</p>

    <p><b>D</b>iscover (cliente pergunta) → <b>O</b>ffer (servidor oferece um IP) → <b>R</b>equest (cliente confirma que quer aquele IP) → <b>A</b>ck (servidor confirma a concessão).</p>

    <h4>NAT (Network Address Translation)</h4>
    <p>Traduz endereços IP privados (rede interna) para um endereço IP público (internet) e vice-versa — permite que vários dispositivos de uma rede interna compartilhem um único IP público de saída.</p>

    <h4>IPv6</h4>
    <p>Endereço de 128 bits (contra 32 bits do IPv4), representado em 8 grupos hexadecimais separados por dois-pontos. Não depende de NAT para resolver escassez de endereços (o espaço de endereçamento é muito maior). Suporta configuração automática sem servidor DHCP (autoconfiguração stateless).</p>

      <li><b>Polimorfismo</b>: um mesmo método se comporta de forma diferente dependendo da classe do objeto (sobrescrita/override).</li>
      <li><b>Interface</b>: contrato de métodos que uma classe se compromete a implementar (<code>implements</code>), sem herdar implementação.</li>
      <li><b>Encapsulamento</b>: esconder o estado interno do objeto atrás de métodos públicos (getters/setters), controlando o acesso.</li>
    </ul>

    <h4>HTML e XML — a diferença que a banca gosta de cobrar</h4>
    <p><b>HTML</b>: linguagem de marcação com tags PRÉ-DEFINIDAS, focada em apresentação de conteúdo num navegador. <b>XML</b>: linguagem de marcação onde as tags são definidas pelo próprio autor do documento, focada em estruturar e transportar dados (não define como exibir).</p>

    <div class="tip"><b>Como a banca cobra:</b> "Programação Java/Python/Shell" é um dos temas mais transversais do histórico (presente em 6 das 7 provas) — espere trechos de código Java pequenos para rastrear execução, não apenas definição de conceito de POO.</div>
  `

    <p><b>NAS</b> (Network Attached Storage): dispositivo de armazenamento acessado pela rede no nível de ARQUIVO (protocolos NFS/CIFS) — aparece para o sistema como uma pasta compartilhada. <b>SAN</b> (Storage Area Network): rede dedicada de armazenamento acessada no nível de BLOCO — aparece para o servidor como se fosse um disco local próprio, geralmente mais rápida e usada para cargas de trabalho mais exigentes.</p>

    <table>

    <h4>Cluster × Grid</h4>
    <p><b>Cluster</b>: conjunto de máquinas fisicamente próximas (mesma rede local), fortemente acopladas, trabalhando como se fossem um único sistema. <b>Grid</b>: recursos computacionais geograficamente distribuídos e heterogêneos, coordenados para resolver um problema comum — mais fracamente acoplado que um cluster.</p>

    <h4>Balanceamento de carga</h4>
    <p>Distribui requisições entre múltiplos servidores para evitar sobrecarga de um único ponto, melhorando disponibilidade e desempenho — algoritmos comuns incluem round-robin, menor número de conexões ativas, e balanceamento por hash.</p>

    <h4>Containers × Máquinas Virtuais</h4>
    <p>Uma <b>VM</b> virtualiza o hardware inteiro, incluindo um sistema operacional completo próprio por VM. Um <b>container</b> compartilha o kernel do sistema operacional hospedeiro, isolando apenas processos/bibliotecas da aplicação — por isso é mais leve e rápido para iniciar do que uma VM completa.</p>

    <h4>Microsserviços</h4>
    <p>Arquitetura que decompõe uma aplicação em serviços pequenos, independentes, com responsabilidade única, que se comunicam por rede (geralmente APIs) — em oposição a uma aplicação monolítica única.</p>

    <h4>DevOps</h4>
    <p>Conjunto de práticas culturais e técnicas que busca integrar as equipes de Desenvolvimento e Operações, com entregas mais frequentes, automação de build/teste/deploy (CI/CD) e colaboração contínua entre quem escreve o código e quem o opera em produção.</p>

    <h4>Infraestrutura como Código (IaC)</h4>
    <p>Gerenciar e provisionar infraestrutura (servidores, redes, storage) através de arquivos de definição versionáveis, em vez de configuração manual — permite reproduzir ambientes de forma automatizada e consistente.</p>

    <div class="tip"><b>Como a banca cobra:</b> nenhum precedente nas provas antigas — containers, DevOps e infraestrutura como código nunca apareceram nas 7 provas do acervo, apesar de estarem no edital 2026. Trate como leitura de nivelamento conceitual, sem aprofundar demais.</div>

  summary:"Interpretação de texto, coesão e conectivos, pontuação, crase, regência, colocação pronominal, concordância — presente em 100% das provas antigas catalogadas.",
  html: `
    <div class="tip"><b>Por que isto importa mesmo para quem já domina TI:</b> segundo o edital, zerar Língua Portuguesa OU Língua Inglesa elimina o candidato do concurso, <b>independentemente da nota em Conhecimentos Específicos</b>. Não precisa virar especialista em gramática — precisa fechar o básico com segurança para não correr risco de eliminação.</div>

    <h4>1. Interpretação de texto: três níveis de pergunta</h4>
    <p>A banca costuma variar o nível de exigência dentro do mesmo texto. Reconhecer o nível ajuda a não "viajar" na resposta:</p>
    <ul>
      <li><b>Localização:</b> a resposta está escrita quase literalmente em algum trecho do texto — cuidado com alternativas que parafraseiam bem, mas trocam um detalhe (um nome, uma causa, uma consequência).</li>
      <li><b>Inferência:</b> a resposta não está escrita, mas decorre logicamente do que foi dito — a alternativa correta é a única que não exige nenhuma informação de fora do texto.</li>
      <li><b>Paráfrase/reescrita:</b> pede a frase reescrita "sem alteração de sentido" — a armadilha clássica é uma reescrita que muda intensidade, causa/consequência ou quantificador ("todos" virando "a maioria", por exemplo).</li>
    </ul>

    <h4>2. Coesão referencial</h4>
    <p>Pronomes (ele, isso, aquilo, o qual), advérbios (ali, então) e elipses retomam algo dito antes (ou, mais raramente, anunciam algo que vem depois). Para resolver uma questão de referência, releia a frase substituindo o termo apontado pela alternativa candidata — se o sentido da frase continuar coerente, é essa a resposta.</p>

    <h4>3. Conectivos e relações lógico-semânticas</h4>
    <table>
      <tr><th>Relação</th><th>Conectivos comuns</th></tr>
      <tr><td>Causa/explicação</td><td>porque, já que, uma vez que, como (no início da oração)</td></tr>
      <tr><td>Consequência</td><td>portanto, logo, por isso, de modo que</td></tr>
      <tr><td>Condição</td><td>se, caso, contanto que, desde que</td></tr>
      <tr><td>Concessão/contraste</td><td>embora, ainda que, mas, porém, no entanto, contudo</td></tr>
      <tr><td>Comparação</td><td>como, tal qual, assim como</td></tr>
      <tr><td>Finalidade</td><td>para que, a fim de que</td></tr>
    </table>
    <div class="tip"><b>Pegadinha recorrente:</b> "como" no início de oração normalmente indica causa ("Como estava chovendo, saí mais cedo"), não comparação — a banca já explorou exatamente essa ambiguidade.</div>

    <h4>4. Pontuação</h4>
    <table>
      <tr><th>Sinal</th><th>Função mais cobrada</th></tr>
      <tr><td>Dois-pontos</td><td>anunciar uma enumeração, explicação ou citação que detalha o que foi dito antes</td></tr>
      <tr><td>Travessão (par)</td><td>isolar um comentário/explicação intercalada que desenvolve a ideia anterior</td></tr>
      <tr><td>Reticências</td><td>interrupção de ideia, hesitação, ou omissão proposital de algo que se subentende</td></tr>
      <tr><td>Ponto e vírgula</td><td>separar itens de uma enumeração já pontuada por vírgulas internas, ou orações coordenadas de sentido mais distante</td></tr>
    </table>

    <h4>5. Crase</h4>
    <p>Crase é a fusão da preposição "a" com o artigo feminino "a(s)" ou com pronomes demonstrativos iniciados por "a" (aquele, aquilo, aquela). Regras que mais derrubam candidato:</p>
    <ul>
      <li><b>Nunca antes de verbo</b> (infinitivo): "disposta a ajudar", nunca "disposta à ajudar".</li>
      <li><b>Nunca antes de palavra masculina</b>: "a cavalo", "a lápis" — sem crase.</li>
      <li><b>Nunca antes de pronome pessoal reto ou de tratamento na maioria dos casos</b>: não se usa antes de "ela", "você", "Vossa Senhoria".</li>
      <li><b>Locuções adverbiais femininas de tempo/modo geralmente pedem crase</b>: "às pressas", "à noite" (mas "a tempo", sem crase, é exceção consagrada).</li>
      <li><b>Antes de nome de lugar</b>: só há crase se o lugar aceitar o artigo "a" antes dele ("Fui à Bahia" porque se diz "a Bahia é linda"; mas "Fui a Belo Horizonte", sem crase, porque não se diz "a Belo Horizonte é linda").</li>
    </ul>

    <h4>6. Regência verbal e nominal</h4>
    <table>
      <tr><th>Palavra</th><th>Regência na norma-padrão</th></tr>
      <tr><td>preferir</td><td>preferir algo A algo (nunca "preferir... do que")</td></tr>
      <tr><td>assistir (ver)</td><td>assistir AO filme/jogo</td></tr>
      <tr><td>aspirar (desejar)</td><td>aspirar A um cargo</td></tr>
      <tr><td>obedecer / desobedecer</td><td>obedecer AO regulamento</td></tr>
      <tr><td>visar (pretender)</td><td>visar A um objetivo (uso formal)</td></tr>
      <tr><td>atento, obediente</td><td>atento/obediente A algo</td></tr>
      <tr><td>orgulhoso, cheio, diferente</td><td>orgulhoso/cheio/diferente DE algo</td></tr>
      <tr><td>coerente, compatível</td><td>coerente/compatível COM algo</td></tr>
    </table>

    <h4>7. Colocação pronominal</h4>
    <p>Três posições possíveis do pronome oblíquo átono em relação ao verbo: <b>próclise</b> (antes: "não me disse"), <b>ênclise</b> (depois: "disse-me"), <b>mesóclise</b> (no meio, só em futuro do presente/pretérito sem palavra atrativa antes: "dir-me-ia").</p>
    <ul>
      <li><b>Regra de ouro:</b> nunca se inicia uma oração (ou período) com pronome oblíquo átono — "Se atrasou" está errado; o certo é "Atrasou-se" ou "Ele se atrasou".</li>
      <li><b>Palavras atrativas</b> (exigem próclise): negativas (não, nunca, ninguém), pronomes indefinidos (poucos, alguém, tudo), pronomes relativos (que, quem, o qual), advérbios sem pausa antes do verbo, conjunções subordinativas.</li>
    </ul>

    <h4>8. Concordância verbal e nominal — casos que a banca adora</h4>
    <ul>
      <li><b>Haver impessoal</b> (sentido de existir): sempre singular — "Havia muitos problemas" (nunca "Haviam").</li>
      <li><b>Fazer indicando tempo decorrido</b>: sempre singular — "Faz dois meses" (nunca "Fazem").</li>
      <li><b>Existir</b>: ao contrário de haver, é verbo pessoal — concorda normalmente: "Existem diversas formas".</li>
      <li><b>"Mais de um" + substantivo singular</b>: verbo no singular — "Mais de um gerente relatou...".</li>
      <li><b>A maioria/parte de + substantivo plural</b>: verbo pode concordar tanto com "maioria" (singular) quanto com o substantivo (plural) — mas a concordância interna da frase precisa ser consistente.</li>
      <li><b>Anexo, incluso, obrigado, mesmo, próprio</b>: são adjetivos e concordam em gênero/número com o substantivo/pronome a que se referem — "Seguem anexos os documentos", "Nós mesmos organizamos".</li>
    </ul>

    <h4>9. Figuras de linguagem mais citadas</h4>
    <table>
      <tr><th>Figura</th><th>Ideia central</th></tr>
      <tr><td>Metáfora</td><td>comparação implícita, sem conectivo comparativo</td></tr>
      <tr><td>Metonímia</td><td>troca de um termo por outro com quem mantém relação de proximidade/contiguidade</td></tr>
      <tr><td>Hipérbole</td><td>exagero proposital</td></tr>
      <tr><td>Eufemismo</td><td>suavização de uma ideia desagradável</td></tr>
      <tr><td>Ironia</td><td>dizer o oposto do que se pensa, geralmente com intenção crítica</td></tr>
    </table>

  `
},

    <div class="tip"><b>Por que isto importa mesmo para quem já domina TI:</b> assim como em Português, zerar Língua Inglesa elimina o candidato, <b>independentemente da nota em Conhecimentos Específicos</b>. A boa notícia: a banca não pede tradução nem gramática decorada — pede leitura atenta de um único texto técnico/jornalístico, sempre no mesmo formato.</div>

    <h4>1. O texto é sempre o mesmo tipo</h4>
    <p>Confirmado nas provas antigas (2006 e 2018): um único texto jornalístico/técnico de porte médio (300–500 palavras), geralmente sobre tecnologia, energia ou negócios, seguido de 10 questões de múltipla escolha em inglês. Não é preciso vocabulário raro — o texto é escrito para ser lido por um profissional não nativo.</p>

    <h4>2. Estratégia de leitura: skimming e scanning</h4>
    <ul>
      <li><b>Skimming</b> (leitura de varredura): antes de ler as perguntas, passe os olhos pelo texto rapidamente para captar o tema geral e a estrutura dos parágrafos — isso já resolve sozinho as perguntas de "ideia principal"/"título".</li>
      <li><b>Scanning</b> (leitura de localização): para perguntas de vocabulário, referência ou detalhe específico, volte ao número da linha indicado e releia só o trecho ao redor — não é preciso reler o texto inteiro a cada questão.</li>
    </ul>

    <h4>3. Tipos de pergunta recorrentes</h4>
    <table>
      <tr><th>Tipo</th><th>O que pede</th></tr>
      <tr><td>Main idea / title</td><td>a ideia central do texto todo, não de um parágrafo isolado</td></tr>
      <tr><td>Reference</td><td>a que palavra/expressão anterior um pronome (it, they, this, that) se refere</td></tr>
      <tr><td>Vocabulary in context</td><td>sinônimo ou antônimo de uma palavra, sempre considerando o sentido no texto, não o significado mais comum do dicionário</td></tr>
      <tr><td>EXCEPT</td><td>pede o único item que <b>não</b> foi mencionado no texto — leia a pergunta com atenção redobrada para essa palavra</td></tr>
      <tr><td>Inference</td><td>conclusão que decorre logicamente do texto, mesmo sem estar escrita literalmente</td></tr>
      <tr><td>Passive voice</td><td>identificar a única alternativa com verbo na voz passiva (be + particípio, incluindo com modal: "can be updated")</td></tr>
      <tr><td>Modal verbs</td><td>qual palavra substitui um verbo modal (must, would, should) sem mudar o sentido</td></tr>
    </table>

    <h4>4. Falsos cognatos (false friends) mais comuns</h4>
    <table>

    <h4>5. Voz passiva rápida</h4>
    <p>Estrutura: verbo <b>to be</b> + particípio passado. Ex.: "the system is used", "advances have been made", "technology can be updated". Se não houver "be" + particípio, a oração está na ativa, mesmo que o sujeito pareça "sofrer" a ação (como em "the team faced a problem" — ativa, apesar de "problema" soar negativo).</p>

  stem:"Considere a tabela Matricula(matricula, curso, nome_aluno, coordenador_curso), com as dependências funcionais: matricula → curso, nome_aluno; e curso → coordenador_curso. Essa tabela fere a Terceira Forma Normal (3FN) porque:",
  options:{
    A:"nome_aluno depende apenas de parte da chave composta (matricula, curso).",
    B:"curso não é um atributo atômico.",
    C:"coordenador_curso depende transitivamente de matricula, através de curso — um atributo não-chave determinando outro atributo não-chave.",
    D:"matricula não determina de forma única nenhum outro atributo da tabela.",
    E:"a tabela possui grupos de atributos repetidos, o que já fere a Primeira Forma Normal."
  },
  correct:"C",
  explanation:{
    core:"A chave da tabela é apenas matricula (ela determina, direta ou indiretamente, todos os demais atributos). O problema de 3FN é a dependência transitiva: matricula → curso → coordenador_curso.",
    detail:"coordenador_curso é um atributo não-chave que depende de outro atributo não-chave (curso), e não diretamente da chave primária — essa é a definição exata de violação de 3FN, e o motivo pelo qual coordenador_curso deveria estar em uma tabela Curso separada.",
    wrong:{
      A:"Isso seria uma violação de 2FN, mas exige chave composta — aqui a chave é só matricula, não há dependência parcial possível.",
      B:"Nada no enunciado indica que curso guarda mais de um valor por célula; atomicidade é sobre 1FN, não é o problema descrito.",
      D:"Falso: as dependências funcionais dadas mostram que matricula determina curso, nome_aluno e, transitivamente, coordenador_curso.",
      E:"Não há indício de grupo repetido na tabela; o problema aqui é especificamente a dependência transitiva de 3FN."
    }
  }
},
{
  id:"sql-03", topicId:"sql-dados", tier:"P1", format:"codigo",
  source:"inedita", insp:"SQL com schema dado + JOIN + GROUP BY/HAVING — o formato mais repetido do acervo (6 de 7 provas)",
  stem:`Considere as tabelas abaixo e a consulta SQL a seguir.

<table><tr><th colspan="3">Cliente</th></tr><tr><th>id</th><th>nome</th><th>cidade</th></tr>
<tr><td>1</td><td>Ana</td><td>RJ</td></tr><tr><td>2</td><td>Bruno</td><td>SP</td></tr><tr><td>3</td><td>Carla</td><td>RJ</td></tr></table>
<table><tr><th colspan="3">Pedido</th></tr><tr><th>id</th><th>id_cliente</th><th>valor</th></tr>
<tr><td>10</td><td>1</td><td>600</td></tr><tr><td>11</td><td>1</td><td>700</td></tr><tr><td>12</td><td>2</td><td>300</td></tr><tr><td>13</td><td>3</td><td>200</td></tr></table>

<pre class="codeblock">SELECT c.cidade, COUNT(p.id) AS qtd, SUM(p.valor) AS total
FROM Cliente c
INNER JOIN Pedido p ON p.id_cliente = c.id
GROUP BY c.cidade
HAVING SUM(p.valor) > 1000
ORDER BY total DESC;</pre>

Qual é o resultado exato produzido por essa consulta?`,
  options:{
    A:"RJ | 3 | 1500",
    B:"RJ | 2 | 1500  e  SP | 1 | 300",
    C:"SP | 1 | 300",
    D:"RJ | 3 | 1500  e  SP | 1 | 300",
    E:"A consulta retorna erro, pois GROUP BY não pode ser usado junto com HAVING e ORDER BY na mesma instrução."
  },
  correct:"A",
  explanation:{
    core:"O INNER JOIN casa cada pedido com seu cliente; agrupando por cidade: RJ soma os pedidos de Ana (600+700) e Carla (200) = 1500, em 3 pedidos. SP soma o pedido de Bruno = 300, em 1 pedido.",
    detail:"O HAVING SUM(p.valor) > 1000 é aplicado DEPOIS do agrupamento: RJ (1500) passa, SP (300) é descartado. Sobra só a linha RJ | 3 | 1500 — é exatamente essa a pegadinha: calcular certo os grupos e esquecer de aplicar o HAVING no final.",
    wrong:{
      B:"A contagem de pedidos do RJ está errada: são 3 pedidos (10, 11 e 13), não 2 — além disso SP não deveria aparecer, pois seu total (300) não passa no HAVING.",
      C:"SP é justamente o grupo que o HAVING elimina (300 não é maior que 1000); é o oposto do resultado correto.",
      D:"SP não sobrevive ao HAVING > 1000, então essa linha não deveria aparecer no resultado.",
      E:"GROUP BY, HAVING e ORDER BY são plenamente compatíveis na mesma instrução SQL — essa é a ordem de execução lógica padrão."
    }
  }
},
{
  id:"sql-04", topicId:"sql-dados", tier:"P1", format:"codigo",
  source:"inedita", insp:"Equivalência IN (subquery) × EXISTS — presente no bloco de BD desde 2011",
  stem:`Considere a consulta abaixo, que lista os nomes dos funcionários que participaram de algum projeto em 2025:

<pre class="codeblock">SELECT nome FROM Funcionario f
WHERE f.id IN (
  SELECT id_funcionario FROM Projeto WHERE ano = 2025
);</pre>

Qual das alternativas abaixo é equivalente ao resultado da consulta acima, usando EXISTS?`,
  options:{
    A:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f
WHERE EXISTS (
  SELECT 1 FROM Projeto pr WHERE pr.id_funcionario = f.id AND pr.ano = 2025
);</pre>`,
    B:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f
WHERE EXISTS (
  SELECT 1 FROM Projeto pr WHERE pr.ano = 2025
);</pre>`,
    C:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f
WHERE NOT EXISTS (
  SELECT 1 FROM Projeto pr WHERE pr.id_funcionario = f.id AND pr.ano = 2025
);</pre>`,
    D:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f
WHERE EXISTS (
  SELECT 1 FROM Projeto pr WHERE pr.id_funcionario = f.id
);</pre>`,
    E:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f, Projeto pr
WHERE EXISTS (pr.ano = 2025);</pre>`
  },
  correct:"A",
  explanation:{
    core:"EXISTS precisa de uma subconsulta CORRELACIONADA — que referencie a tabela externa (pr.id_funcionario = f.id) — para reproduzir o mesmo filtro do IN original, além de manter a condição pr.ano = 2025.",
    detail:"A alternativa A tem os dois elementos certos: a correlação com f.id (equivalente a comparar contra a lista do IN) e o filtro ano = 2025 dentro da mesma subconsulta.",
    wrong:{
      B:"Falta a correlação com f.id: essa subconsulta é verdadeira para TODO funcionário assim que existir qualquer projeto de 2025, não apenas para quem participou dele.",
      C:"NOT EXISTS inverte a lógica — retornaria quem NÃO participou de projeto em 2025, o oposto do pedido.",
      D:"Falta o filtro ano = 2025 — retornaria todo funcionário que participou de QUALQUER projeto, de qualquer ano.",
      E:"EXISTS espera uma subconsulta (SELECT), não uma condição booleana solta entre parênteses; essa sintaxe é inválida na maioria dos SGBDs."
    }
  }
},
{

  source:"inedita", insp:"Transações/ACID/isolamento — bloco recorrente desde 2006",
  stem:"Afirmação 1: o uso do nível de isolamento SERIALIZABLE evita a ocorrência de leitura fantasma (phantom read) entre transações concorrentes.\n\nPORQUE\n\nAfirmação 2: o SERIALIZABLE impede que uma transação insira novas linhas que atendam aos critérios de uma consulta já executada por outra transação concorrente, até que esta finalize.",

    A:"As duas afirmações são verdadeiras, e a segunda justifica a primeira.",
    B:"As duas afirmações são verdadeiras, mas a segunda não justifica a primeira.",
    C:"A primeira afirmação é verdadeira e a segunda é falsa.",
    D:"A primeira afirmação é falsa e a segunda é verdadeira.",
    E:"As duas afirmações são falsas."
  },
  correct:"A",
  explanation:{
    core:"SERIALIZABLE é o nível de isolamento mais restritivo do padrão SQL e é justamente o único que garante ausência de leitura fantasma.",
    detail:"A segunda afirmação descreve corretamente o mecanismo: ao serializar o acesso, o SGBD impede inserções concorrentes que alterariam o resultado de uma consulta já repetida pela outra transação — essa é exatamente a causa do efeito descrito na primeira afirmação.",
    wrong:{
      B:"A relação de causa é direta: é precisamente por bloquear essas inserções concorrentes que o phantom read deixa de ocorrer.",
      C:"A segunda afirmação está correta — descreve o mecanismo real de bloqueio do SERIALIZABLE.",
      D:"A primeira afirmação também é verdadeira: SERIALIZABLE é definido no padrão SQL justamente como o nível que elimina leitura fantasma.",
      E:"Ambas as afirmações são tecnicamente corretas."
    }
  }
},
{

  source:"inedita", insp:"Tipos de JOIN — presente em quase toda prova do acervo",
  stem:"Sobre os tipos de junção (JOIN) em SQL, é correto afirmar que:",
  options:{

    B:"o LEFT JOIN retorna todas as linhas da tabela à esquerda, mesmo quando não há linha correspondente na tabela à direita — nesse caso, as colunas da direita vêm com NULL.",
    C:"o RIGHT JOIN é equivalente ao LEFT JOIN quando as tabelas são invertidas na cláusula FROM, portanto nunca é utilizado na prática.",
    D:"um FULL OUTER JOIN retorna apenas as linhas que têm correspondência nas duas tabelas.",
    E:"um CROSS JOIN exige obrigatoriamente uma cláusula ON para funcionar corretamente."
  },

  explanation:{

    wrong:{

      C:"RIGHT JOIN é sintaticamente equivalente a inverter as tabelas num LEFT JOIN, mas ainda é amplamente usado — a equivalência não o torna inútil.",
      D:"Essa é a descrição do INNER JOIN — o FULL OUTER JOIN faz o oposto: traz todas as linhas de ambos os lados, com NULL onde não há par.",
      E:"CROSS JOIN é justamente o produto cartesiano puro, sem condição de junção — usar ON nele não é a sintaxe padrão."
    }
  }
},
{

  source:"inedita", insp:"Integridade referencial / DDL — item 1.11 do Anexo IV",
  stem:"Em uma coluna de chave estrangeira criada com a cláusula ON DELETE CASCADE, ao se excluir um registro da tabela referenciada:",
  options:{

    C:"a coluna de chave estrangeira das linhas dependentes é automaticamente definida como NULL.",
    D:"a coluna de chave estrangeira das linhas dependentes é automaticamente definida para um valor padrão pré-configurado.",

{
  id:"pm-01", topicId:"gestao-projetos", tier:"P1", format:"calculo",
  source:"inedita", insp:"Caminho crítico (CPM) — cobrado desde 2006",
  stem:`Considere o diagrama de rede de um projeto com as seguintes atividades e durações (em dias), todas iniciando a partir do mesmo marco inicial e convergindo para um marco final:

<pre class="codeblock">Caminho 1: A(4) → B(3) → D(2)   =  A-B-D
Caminho 2: A(4) → C(6) → D(2)   =  A-C-D</pre>

Qual é a duração do caminho crítico do projeto, e qual é a folga da atividade B?`,
  options:{
    A:"9 dias de caminho crítico; folga de B = 0 dias",
    B:"12 dias de caminho crítico; folga de B = 3 dias",
    C:"12 dias de caminho crítico; folga de B = 0 dias",
    D:"9 dias de caminho crítico; folga de B = 3 dias",
    E:"15 dias de caminho crítico; folga de B = 3 dias"
  },
  correct:"B",
  explanation:{
    core:"O caminho crítico é o caminho MAIS LONGO da rede (não o mais curto): A-B-D = 4+3+2 = 9 dias; A-C-D = 4+6+2 = 12 dias. O maior é o crítico: 12 dias.",
    detail:"A folga de uma atividade fora do caminho crítico é a diferença entre a duração do caminho crítico e a duração do caminho ao qual ela pertence: folga de B = 12 − 9 = 3 dias — B pode atrasar até 3 dias sem atrasar o projeto.",
    wrong:{
      A:"9 dias é a duração do caminho A-B-D, que não é o mais longo — o caminho crítico é o A-C-D, de 12 dias.",
      C:"A duração do caminho crítico está certa (12 dias), mas a folga de B não é zero — B não está no caminho crítico, então tem folga.",
      D:"A duração do caminho crítico está errada; o caminho crítico é o mais longo (12 dias), não o mais curto.",
      E:"12 é a soma correta do caminho A-C-D; 15 não corresponde a nenhum dos dois caminhos calculados."
    }
  }
},
{

  source:"inedita", insp:"Grupos de processos do PMBOK — recorrente em quase toda prova",
  stem:"Sobre os cinco grupos de processos do PMBOK, é correto afirmar que:",
  options:{
    A:"o grupo de Monitoramento e Controle ocorre somente após o encerramento da Execução, como uma etapa de auditoria final.",
    B:"o grupo de Iniciação só pode ocorrer uma única vez em todo o ciclo de vida do projeto, mesmo em projetos com múltiplas fases.",
    C:"o grupo de Monitoramento e Controle ocorre em paralelo à Execução, acompanhando e ajustando o desempenho do projeto ao longo de todo o seu andamento.",
    D:"o Encerramento só trata de aspectos contratuais, nunca de encerramento administrativo do projeto.",
    E:"o Planejamento é executado uma única vez, no início do projeto, sem possibilidade de revisão posterior."
  },
  correct:"C",

    core:"Os grupos de processos do PMBOK não são estritamente sequenciais — Monitoramento e Controle acontece durante toda a Execução (e também durante o Planejamento), não depois dela.",

      A:"Monitoramento e Controle roda em paralelo à Execução, não depois — é essa a característica central do grupo.",
      B:"Projetos com múltiplas fases costumam repetir Iniciação a cada fase relevante, não apenas uma vez no projeto inteiro.",
      D:"O Encerramento cobre tanto o encerramento de contratos quanto o encerramento administrativo (formalização de aceite, lições aprendidas etc.).",
      E:"O Planejamento é iterativo — é comum e esperado revisá-lo conforme o projeto evolui (elaboração progressiva)."
    }
  }
},
{
  id:"pm-03", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"EAP/WBS — item 2.1 do Anexo IV",
  stem:"O menor nível de decomposição da Estrutura Analítica do Projeto (EAP/WBS), utilizado como base para estimativa de custo, prazo e para controle do projeto, é denominado:",
  options:{
    A:"Marco (milestone)",
    B:"Fase do projeto",
    C:"Entrega (deliverable) principal",
    D:"Pacote de trabalho (work package)",
    E:"Atividade do cronograma"
  },
  correct:"D",
  explanation:{
    core:"A EAP decompõe o escopo do projeto em entregas cada vez menores; o nível mais baixo dessa decomposição — o que já é suficientemente pequeno para ser estimado e controlado — é o pacote de trabalho.",
    detail:"As atividades do cronograma vêm depois: elas são derivadas de cada pacote de trabalho no processo de planejamento do cronograma, mas não são, elas mesmas, o nível da EAP — a EAP é orientada a entregas (o quê), não a atividades (como).",
    wrong:{
      A:"Marco é um ponto de referência sem duração (ex: 'aprovação do escopo'), não um nível de decomposição da EAP.",
      B:"Fase é um agrupamento de alto nível dentro do ciclo de vida do projeto, bem acima do nível de decomposição da EAP.",
      C:"Entrega principal é um nível intermediário da EAP, ainda decomposto em pacotes de trabalho menores.",
      E:"Atividades pertencem ao cronograma, derivadas dos pacotes de trabalho — não são, por definição, um nó da EAP."
    }
  }
},

    E:"As duas afirmações são falsas."

},
{
  id:"pm-05", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Eventos do Scrum — entra no acervo em 2018",
  stem:"Assinale a alternativa correta sobre os eventos do Scrum:",
  options:{
    A:"A Sprint Review tem como objetivo principal discutir como o time pode melhorar seu próprio processo de trabalho.",
    B:"A Sprint Retrospective tem como foco inspecionar e adaptar o PROCESSO do time, e não o incremento de produto entregue.",
    C:"A Daily Scrum deve ser conduzida pelo Product Owner, que reporta o andamento ao Scrum Master.",
    D:"A Sprint Planning ocorre após a Sprint Review, para definir o que será feito na Sprint que acabou de terminar.",
    E:"Não há um evento específico para apresentar o incremento produzido na Sprint aos interessados (stakeholders)."
  },
  correct:"B",
  explanation:{
    core:"Os eventos do Scrum têm focos bem distintos: a Sprint Review inspeciona o INCREMENTO (o produto); a Sprint Retrospective inspeciona o PROCESSO (como o time trabalhou).",
    detail:"É uma das trocas de pegadinha mais comuns: inverter o foco da Review (produto) com o da Retrospective (processo).",

      D:"A ordem é invertida: a Sprint Planning ocorre no INÍCIO da Sprint, antes do trabalho começar; a Review ocorre no fim.",
      E:"Esse evento existe e é justamente a Sprint Review, onde o incremento é apresentado aos stakeholders."
    }
  }
},
{
  id:"pm-06", topicId:"gestao-projetos", tier:"P1", format:"cenario",
  source:"inedita", insp:"Papéis do Scrum aplicados a um cenário — formato usado em 2018",
  stem:"Durante a Daily Scrum, um integrante do time relata um impedimento técnico que está travando sua tarefa e que ele não consegue resolver sozinho. De acordo com o Guia Scrum, a responsabilidade primária de atuar na remoção desse impedimento é de:",
  options:{
    A:"do Product Owner, por ser o responsável pela priorização do trabalho.",
    B:"do Scrum Master, cujo papel inclui ajudar o time a remover impedimentos.",
    C:"de um gerente de projetos externo ao time Scrum.",
    D:"do próprio Time de Desenvolvimento, isoladamente, sem qualquer apoio de outro papel.",
    E:"de um stakeholder que acompanha o projeto."
  },
  correct:"B",
  explanation:{
    core:"Uma das responsabilidades centrais do Scrum Master é servir ao time removendo obstáculos que atrapalham seu progresso — inclusive impedimentos técnicos que estão fora do alcance do próprio time.",
    detail:"O Scrum Master não necessariamente resolve o impedimento sozinho, mas é dele a responsabilidade de agir para que ele seja removido (buscando quem precisar dentro ou fora da organização).",
    wrong:{
      A:"O Product Owner cuida do QUÊ (prioridade do backlog), não da remoção de obstáculos operacionais do time.",
      C:"O Scrum não prevê a figura de um gerente de projetos tradicional dentro do time — essa função é substituída pelos três papéis do Scrum.",
      D:"Se o próprio time pudesse resolver sozinho, não seria um impedimento reportado que exige o papel do Scrum Master.",
      E:"Stakeholders acompanham o progresso e dão feedback na Review, mas não têm o papel de remover impedimentos do time."
    }
  }
},
{
  id:"pm-07", topicId:"gestao-projetos", tier:"P1", format:"calculo",
  source:"inedita", insp:"VME em análise de riscos — item 1.7-1.8 do Anexo IV (Administração), reforçado em Gestão de Projetos",
  stem:"Em um projeto, uma atividade tem 20% de probabilidade de sofrer um risco que geraria um custo adicional de R$ 50.000,00. O Valor Monetário Esperado (VME) desse risco é:",
  options:{
    A:"R$ 50.000,00",
    B:"R$ 40.000,00",
    C:"R$ 10.000,00",
    D:"R$ 12.500,00",
    E:"R$ 60.000,00"
  },
  correct:"C",
  explanation:{
    core:"VME = probabilidade × impacto financeiro do risco.",
    detail:"VME = 0,20 × R$ 50.000,00 = R$ 10.000,00 — esse é o valor que, em média, deve ser reservado/considerado na reserva de contingência do projeto para esse risco específico.",
    wrong:{
      A:"R$ 50.000,00 é o impacto total caso o risco se concretize, não o valor esperado ponderado pela probabilidade.",
      B:"Não corresponde ao cálculo 0,20 × 50.000; parece confundir a probabilidade com seu complemento (80%).",
      D:"Não corresponde à multiplicação correta entre a probabilidade dada (20%) e o impacto (R$ 50.000,00).",
      E:"Não há operação no enunciado que resulte nesse valor; o VME não pode ser maior que o próprio impacto financeiro do risco."
    }
  }
},

{
  id:"seg-01", topicId:"seguranca", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Firewall/IDS/IPS/Proxy — bloco recorrente desde 2011",
  stem:"Sobre os mecanismos de segurança de perímetro, é correto afirmar que:",
  options:{
    A:"um IDS (Intrusion Detection System) bloqueia ativamente o tráfego malicioso assim que o identifica, sem necessitar de intervenção humana.",
    B:"um IPS (Intrusion Prevention System) é capaz de detectar E bloquear ativamente uma tentativa de intrusão identificada.",
    C:"um firewall de filtro de pacotes e um proxy exercem exatamente a mesma função de segurança, sendo termos intercambiáveis.",
    D:"um IDS, por definição, sempre bloqueia o tráfego identificado como suspeito antes de gerar qualquer alerta.",
    E:"um proxy reverso nunca pode atuar filtrando conteúdo, apenas encaminhando requisições sem qualquer análise."
  },
  correct:"B",
  explanation:{
    core:"A diferença central entre IDS e IPS é a capacidade de ação: IDS apenas detecta e alerta; IPS detecta E bloqueia ativamente.",
    detail:"É um dos pares mais cobrados historicamente pela banca — decore que o 'P' de IPS vem de Prevention (ação ativa), enquanto o 'D' de IDS vem de Detection (só observação e alerta).",
    wrong:{
      A:"Essa é justamente a característica do IPS, não do IDS — o IDS não bloqueia, apenas detecta e alerta.",
      C:"Firewall filtra tráfego por regras (porta, IP, protocolo); proxy intermedia a conexão (pode ocultar origem, cachear, filtrar conteúdo em nível de aplicação) — são funções relacionadas, mas distintas.",
      D:"É o oposto da definição de IDS: por definição ele NÃO bloqueia, apenas monitora e alerta.",
      E:"Proxies reversos frequentemente atuam também como camada de filtragem de conteúdo e proteção (ex: WAF integrado), não apenas como encaminhadores passivos."
    }
  }
},
{
  id:"seg-02", topicId:"seguranca", tier:"P1", format:"porque",
  source:"inedita", insp:"Assinatura digital × cifragem — pegadinha recorrente do bloco de criptografia",
  stem:"Afirmação 1: a assinatura digital de um documento garante sua autenticidade e não-repúdio.\n\nPORQUE\n\nAfirmação 2: a assinatura é gerada cifrando o hash do documento com a chave PRIVADA do emissor, podendo ser verificada por qualquer pessoa com acesso à sua chave PÚBLICA correspondente.",
  options:{
    A:"As duas afirmações são verdadeiras, e a segunda justifica a primeira.",
    B:"As duas afirmações são verdadeiras, mas a segunda não justifica a primeira.",
    C:"A primeira afirmação é verdadeira e a segunda é falsa.",
    D:"A primeira afirmação é falsa e a segunda é verdadeira.",
    E:"As duas afirmações são falsas."
  },
  correct:"A",
  explanation:{
    core:"Assinatura digital garante autenticidade (comprova quem assinou) e não-repúdio (o assinante não pode negar ter assinado) — não confidencialidade.",
    detail:"O mecanismo descrito na segunda afirmação é exatamente o que produz esses dois efeitos: só o dono da chave privada poderia ter gerado aquela assinatura, e qualquer um pode verificá-la com a chave pública correspondente — é essa relação causal que justifica a primeira afirmação.",
    wrong:{
      B:"A relação causal é direta: é justamente por usar a chave privada do emissor (e permitir verificação pública) que se obtêm autenticidade e não-repúdio.",
      C:"A segunda afirmação está correta e descreve com precisão o mecanismo real de assinatura digital.",
      D:"A primeira afirmação também é verdadeira — autenticidade e não-repúdio são exatamente as garantias que uma assinatura digital oferece.",
      E:"Ambas as afirmações estão corretas."
    }
  }
},
{
  id:"seg-03", topicId:"seguranca", tier:"P1", format:"cenario",
  source:"inedita", insp:"Ransomware — tema novo a partir de 2018 (reflexo do WannaCry)",
  stem:"Um funcionário recebeu um e-mail com um anexo disfarçado de boleto bancário. Ao abrir o arquivo, um programa malicioso cifrou todos os documentos armazenados no computador e exibiu uma mensagem exigindo pagamento em criptomoeda para restaurar o acesso aos arquivos. O comportamento descrito caracteriza um ataque de:",
  options:{
    A:"Worm",
    B:"Keylogger",
    C:"Ransomware",
    D:"Rootkit",
    E:"Spyware"
  },
  correct:"C",
  explanation:{
    core:"Ransomware é o malware definido justamente por cifrar os dados da vítima e exigir resgate (ransom) para restaurar o acesso — exatamente o comportamento descrito no cenário.",
    detail:"O disfarce em anexo de e-mail é o vetor de entrega (comum em ataques de engenharia social), mas o que define a CLASSIFICAÇÃO do malware é o comportamento que ele executa depois de instalado: cifrar arquivos e exigir pagamento.",
    wrong:{
      A:"Worm se caracteriza pela autorreplicação e propagação autônoma pela rede — o cenário não descreve isso, e sim cifragem de arquivos com exigência de resgate.",
      B:"Keylogger captura o que é digitado pelo usuário — não é o comportamento descrito.",
      D:"Rootkit tem como característica central esconder sua própria presença (e de outros malwares) no sistema — o cenário descreve uma ação visível e declarada (a mensagem de resgate), o oposto de um comportamento furtivo.",
      E:"Spyware coleta informações da vítima às escondidas, sem necessariamente cifrar arquivos nem exigir pagamento visível."
    }
  }
},
{
  id:"seg-04", topicId:"seguranca", tier:"P1", format:"conceitual",
  source:"inedita", insp:"RBAC × ABAC — item 9.10 do Anexo IV",
  stem:"Sobre os modelos de controle de acesso RBAC (Role-Based Access Control) e ABAC (Attribute-Based Access Control), é correto afirmar que:",
  options:{
    A:"no RBAC, a permissão de acesso é concedida com base em atributos dinâmicos do contexto, como horário e localização.",
    B:"no ABAC, a permissão é concedida com base no papel (cargo/função) exercido pelo usuário na organização, exclusivamente.",
    C:"o RBAC concede permissões vinculadas ao papel/função do usuário na organização, sendo geralmente mais simples de administrar que o ABAC.",
    D:"o ABAC é estritamente um subconjunto do RBAC, sem capacidade de avaliar critérios além do papel do usuário.",
    E:"RBAC e ABAC são termos sinônimos para o mesmo modelo de controle de acesso."
  },
  correct:"C",
  explanation:{
    core:"RBAC vincula permissões ao papel/cargo do usuário (ex: 'Analista', 'Gerente'); ABAC calcula a permissão a partir de vários atributos (usuário, recurso, ação, contexto), sendo mais granular e mais complexo de administrar.",
    detail:"A comparação de complexidade é um ponto real e frequentemente cobrado: RBAC é mais simples de implantar e auditar (papéis pré-definidos); ABAC é mais flexível, mas exige uma política de atributos mais elaborada.",
    wrong:{
      A:"Essa descrição de atributos dinâmicos (horário, localização) é do ABAC, não do RBAC.",
      B:"Essa descrição por papel/cargo é do RBAC, não do ABAC.",
      D:"ABAC não é um subconjunto do RBAC — são modelos distintos; o ABAC pode, inclusive, incorporar o papel do usuário como um dos vários atributos avaliados.",
      E:"São modelos de controle de acesso distintos, com lógicas de concessão de permissão diferentes."
    }
  }
},

},
{
  id:"seg-06", topicId:"seguranca", tier:"P1", format:"conceitual",
  source:"inedita", insp:"VPN/IPsec — recorrente desde 2011",
  stem:"Sobre VPN (Virtual Private Network), é correto afirmar que:",
  options:{
    A:"uma VPN cria um túnel cifrado sobre uma rede pública (como a internet), permitindo que dados trafeguem com confidencialidade e integridade entre as pontas do túnel.",

    C:"protocolos como o IPsec são utilizados exclusivamente para navegação web, sem aplicação em VPNs.",

  correct:"A",
  explanation:{
    core:"VPN é, na sua essência, um túnel cifrado construído sobre uma rede não confiável (a internet pública), garantindo confidencialidade e integridade dos dados entre as duas pontas — protocolos comuns: IPsec e SSL/TLS.",

      D:"VPN de acesso remoto (client-to-site) é justamente o modelo entre um dispositivo de usuário final e um servidor/concentrador corporativo — é um uso comum, não uma exceção proibida.",
      E:"Tráfego dentro de uma VPN ainda pode carregar ameaças internas (ex: um dispositivo comprometido); cifrar o transporte não elimina a necessidade de monitoramento."
    }
  }
},

  source:"inedita", insp:"Pontos de Função — EI complementa a questão de EQ já cadastrada",
  stem:"Em Análise de Pontos de Função, uma funcionalidade que recebe dados vindos de fora do sistema e os processa para atualizar um arquivo lógico interno (ex: uma tela de cadastro de novo cliente, que grava o registro no banco) é classificada como:",

  correct:"D",
  explanation:{

    detail:"A diferença para EQ (Consulta Externa) é o sentido do fluxo e a existência de atualização: EQ apenas exibe dados (sem atualizar nada); EI atualiza dados armazenados a partir de uma entrada externa.",

      E:"EO envolve processamento adicional (cálculo, derivação) para produzir uma saída — o cenário descrito é de entrada de dados para atualização, não de saída processada."

  }
},

{

  source:"inedita", insp:"Rastreamento de script Bash com for/mkdir/mv — mesmo mecanismo da prova de Infraestrutura de 2012 (Q27)",
  stem:`Considere o script Bash abaixo, executado num diretório onde já existem os arquivos arquivo1.txt, arquivo2.txt e arquivo3.txt:

<pre class="codeblock">#!/bin/bash
for i in 1 2 3; do
  mkdir -p backup$i
  mv arquivo$i.txt backup$i/ 2>/dev/null
done
echo "Diretorios criados: $(ls -d backup*/ 2>/dev/null | wc -l)"</pre>

Qual é a saída impressa pelo comando echo final?`,

  },
