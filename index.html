<title>Simulado Processos de Negócios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Literata:opsz,wght@18..36,400;18..36,500;18..36,600&family=Literata:ital,opsz,wght@1,18..36,500&display=swap">
<style>
  :root{
    --bg:#eceef5;
    --surface:#ffffff;
    --surface-2:#e2e5f0;
    --ink:#1a1e2e;
    --ink-soft:#585f78;
    --line:#d3d7e6;
    --accent:#3a45a8;
    --accent-strong:#262f80;
    --accent-soft:#e1e3f6;
    --amber:#96631b;
    --amber-soft:#f3e6cd;
    --good:#1e7a4c;
    --good-soft:#dcf0e4;
    --bad:#b3392f;
    --bad-soft:#f7e0dd;
    --p1:#3a45a8;
    --p2:#96631b;
    --p3:#726b8a;
    --shadow: 0 1px 2px rgba(20,20,40,.05), 0 10px 26px -14px rgba(20,20,40,.25);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141f;
      --surface:#191c2b;
      --surface-2:#212437;
      --ink:#e8e9f5;
      --ink-soft:#9ea3c0;
      --line:#2c2f47;
      --accent:#8891ec;
      --accent-strong:#aeb5f5;
      --accent-soft:#242a52;
      --amber:#e0ac5c;
      --amber-soft:#332711;
      --good:#5bcf94;
      --good-soft:#153726;
      --bad:#f1897d;
      --bad-soft:#3a1c19;
      --p1:#8891ec;
      --p2:#e0ac5c;
      --p3:#b3abd6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141f;
    --surface:#191c2b;
    --surface-2:#212437;
    --ink:#e8e9f5;
    --ink-soft:#9ea3c0;
    --line:#2c2f47;
    --accent:#8891ec;
    --accent-strong:#aeb5f5;
    --accent-soft:#242a52;
    --amber:#e0ac5c;
    --amber-soft:#332711;
    --good:#5bcf94;
    --good-soft:#153726;
    --bad:#f1897d;
    --bad-soft:#3a1c19;
    --p1:#8891ec;
    --p2:#e0ac5c;
    --p3:#b3abd6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  h1,h2,h3,h4{ font-family:"Manrope",sans-serif; font-weight:800; text-wrap:balance; margin:0; color:var(--ink); }
  .stem, .qtext{ font-family:"Literata", Georgia, serif; }
  code, .mono{ font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .app{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- TOPBAR ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    max-width:1080px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:1px; margin-right:auto; }
  .brand .b1{ font-weight:800; font-size:15px; letter-spacing:-.01em; }
  .brand .b2{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  nav.tabs{ display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:10px; }
  nav.tabs button{
    border:none; background:transparent; padding:8px 16px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  nav.tabs button:hover:not(.active){ color:var(--ink); }

  .wrap{ max-width:1080px; margin:0 auto; padding:36px 24px 100px; width:100%; flex:1; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- shared bits ---------- */
  .eyebrow{ font-family:"Manrope",sans-serif; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); }
  .pagehead{ margin-bottom:30px; }
  .pagehead h1{ font-size:clamp(24px,3vw,32px); margin-bottom:8px; }
  .pagehead p{ color:var(--ink-soft); max-width:62ch; font-size:14.5px; margin:0; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px; }
  .badge.p1{ background:var(--accent-soft); color:var(--accent-strong); }
  .badge.p2{ background:var(--amber-soft); color:var(--amber); }
  .badge.p3{ background:var(--surface-2); color:var(--p3); }
  .badge.fmt{ background:var(--surface-2); color:var(--ink-soft); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  .btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px; padding:10px 18px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.block{ width:100%; justify-content:center; }

  /* ---------- HOME / MODE PICKER ---------- */
  .modegrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:8px; }
  .modecard{ padding:22px 22px 20px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .modecard:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .modecard h3{ font-size:16.5px; margin-bottom:6px; }
  .modecard p{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; min-height:34px; }
  .modecard .n{ font-family:"Manrope",sans-serif; font-weight:800; font-size:26px; color:var(--accent-strong); }
  .modecard .n small{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-left:4px; }

  .topicpick{ margin-top:14px; display:none; }
  .topicpick.show{ display:block; }
  .topicpick select{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; margin-bottom:10px; }

  .stat-strip{ display:flex; gap:26px; flex-wrap:wrap; margin-top:30px; padding-top:22px; border-top:1px solid var(--line); }
  .stat-strip .stat .n{ font-weight:800; font-size:20px; color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .stat-strip .stat .l{ font-size:12px; color:var(--ink-soft); }

  /* ---------- QUIZ RUNNER ---------- */
  .runner-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .runner-meta{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--ink-soft); font-weight:700; }
  .runner-meta .timer{ font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--surface-2); padding:4px 10px; border-radius:7px; }
  .progressbar{ height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .progressbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); border-radius:99px; }

  .qcard{ padding:28px 30px 26px; }
  .qcard .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .qcard .qtext{ font-size:17px; line-height:1.6; margin-bottom:22px; white-space:pre-wrap; }
  .qtext table{ border-collapse:collapse; font-family:ui-monospace,monospace; font-size:13px; margin:12px 10px 12px 0; display:inline-table; vertical-align:top; font-variant-numeric:tabular-nums; }
  .qtext th,.qtext td{ border:1px solid var(--line); padding:5px 11px; text-align:left; }
  .qtext th{ background:var(--surface-2); }
  pre.codeblock{ background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:14px 16px; font-size:13px; overflow-x:auto; margin:14px 0; font-family:ui-monospace,monospace; line-height:1.5; max-width:100%; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ display:flex; gap:12px; align-items:flex-start; padding:13px 16px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); }
  .opt:hover{ border-color:var(--accent); }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .opt .letter{ font-family:"Manrope",sans-serif; font-weight:800; font-size:12.5px; width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .opt.selected .letter{ background:var(--accent); color:#fff; }
  .opt .otext{ font-size:14.5px; line-height:1.5; }

  .runner-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px; }
  .qjump{ display:flex; flex-wrap:wrap; gap:6px; margin-top:24px; }
  .qjump button{ width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:ui-monospace,monospace; }
  .qjump button.answered{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .qjump button.current{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---------- RESULTS ---------- */
  .score-hero{ display:flex; gap:34px; align-items:center; padding:32px 34px; flex-wrap:wrap; }
  .score-ring{ width:126px; height:126px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0); }
  .score-ring .inner{ width:98px; height:98px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring .pct{ font-weight:800; font-size:24px; font-family:"Manrope",sans-serif; }
  .score-ring .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .score-copy h2{ font-size:22px; margin-bottom:6px; }

  .topicbars{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }

  .topicbar-row .track{ height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .topicbar-row .track > i{ display:block; height:100%; border-radius:99px; }
  .topicbar-row .val{ text-align:right; font-family:ui-monospace,monospace; font-weight:700; color:var(--ink-soft); }

  .review-item{ padding:22px 26px; margin-top:14px; }
  .review-item .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .review-item .verdict{ margin-left:auto; font-size:12px; font-weight:800; padding:3px 11px; border-radius:99px; }
  .review-item .verdict.ok{ background:var(--good-soft); color:var(--good); }
  .review-item .verdict.no{ background:var(--bad-soft); color:var(--bad); }
  .review-item .qtext{ font-size:15.5px; margin-bottom:16px; }
  .review-opt{ padding:10px 14px; border-radius:9px; font-size:13.5px; margin-bottom:6px; border:1px solid var(--line); display:flex; gap:10px; }
  .review-opt .letter{ font-weight:800; font-family:"Manrope",sans-serif; }
  .review-opt.correct{ background:var(--good-soft); border-color:transparent; }
  .review-opt.wrong-pick{ background:var(--bad-soft); border-color:transparent; }
  .explain{ margin-top:16px; background:var(--surface-2); border-radius:10px; padding:16px 18px; font-size:13.5px; }
  .explain h4{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:8px; }
  .explain .core{ margin-bottom:10px; }
  .explain .why{ margin:0; padding-left:18px; }
  .explain .why li{ margin-bottom:5px; }
  .explain .studylink{ margin-top:12px; display:inline-block; font-size:12.5px; font-weight:700; }
  .source-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; font-style:italic; }

  /* ---------- STUDY AREA ---------- */
  .topiclist{ display:flex; flex-direction:column; gap:10px; }
  .topicrow{ display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; }
  .topicrow:hover{ border-color:var(--accent); }
  .topicrow .ti{ flex:1; }
  .topicrow h3{ font-size:15px; margin-bottom:2px; }
  .topicrow p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .topicrow .chev{ color:var(--ink-soft); }

  .studydoc{ padding:30px 34px 34px; }
  .studydoc h2{ font-size:22px; margin-bottom:4px; }
  .studydoc .ref{ font-size:12px; color:var(--ink-soft); font-family:ui-monospace,monospace; margin-bottom:22px; display:block; }
  .studydoc h4{ font-size:14px; margin:22px 0 8px; color:var(--accent-strong); }
  .studydoc p{ font-size:14.5px; margin:0 0 12px; max-width:74ch; }
  .studydoc ul, .studydoc ol{ font-size:14.5px; padding-left:20px; margin:0 0 12px; max-width:74ch; }
  .studydoc li{ margin-bottom:5px; }
  .studydoc table{ width:100%; border-collapse:collapse; margin:14px 0; font-size:13.5px; }
  .studydoc th,.studydoc td{ text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  .studydoc th{ font-family:"Manrope",sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .studydoc code{ background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:.92em; }
  .studydoc .tip{ background:var(--accent-soft); border-radius:10px; padding:14px 18px; font-size:13.5px; margin:16px 0; }
  .studydoc .tip b{ color:var(--accent-strong); }

  /* ---------- HISTORY ---------- */
  .hist-row{ display:flex; align-items:center; gap:16px; padding:16px 20px; margin-bottom:10px; }
  .hist-row .hd{ flex:1; }
  .hist-row .mode{ font-weight:700; font-size:14px; }
  .hist-row .when{ font-size:12px; color:var(--ink-soft); }
  .hist-row .sc{ font-family:ui-monospace,monospace; font-weight:800; font-size:16px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty .big{ font-size:34px; margin-bottom:10px; }

  footer.appfoot{ text-align:center; padding:26px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); }

  @media (max-width:640px){
    .topbar-row{ flex-wrap:wrap; }
    nav.tabs{ order:3; width:100%; }
    .qcard{ padding:20px 18px; }
    .score-hero{ flex-direction:column; text-align:center; }
    .topicbar-row{ grid-template-columns:110px 1fr 44px; }
  }

<script>
/* ============================================================
   TÓPICOS DE ESTUDO — Prioridade 1
   ============================================================ */
window.TOPICS = [
{
  id:"sql-dados", tier:"P1",
  name:"Modelagem de Dados & SQL",
  editalRef:"Anexo IV · itens 1.1–1.17",
  summary:"ER→relacional, chaves, normalização, SQL com JOIN/subconsultas, transações e ACID.",
  html: `
    <h4>Do modelo ER ao relacional</h4>
    <p>Toda questão de modelagem parte de um cenário (pedidos, funcionários, dependentes) e pede para você decidir a <b>cardinalidade</b> e resolver o mapeamento para tabelas. Regras que a banca cobra sem exceção:</p>
    <ul>
      <li><b>1:N</b> — a chave primária do lado "1" vira chave estrangeira no lado "N".</li>
      <li><b>N:N</b> — cria-se uma tabela associativa nova, cuja chave primária é composta pelas duas chaves estrangeiras (ex: <code>Pedido_Produto(id_pedido, id_produto)</code>).</li>
      <li><b>Entidade fraca</b> — não tem chave própria; sua chave primária é composta pela chave da entidade forte + um discriminador (ex: <code>Dependente(cpf_titular, nome_dependente)</code>).</li>
      <li><b>Chave candidata</b> é qualquer atributo (ou conjunto) que poderia ser primária; <b>chave primária</b> é a escolhida; as demais candidatas viram <b>chaves alternativas</b> (com <code>UNIQUE</code>).</li>
    </ul>

    <h4>Normalização — identifique a forma, não só defina</h4>
    <p>A banca dá uma tabela com dependências funcionais escritas (ex: <code>matricula → nome, curso</code> e <code>curso → coordenador</code>) e pergunta em que forma normal ela está ou o que falta para normalizar. Cheque nesta ordem:</p>
    <table>
      <tr><th>Forma</th><th>Exige</th><th>Viola quando…</th></tr>
      <tr><td>1FN</td><td>Atributos atômicos, sem grupos repetidos</td><td>uma célula guarda uma lista (ex: "telefones: 111, 222")</td></tr>
      <tr><td>2FN</td><td>1FN + nenhum atributo não-chave depende de <i>parte</i> de uma chave composta</td><td>chave é (matricula, curso) e <code>nome</code> depende só de <code>matricula</code></td></tr>
      <tr><td>3FN</td><td>2FN + nenhum atributo não-chave depende de outro atributo não-chave</td><td><code>curso → coordenador</code>, ambos não-chave (dependência transitiva)</td></tr>
    </table>

    <h4>SQL — a banca sempre dá o schema</h4>
    <p>O formato clássico: duas ou três tabelas com colunas e chaves declaradas, seguidas de uma consulta para você "rodar" mentalmente. Pontos que decidem a questão:</p>
    <ul>
      <li><code>INNER JOIN</code> só traz linhas com correspondência nos dois lados; <code>LEFT JOIN</code> traz todas as linhas da tabela da esquerda mesmo sem par (com <code>NULL</code> nas colunas da direita).</li>
      <li><code>GROUP BY</code> exige que toda coluna do <code>SELECT</code> fora de função de agregação apareça no <code>GROUP BY</code>.</li>
      <li><code>HAVING</code> filtra depois do agrupamento (sobre o resultado agregado); <code>WHERE</code> filtra antes.</li>
      <li><code>EXISTS</code> costuma ser mais eficiente que <code>IN</code> com subconsulta grande, mas o resultado lógico pode ser idêntico — a banca gosta de pedir a tradução de um <code>IN (subquery)</code> para <code>EXISTS</code> equivalente.</li>
    </ul>
    <pre class="codeblock">SELECT d.nome, COUNT(p.id) AS total
FROM departamento d
LEFT JOIN pedido p ON p.id_dept = d.id
GROUP BY d.nome
HAVING COUNT(p.id) > 0;</pre>
    <p>Nesse exemplo: o <code>LEFT JOIN</code> mantém departamentos sem pedido (com contagem 0), mas o <code>HAVING COUNT(p.id) > 0</code> os remove no final — pegadinha clássica de misturar os dois efeitos numa questão só.</p>

    <h4>Transações e ACID</h4>
    <ul>
      <li><b>A</b>tomicidade — tudo ou nada; <b>C</b>onsistência — o banco sai de um estado válido para outro; <b>I</b>solamento — transações concorrentes não se enxergam parcialmente; <b>D</b>urabilidade — commit sobrevive a falha.</li>
      <li><b>Leitura fantasma (phantom read)</b>: uma transação repete a mesma consulta e vê linhas novas inseridas por outra transação — resolvido apenas no nível de isolamento <code>SERIALIZABLE</code>.</li>
      <li><b>Leitura suja (dirty read)</b>: ler dado de uma transação que ainda não deu commit — só acontece no nível mais baixo, <code>READ UNCOMMITTED</code>.</li>
    </ul>

    <p>Os 3 pilares do Scrum (empirismo): <b>Transparência, Inspeção, Adaptação</b>. <b>Story points</b> medem esforço relativo, não tempo em horas.</p>

    <h4>Perímetro: não confunda os três</h4>
    <ul>
      <li><b>Firewall</b>: filtra tráfego por regra (porta, IP, protocolo) — decide se passa ou não.</li>
      <li><b>IDS</b> (Intrusion <i>Detection</i> System): só detecta e alerta, não bloqueia.</li>
      <li><b>IPS</b> (Intrusion <i>Prevention</i> System): detecta <b>e</b> bloqueia ativamente.</li>

    <h4>Criptografia e PKI</h4>
    <ul>
      <li><b>Simétrica</b> (AES): mesma chave cifra e decifra — rápida, mas exige canal seguro para combinar a chave.</li>
      <li><b>Assimétrica</b> (RSA): par de chaves pública/privada. <b>Cifrar com a pública do destinatário</b> = confidencialidade (só ele decifra com a privada). <b>Assinar com a própria privada</b> = autenticidade/não-repúdio (qualquer um verifica com sua pública).</li>

      <li><b>Hash</b> (SHA-256) garante integridade, não confidencialidade — não é reversível.</li>
    </ul>
    <div class="tip"><b>Pegadinha recorrente:</b> "assinatura digital garante confidencialidade" — <b>falso</b>. Assinatura garante autenticidade e não-repúdio; quem quer confidencialidade cifra a mensagem também, são operações diferentes.</div>

    <h4>Malware — nomenclatura exata</h4>
    <table>
      <tr><th>Termo</th><th>Característica que a distingue</th></tr>

      <tr><td>Worm</td><td>se propaga sozinho pela rede, sem precisar de hospedeiro</td></tr>
      <tr><td>Trojan</td><td>disfarçado de programa legítimo, não se autorreplica</td></tr>
      <tr><td>Ransomware</td><td>cifra os dados da vítima e exige resgate</td></tr>
      <tr><td>Keylogger</td><td>captura o que é digitado</td></tr>
      <tr><td>Screenlogger</td><td>captura imagens da tela (contorna teclado virtual)</td></tr>
      <tr><td>Rootkit</td><td>esconde a própria presença e a de outros malwares no sistema</td></tr>
      <tr><td>Bot / Botnet</td><td>máquina controlada remotamente; botnet é a rede dessas máquinas</td></tr>

    <h4>ISO/IEC 27002 — controles citados de forma literal</h4>
    <p>A banca não pede "o que é a norma" — pede o controle específico. Os mais cobrados historicamente: política de <b>mesa limpa e tela limpa</b> (proteção de informação em áreas de trabalho), controle de acesso baseado em necessidade de uso, segurança em <b>comércio eletrônico</b> e classificação da informação por nível de sigilo.</p>

    <h4>VPN, MFA/SSO e gestão de identidade</h4>
    <ul>
      <li><b>VPN</b> cria um túnel cifrado sobre rede pública (protocolos: IPsec, SSL/TLS).</li>
      <li><b>SSO</b> (Single Sign-On): uma autenticação dá acesso a vários sistemas. <b>MFA</b> (autenticação multifator): combina algo que você sabe (senha) + algo que você tem (token) + algo que você é (biometria).</li>
      <li><b>RBAC</b> (Role-Based Access Control): permissão vinculada ao <i>papel/cargo</i> do usuário. <b>ABAC</b> (Attribute-Based): permissão calculada a partir de atributos (usuário, recurso, contexto) — mais granular, mais complexo de administrar.</li>
    </ul>

    <h4>Ferramentas operacionais de segurança (item 9.2 do Anexo IV)</h4>
    <table>
      <tr><th>Sigla</th><th>Função</th></tr>
      <tr><td>SIEM</td><td>coleta e correlaciona logs/eventos de vários sistemas, de forma centralizada, gerando alertas de incidente</td></tr>
      <tr><td>DLP</td><td>Data Loss Prevention — impede vazamento/exfiltração de dados sensíveis</td></tr>
      <tr><td>CASB</td><td>Cloud Access Security Broker — aplica política de segurança sobre o uso de serviços em nuvem</td></tr>
      <tr><td>EDR</td><td>Endpoint Detection and Response — monitora comportamento no endpoint (não só assinatura, como o antivírus tradicional) e permite investigação/resposta a incidente</td></tr>
      <tr><td>WAF</td><td>Web Application Firewall — protege a camada de aplicação web (ex: SQL Injection, XSS), inspecionando o conteúdo das requisições HTTP</td></tr>

    <h4>Ataques comuns em aplicações web (item 9.4)</h4>
    <ul>
      <li><b>SQL Injection</b>: inserir comandos SQL não previstos através de um campo de entrada não sanitizado (ex: concatenação direta de string em uma query).</li>
      <li><b>XSS</b> (Cross-Site Scripting): injeta script malicioso que é executado no navegador da vítima.</li>
      <li><b>CSRF</b> (Cross-Site Request Forgery): explora a confiança de um site em requisições vindas do navegador já autenticado da vítima, induzindo-a a executar uma ação sem querer.</li>
      <li><b>DDoS</b>: sobrecarrega um serviço com tráfego distribuído de múltiplas origens, tornando-o indisponível.</li>
      <li><b>Path Traversal</b>: manipula caminhos de arquivo (ex: <code>../../etc/passwd</code>) para acessar arquivos fora do diretório permitido.</li>

    <h4>SAST × DAST (item 9.5)</h4>
    <p><b>SAST</b> (Static): analisa o código-fonte sem executar a aplicação. <b>DAST</b> (Dynamic): testa a aplicação em execução, simulando ataques externos, sem precisar do código-fonte. <b>IAST</b> combina as duas abordagens, instrumentando a aplicação durante a execução.</p>

    <h4>Criptografia híbrida — por que os dois tipos coexistem</h4>
    <p>Criptografia simétrica é muito mais rápida para cifrar grandes volumes de dados; criptografia assimétrica é mais lenta, mas resolve o problema de como combinar uma chave secreta sem um canal seguro prévio. Por isso sistemas reais (como o TLS) usam assimétrica só para negociar uma chave simétrica de sessão, e depois cifram o tráfego real com essa chave simétrica.</p>

    <h4>Conectivos e tabela-verdade do condicional</h4>
    <p>A proposição P → Q ("se P, então Q") só é <b>falsa</b> quando P é verdadeira e Q é falsa — em todos os outros três casos, é verdadeira. É a tabela-verdade mais cobrada e mais errada por intuição.</p>

    <h4>Negação de proposições — a pegadinha mais comum</h4>
    <ul>
      <li>Negação de <b>P → Q</b> é <b>P ∧ ¬Q</b> (não é "se não P, então não Q" — esse é um erro clássico).</li>
      <li>Negação de <b>P ∧ Q</b> (De Morgan) é <b>¬P ∨ ¬Q</b>.</li>
      <li>Negação de <b>P ∨ Q</b> (De Morgan) é <b>¬P ∧ ¬Q</b>.</li>
      <li>Negação de <b>∀x P(x)</b> ("para todo x, P(x)") é <b>∃x ¬P(x)</b> ("existe x tal que não P(x)").</li>
      <li>Negação de <b>∃x P(x)</b> é <b>∀x ¬P(x)</b>.</li>
    </ul>

    <h4>Contrapositiva × recíproca × inversa</h4>
    <p>Dada P → Q: a <b>contrapositiva</b> (¬Q → ¬P) é logicamente <b>equivalente</b> à original. A <b>recíproca</b> (Q → P) e a <b>inversa</b> (¬P → ¬Q) NÃO são equivalentes à original — são pegadinhas frequentes.</p>

    <h4>Validade de argumentos (silogismos)</h4>
    <p>Um argumento é válido quando, SE as premissas forem verdadeiras, a conclusão necessariamente também é. Clássico: "Todo A é B" + "X é A" ⊢ "X é B" (modus ponens aplicado a um quantificador universal).</p>

    <h4>Contagem de linhas da tabela-verdade</h4>
    <p>Uma proposição composta com <i>n</i> proposições simples distintas tem <b>2ⁿ</b> linhas na tabela-verdade completa.</p>

    <p><b>Threat Intelligence</b>: coleta, análise e disseminação de informações sobre ameaças (atores, táticas, indicadores de comprometimento) para embasar decisões de defesa. <b>Threat Hunting</b>: busca proativa e manual por ameaças que já podem estar no ambiente, mas que as ferramentas automatizadas ainda não detectaram.</p>

  stem:"Afirmação 1: o padrão arquitetural MVC (Model-View-Controller) separa a lógica de negócio da apresentação.\n\nPORQUE\n\nAfirmação 2: isso é obtido dividindo o sistema em três componentes — Model, View e Controller —, sendo que o Controller nunca acessa diretamente o Model.",
  options:{
    A:"As duas afirmações são verdadeiras, e a segunda justifica a primeira.",
    B:"As duas afirmações são verdadeiras, mas a segunda não justifica a primeira.",
    C:"A primeira afirmação é verdadeira e a segunda é falsa.",
    D:"A primeira afirmação é falsa e a segunda é verdadeira.",
    E:"As duas afirmações são falsas."
  },
  correct:"C",
  explanation:{
    core:"O MVC de fato separa lógica de negócio (Model) de apresentação (View) — a primeira afirmação é correta.",
    detail:"Mas a segunda erra o papel do Controller: ele é exatamente o componente que intermedia a interação, recebendo eventos da View e chamando o Model para executar a lógica de negócio ou atualizar o estado — dizer que 'nunca acessa o Model' inverte sua função central no padrão.",
    wrong:{
      A:"A segunda afirmação é falsa, então não pode justificar a primeira.",
      B:"A segunda afirmação não é verdadeira — o Controller acessa o Model rotineiramente.",
      D:"A primeira afirmação está correta: separar negócio de apresentação é justamente o propósito central do MVC.",
      E:"A primeira afirmação está correta, mesmo que a segunda esteja errada."
    }
  }
},
{
  id:"es-03", topicId:"eng-software", tier:"P1", format:"cenario",
  source:"inedita", insp:"Interpretação de diagrama UML — entra no acervo em 2011 e se firma em 2018",
  stem:"Em um diagrama de classes UML, a classe Pedido está ligada à classe ItemPedido por uma associação com losango PREENCHIDO (cheio) do lado de Pedido. Essa notação indica que:",
  options:{
    A:"um ItemPedido pode existir de forma independente, mesmo após o Pedido ao qual pertencia ser destruído.",
    B:"a relação é de composição: um ItemPedido não existe sem o Pedido ao qual pertence, e é destruído junto com ele.",
    C:"a relação representa apenas uma dependência de uso temporária entre as classes, sem implicação sobre o ciclo de vida dos objetos.",
    D:"Pedido e ItemPedido compartilham a mesma tabela no banco de dados, obrigatoriamente.",
    E:"a multiplicidade entre as classes é necessariamente 1 para 1."
  },
  correct:"B",
  explanation:{
    core:"Losango preenchido em UML representa composição: um relacionamento parte-todo forte, no qual a parte não tem existência independente do todo.",
    detail:"Isso significa que o ciclo de vida de ItemPedido está atrelado ao de Pedido — se o Pedido é destruído, seus itens são destruídos junto. O losango vazio (não preenchido) representaria agregação, um vínculo mais fraco, onde a parte pode existir sem o todo.",
    wrong:{
      A:"Essa é a característica da agregação (losango vazio), não da composição (losango cheio).",
      C:"Composição carrega, sim, implicação direta sobre o ciclo de vida dos objetos — não é uma dependência de uso passageira.",
      D:"UML não determina o mapeamento físico do banco de dados; isso é uma decisão de projeto separada.",
      E:"O tipo de losango indica o tipo de relação (agregação/composição); a multiplicidade é informada separadamente, nos números próximos às extremidades da linha."
    }
  }
},
{

},
{
  id:"es-05", topicId:"eng-software", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Métrica de Pontos de Função — presente na prova de 2011",
  stem:"Em Análise de Pontos de Função, uma tela que apenas exibe dados obtidos de uma consulta ao banco, sem permitir qualquer alteração desses dados, é classificada como:",
  options:{
    A:"EI (Entrada Externa)",
    B:"EO (Saída Externa)",
    C:"EQ (Consulta Externa)",
    D:"ILF (Arquivo Lógico Interno)",
    E:"EIF (Arquivo de Interface Externa)"
  },
  correct:"C",
  explanation:{
    core:"EQ (External Query / Consulta Externa) é a função de transação que recupera dados sem realizar nenhum processamento adicional além da simples apresentação — sem cálculo, sem atualização de dados armazenados.",
    detail:"A diferença entre EQ e EO é justamente essa: EO (Saída Externa) envolve processamento adicional (cálculos, derivação de dados); EQ é uma recuperação direta e simples.",
    wrong:{
      A:"EI é uma função de transação que processa dados vindos de fora para DENTRO do sistema (uma entrada de dados), o oposto de uma tela somente leitura.",

      D:"ILF é uma função de dados (um grupo de dados mantido dentro do sistema), não uma função de transação como a tela descrita.",
      E:"EIF é um grupo de dados referenciado pelo sistema mas mantido por outra aplicação — também é função de dados, não de transação."
    }
  }
},
{

  source:"inedita", insp:"Requisito funcional × não funcional — item 5.1 do Anexo IV",
  stem:"Dentre as afirmações abaixo, extraídas de um documento de especificação de um sistema de folha de pagamento, qual delas descreve um requisito NÃO funcional?",
  options:{

  correct:"D",
  explanation:{

    detail:"A alternativa D não descreve uma funcionalidade nova, mas sim uma restrição de desempenho (tempo máximo de processamento para um volume determinado) — é um requisito de desempenho, categoria clássica de requisito não funcional.",

      E:"Descreve uma funcionalidade de emissão de documento — é requisito funcional."
    }
  }
},
{
  id:"es-07", topicId:"eng-software", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Técnicas de elicitação de requisitos — item 5.1 do Anexo IV",
  stem:"A técnica de elicitação de requisitos que consiste em observar o usuário realizando suas tarefas no ambiente real de trabalho, sem interferir no processo, para identificar necessidades que ele mesmo não verbalizaria espontaneamente numa entrevista, é denominada:",
  options:{
    A:"Prototipação",

    C:"Etnografia",
    D:"Brainstorming",
    E:"Entrevista estruturada"
  },
  correct:"C",
  explanation:{
    core:"Etnografia é uma técnica de observação direta e imersiva do usuário no seu contexto real de trabalho, usada quando o próprio usuário tem dificuldade de descrever verbalmente seu processo ou necessidades implícitas.",
    detail:"É diferente de uma entrevista (que depende do que o usuário consegue verbalizar) justamente porque revela hábitos, atalhos e problemas que o usuário nem percebe conscientemente que tem.",
    wrong:{
      A:"Prototipação valida requisitos através de um modelo funcional construído e apresentado ao usuário, não por observação passiva.",
      B:"QFD é uma técnica de tradução de necessidades do cliente em características técnicas priorizadas, não de observação de campo.",
      D:"Brainstorming é uma técnica de geração coletiva de ideias em grupo, não de observação individual no ambiente de trabalho.",
      E:"Entrevista estruturada depende de perguntas diretas e respostas verbalizadas pelo usuário — o oposto da observação silenciosa da etnografia."
    }
  }
},

{
  id:"pm-01", topicId:"gestao-projetos", tier:"P1", format:"calculo",
  source:"inedita", insp:"Caminho crítico (CPM) — cobrado desde 2006",
  stem:`Considere o diagrama de rede de um projeto com as seguintes atividades e durações (em dias), todas iniciando a partir do mesmo marco inicial e convergindo para um marco final:

<pre class="codeblock">Caminho 1: A(4) → B(3) → D(2)   =  A-B-D
Caminho 2: A(4) → C(6) → D(2)   =  A-C-D</pre>

Qual é a duração do caminho crítico do projeto, e qual é a folga da atividade B?`,
  options:{
    A:"9 dias de caminho crítico; folga de B = 0 dias",
    B:"12 dias de caminho crítico; folga de B = 3 dias",
    C:"12 dias de caminho crítico; folga de B = 0 dias",
    D:"9 dias de caminho crítico; folga de B = 3 dias",
    E:"15 dias de caminho crítico; folga de B = 3 dias"
  },
  correct:"B",
  explanation:{
    core:"O caminho crítico é o caminho MAIS LONGO da rede (não o mais curto): A-B-D = 4+3+2 = 9 dias; A-C-D = 4+6+2 = 12 dias. O maior é o crítico: 12 dias.",
    detail:"A folga de uma atividade fora do caminho crítico é a diferença entre a duração do caminho crítico e a duração do caminho ao qual ela pertence: folga de B = 12 − 9 = 3 dias — B pode atrasar até 3 dias sem atrasar o projeto.",
    wrong:{
      A:"9 dias é a duração do caminho A-B-D, que não é o mais longo — o caminho crítico é o A-C-D, de 12 dias.",
      C:"A duração do caminho crítico está certa (12 dias), mas a folga de B não é zero — B não está no caminho crítico, então tem folga.",
      D:"A duração do caminho crítico está errada; o caminho crítico é o mais longo (12 dias), não o mais curto.",
      E:"12 é a soma correta do caminho A-C-D; 15 não corresponde a nenhum dos dois caminhos calculados."
    }
  }
},
{
  id:"pm-02", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Grupos de processos do PMBOK — recorrente em quase toda prova",
  stem:"Sobre os cinco grupos de processos do PMBOK, é correto afirmar que:",
  options:{
    A:"o grupo de Monitoramento e Controle ocorre somente após o encerramento da Execução, como uma etapa de auditoria final.",
    B:"o grupo de Iniciação só pode ocorrer uma única vez em todo o ciclo de vida do projeto, mesmo em projetos com múltiplas fases.",
    C:"o grupo de Monitoramento e Controle ocorre em paralelo à Execução, acompanhando e ajustando o desempenho do projeto ao longo de todo o seu andamento.",
    D:"o Encerramento só trata de aspectos contratuais, nunca de encerramento administrativo do projeto.",
    E:"o Planejamento é executado uma única vez, no início do projeto, sem possibilidade de revisão posterior."
  },
  correct:"C",
  explanation:{
    core:"Os grupos de processos do PMBOK não são estritamente sequenciais — Monitoramento e Controle acontece durante toda a Execução (e também durante o Planejamento), não depois dela.",
    detail:"Essa sobreposição é um dos pontos mais cobrados sobre a estrutura do PMBOK: os grupos se interligam e se repetem em ciclos, especialmente em projetos com replanejamento.",
    wrong:{
      A:"Monitoramento e Controle roda em paralelo à Execução, não depois — é essa a característica central do grupo.",
      B:"Projetos com múltiplas fases costumam repetir Iniciação a cada fase relevante, não apenas uma vez no projeto inteiro.",
      D:"O Encerramento cobre tanto o encerramento de contratos quanto o encerramento administrativo (formalização de aceite, lições aprendidas etc.).",
      E:"O Planejamento é iterativo — é comum e esperado revisá-lo conforme o projeto evolui (elaboração progressiva)."
    }
  }
},
{
  id:"pm-03", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"EAP/WBS — item 2.1 do Anexo IV",
  stem:"O menor nível de decomposição da Estrutura Analítica do Projeto (EAP/WBS), utilizado como base para estimativa de custo, prazo e para controle do projeto, é denominado:",
  options:{
    A:"Marco (milestone)",
    B:"Fase do projeto",
    C:"Entrega (deliverable) principal",
    D:"Pacote de trabalho (work package)",
    E:"Atividade do cronograma"
  },
  correct:"D",
  explanation:{
    core:"A EAP decompõe o escopo do projeto em entregas cada vez menores; o nível mais baixo dessa decomposição — o que já é suficientemente pequeno para ser estimado e controlado — é o pacote de trabalho.",
    detail:"As atividades do cronograma vêm depois: elas são derivadas de cada pacote de trabalho no processo de planejamento do cronograma, mas não são, elas mesmas, o nível da EAP — a EAP é orientada a entregas (o quê), não a atividades (como).",
    wrong:{
      A:"Marco é um ponto de referência sem duração (ex: 'aprovação do escopo'), não um nível de decomposição da EAP.",
      B:"Fase é um agrupamento de alto nível dentro do ciclo de vida do projeto, bem acima do nível de decomposição da EAP.",
      C:"Entrega principal é um nível intermediário da EAP, ainda decomposto em pacotes de trabalho menores.",
      E:"Atividades pertencem ao cronograma, derivadas dos pacotes de trabalho — não são, por definição, um nó da EAP."
    }
  }
},

  source:"inedita", insp:"Kanban × Scrum — Scrum explícito entra no acervo em 2018",
  stem:"Afirmação 1: o Kanban, diferentemente do Scrum, não define papéis fixos como Product Owner ou Scrum Master.\n\nPORQUE\n\nAfirmação 2: no Kanban, o fluxo de trabalho é organizado em Sprints de duração fixa, exatamente como no Scrum.",

},
{
  id:"pm-05", topicId:"gestao-projetos", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Eventos do Scrum — entra no acervo em 2018",
  stem:"Assinale a alternativa correta sobre os eventos do Scrum:",
  options:{
    A:"A Sprint Review tem como objetivo principal discutir como o time pode melhorar seu próprio processo de trabalho.",
    B:"A Sprint Retrospective tem como foco inspecionar e adaptar o PROCESSO do time, e não o incremento de produto entregue.",
    C:"A Daily Scrum deve ser conduzida pelo Product Owner, que reporta o andamento ao Scrum Master.",
    D:"A Sprint Planning ocorre após a Sprint Review, para definir o que será feito na Sprint que acabou de terminar.",

  correct:"B",
  explanation:{

      D:"A ordem é invertida: a Sprint Planning ocorre no INÍCIO da Sprint, antes do trabalho começar; a Review ocorre no fim.",
      E:"Esse evento existe e é justamente a Sprint Review, onde o incremento é apresentado aos stakeholders."
    }
  }
},
{
  id:"pm-06", topicId:"gestao-projetos", tier:"P1", format:"cenario",
  source:"inedita", insp:"Papéis do Scrum aplicados a um cenário — formato usado em 2018",
  stem:"Durante a Daily Scrum, um integrante do time relata um impedimento técnico que está travando sua tarefa e que ele não consegue resolver sozinho. De acordo com o Guia Scrum, a responsabilidade primária de atuar na remoção desse impedimento é de:",

    B:"do Scrum Master, cujo papel inclui ajudar o time a remover impedimentos.",

    D:"do próprio Time de Desenvolvimento, isoladamente, sem qualquer apoio de outro papel.",
    E:"de um stakeholder que acompanha o projeto."
  },
  correct:"B",

    core:"Uma das responsabilidades centrais do Scrum Master é servir ao time removendo obstáculos que atrapalham seu progresso — inclusive impedimentos técnicos que estão fora do alcance do próprio time.",

      D:"Se o próprio time pudesse resolver sozinho, não seria um impedimento reportado que exige o papel do Scrum Master.",
      E:"Stakeholders acompanham o progresso e dão feedback na Review, mas não têm o papel de remover impedimentos do time."
    }
  }
},
{
  id:"pm-07", topicId:"gestao-projetos", tier:"P1", format:"calculo",
  source:"inedita", insp:"VME em análise de riscos — item 1.7-1.8 do Anexo IV (Administração), reforçado em Gestão de Projetos",
  stem:"Em um projeto, uma atividade tem 20% de probabilidade de sofrer um risco que geraria um custo adicional de R$ 50.000,00. O Valor Monetário Esperado (VME) desse risco é:",
  options:{
    A:"R$ 50.000,00",
    B:"R$ 40.000,00",
    C:"R$ 10.000,00",
    D:"R$ 12.500,00",
    E:"R$ 60.000,00"
  },
  correct:"C",
  explanation:{
    core:"VME = probabilidade × impacto financeiro do risco.",
    detail:"VME = 0,20 × R$ 50.000,00 = R$ 10.000,00 — esse é o valor que, em média, deve ser reservado/considerado na reserva de contingência do projeto para esse risco específico.",
    wrong:{
      A:"R$ 50.000,00 é o impacto total caso o risco se concretize, não o valor esperado ponderado pela probabilidade.",
      B:"Não corresponde ao cálculo 0,20 × 50.000; parece confundir a probabilidade com seu complemento (80%).",
      D:"Não corresponde à multiplicação correta entre a probabilidade dada (20%) e o impacto (R$ 50.000,00).",
      E:"Não há operação no enunciado que resulte nesse valor; o VME não pode ser maior que o próprio impacto financeiro do risco."
    }
  }
},

  stem:"Sobre os mecanismos de segurança de perímetro, é correto afirmar que:",

      D:"É o oposto da definição de IDS: por definição ele NÃO bloqueia, apenas monitora e alerta.",
      E:"Proxies reversos frequentemente atuam também como camada de filtragem de conteúdo e proteção (ex: WAF integrado), não apenas como encaminhadores passivos."

{

{

{

  stem:"Sobre Story Points, utilizados em times ágeis para estimar itens do backlog, é correto afirmar que:",
  options:{

  correct:"B",

  stem:"Sobre os ataques XSS (Cross-Site Scripting) e CSRF (Cross-Site Request Forgery), é correto afirmar que:",
  options:{
    A:"XSS explora a injeção de scripts maliciosos executados no navegador da vítima; CSRF explora a confiança de um site em requisições vindas do navegador já autenticado da vítima, induzindo-a a executar uma ação não intencional.",
    B:"XSS e CSRF são termos sinônimos para o mesmo tipo de ataque.",
    C:"CSRF depende exclusivamente da injeção de código JavaScript diretamente no servidor da aplicação.",

    E:"CSRF explora vulnerabilidades exclusivamente em bancos de dados relacionais."

  explanation:{

    detail:"São vetores diferentes: XSS explora falha de sanitização de saída/entrada da aplicação (o script roda no navegador); CSRF explora a ausência de verificação de origem da requisição (o navegador da vítima é usado como 'procurador' involuntário do atacante).",
    wrong:{

      C:"CSRF não depende de injetar JavaScript no servidor — ele abusa de uma requisição legítima sendo enviada sem que a vítima perceba, geralmente por um link ou formulário em outro site.",
      D:"XSS pode ocorrer independentemente do uso de HTTPS — HTTPS protege o transporte dos dados, não a sanitização de entrada/saída da aplicação, que é a causa raiz do XSS.",
      E:"CSRF não é uma vulnerabilidade de banco de dados; é uma vulnerabilidade relacionada à falta de validação de origem de requisições HTTP."
    }
  }
},
{
  id:"seg-12", topicId:"seguranca", tier:"P1", format:"cenario",
  source:"inedita", insp:"Criptografia simétrica/assimétrica — combinação prática, complementa o bloco já cadastrado",
  stem:"Uma aplicação precisa cifrar um grande volume de dados (arquivos de vários gigabytes) da forma mais eficiente possível e, separadamente, precisa de um mecanismo seguro para duas partes combinarem uma chave secreta pela internet, sem terem compartilhado nada previamente. A combinação de técnicas mais adequada para esses dois problemas é, respectivamente:",
  options:{
    A:"criptografia assimétrica para cifrar o grande volume de dados; criptografia simétrica para a troca de chave.",
    B:"criptografia simétrica para cifrar o grande volume de dados (mais eficiente para grandes volumes); criptografia assimétrica para negociar a chave simétrica de forma segura.",
    C:"função hash para cifrar o grande volume de dados; assinatura digital para a troca de chave.",
    D:"criptografia simétrica para os dois problemas, sem qualquer necessidade de criptografia assimétrica.",
    E:"criptografia assimétrica para os dois problemas, sem qualquer necessidade de criptografia simétrica."
  },
  correct:"B",
  explanation:{
    core:"Criptografia simétrica é muito mais rápida para cifrar grandes volumes de dados; criptografia assimétrica resolve o problema de combinar uma chave secreta sem canal seguro prévio, mas é lenta demais para cifrar grandes volumes diretamente.",
    detail:"É exatamente essa combinação — chamada de criptografia híbrida — que sistemas reais como o TLS utilizam: a parte assimétrica negocia uma chave de sessão simétrica, e essa chave simétrica é usada para cifrar o tráfego de dados em si.",
    wrong:{
      A:"Inverte a aplicação mais eficiente de cada técnica: assimétrica é lenta demais para grandes volumes; simétrica não resolve sozinha o problema de troca segura de chave sem canal prévio.",
      C:"Hash não é reversível (não serve para cifrar dados que precisam ser recuperados); assinatura digital garante autenticidade/não-repúdio, não troca de chave.",
      D:"Simétrica sozinha não resolve o problema de combinar a chave secreta sem um canal seguro prévio — é justamente esse o papel da criptografia assimétrica no cenário.",
      E:"Assimétrica sozinha é ineficiente para cifrar grandes volumes de dados — na prática, sistemas reais preferem simétrica para essa parte."
    }
  }
},

  function localHistory(){
    try { return JSON.parse(localStorage.getItem("pn_sim_attempts") || "[]"); } catch(e){ return []; }
  }
  function saveLocalHistory(list){
    try { localStorage.setItem("pn_sim_attempts", JSON.stringify(list.slice(0,50))); } catch(e){}
  }
  function saveAttempt(attempt){
    return getDb().then(function(db){
      if (db){
        return db.collection("attempts").add(attempt).then(function(){ return true; }).catch(function(){ return false; });
      }
      return false;
    }).then(function(savedRemote){
      if (!savedRemote){
        var list = localHistory();
        list.unshift(Object.assign({ id:"local-"+Date.now() }, attempt));
        saveLocalHistory(list);
      }
      state.historyCache = null;
    });
  }
  function loadHistory(){
    return getDb().then(function(db){
      if (db){
        return db.collection("attempts").orderBy("finishedAt","desc").limit(50).get()
          .then(function(snap){
            return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          }).catch(function(){ return localHistory(); });
      }
      return localHistory();
    });
  }

  /* ---------- utils ---------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt2(n){ return (n<10?"0":"")+n; }
  function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return fmt2(m)+":"+fmt2(s); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
  function pctColor(pct){ return pct>=70 ? "var(--good)" : (pct>=50 ? "var(--amber)" : "var(--bad)"); }

  /* Amostragem sem reposição, ponderada pelo peso de cada Prioridade —
     garante que Prioridade 1 puxe mais questões que P2/P3 conforme o
     banco crescer nas próximas fases, sem exigir mudança aqui. */
  function pickQuestions(count, topicFilter){
    var pool = QUESTIONS.filter(function(q){ return !topicFilter || q.topicId === topicFilter; });
    var remaining = pool.slice();
    var picked = [];
    var n = Math.min(count, pool.length);
    while (picked.length < n && remaining.length){
      var totalWeight = remaining.reduce(function(sum,q){ return sum + (TIER_WEIGHT[q.tier]||1); }, 0);
      var r = Math.random() * totalWeight;
      var acc = 0, chosenIdx = 0;
      for (var i=0;i<remaining.length;i++){
        acc += TIER_WEIGHT[remaining[i].tier]||1;
        if (r <= acc){ chosenIdx = i; break; }
      }
      picked.push(remaining[chosenIdx]);
      remaining.splice(chosenIdx,1);
    }
    return shuffle(picked);
  }

  /* ---------- tabs ---------- */
  function switchTab(tab){
    state.tab = tab;
    document.querySelectorAll("#mainTabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===tab); });
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    if (tab==="home"){ document.getElementById("view-home").classList.add("active"); renderHome(); }
    if (tab==="study"){ document.getElementById("view-study").classList.add("active"); renderStudyList(); }
    if (tab==="history"){ document.getElementById("view-history").classList.add("active"); renderHistory(); }
  }
  document.getElementById("mainTabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    if (state.quiz && state.quiz.active){
      if (!confirm("Você tem uma prova em andamento. Sair agora descarta o progresso não finalizado. Continuar?")) return;
      state.quiz = null;
    }
    switchTab(b.dataset.tab);
  });

  /* ============================================================
     HOME
     ============================================================ */
  function renderHome(){
    var total = QUESTIONS.length;
    var byTier = {}; QUESTIONS.forEach(function(q){ byTier[q.tier]=(byTier[q.tier]||0)+1; });
    var host = document.getElementById("view-home");
    host.innerHTML = "";

    var head = el(
      '<header class="pagehead">'+
        '<span class="eyebrow"><span class="dot"></span>Ênfase Processos de Negócios</span>'+
        '<h1>Gere sua prova</h1>'+
        '<p>Escolha um modo. Ao final você recebe sua nota na hora — e só depois disso a correção detalhada, com a explicação de cada questão, é liberada para estudo.</p>'+
      '</header>'
    );
    host.appendChild(head);

    var grid = el('<div class="modegrid"></div>');
    var modes = [
      { id:"rapido", name:"Treino Rápido", desc:"Aquecimento curto, questões de todos os tópicos disponíveis.", n:Math.min(10,total) },
      { id:"medio", name:"Simulado Médio", desc:"Recorte maior da prova, bom para praticar sob tempo mais curto.", n:Math.min(20,total) },
      { id:"completo", name:"Simulado Completo", desc:"Usa tudo o que já está cadastrado no banco nesta fase do projeto.", n:total }
    ];
    modes.forEach(function(m){
      var card = el(
        '<div class="card modecard" data-mode="'+m.id+'">'+
          '<h3>'+m.name+'</h3><p>'+m.desc+'</p>'+
          '<div class="n">'+m.n+'<small>questões</small></div>'+
        '</div>'
      );
      card.addEventListener("click", function(){ startQuiz(m.n, null); });
      grid.appendChild(card);
    });

    var topicCard = el(
      '<div class="card modecard" data-mode="topico">'+
        '<h3>Treino por Tópico</h3><p>Escolha um assunto específico para focar seu estudo.</p>'+
        '<div class="topicpick show">'+
          '<select id="topicSelect"></select>'+
          '<button class="btn primary block" id="topicStart">Começar treino</button>'+
        '</div>'+
      '</div>'
    );
    grid.appendChild(topicCard);
    host.appendChild(grid);

    var strip = el('<div class="stat-strip"></div>');
    strip.appendChild(el('<div class="stat"><div class="n">'+total+'</div><div class="l">questões no banco (fase atual)</div></div>'));
    Object.keys(TIER_LABEL).forEach(function(tier){
      strip.appendChild(el('<div class="stat"><div class="n">'+(byTier[tier]||0)+'</div><div class="l">'+TIER_LABEL[tier]+'</div></div>'));
    });
    host.appendChild(strip);

    var sel = topicCard.querySelector("#topicSelect");
    TOPICS.forEach(function(t){
      var count = QUESTIONS.filter(function(q){ return q.topicId===t.id; }).length;
      var o = document.createElement("option");
      o.value = t.id; o.textContent = t.name + " (" + count + " questões)";
      sel.appendChild(o);
    });
    topicCard.querySelector("#topicStart").addEventListener("click", function(ev){
      ev.stopPropagation();
      var tid = sel.value;
      var n = QUESTIONS.filter(function(q){ return q.topicId===tid; }).length;
      startQuiz(n, tid);
    });
  }

  /* ============================================================
     QUIZ RUNNER
     ============================================================ */
  function startQuiz(count, topicFilter){
    var questions = pickQuestions(count, topicFilter);
    if (!questions.length){ alert("Não há questões suficientes para esse modo ainda."); return; }
    state.quiz = {
      active:true, topicFilter: topicFilter, questions: questions,
      answers:{}, current:0, startedAt: Date.now(), timerHandle:null
    };
    switchToView("run");
    renderRunner();
    state.quiz.timerHandle = setInterval(updateTimer, 1000);
  }
  function switchToView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById("view-"+id).classList.add("active");
  }
  function updateTimer(){
    var t = document.getElementById("quizTimer");
    if (!t || !state.quiz) return;
    var sec = Math.floor((Date.now()-state.quiz.startedAt)/1000);
    t.textContent = fmtTime(sec);
  }

  function renderRunner(){
    var q = state.quiz;
    var host = document.getElementById("view-run");
    var idx = q.current;
    var question = q.questions[idx];
    var answeredCount = Object.keys(q.answers).length;

    host.innerHTML = "";
    var headMeta = '<div class="runner-meta">'+
      '<span>'+(q.topicFilter ? topicById[q.topicFilter].name : "Todos os tópicos")+'</span>'+
      '<span class="timer" id="quizTimer">00:00</span>'+
      '<span>'+answeredCount+'/'+q.questions.length+' respondidas</span>'+
    '</div>';
    var head = el('<div class="runner-head"><h2>Questão '+(idx+1)+' de '+q.questions.length+'</h2>'+headMeta+'</div>');
    host.appendChild(head);

    var bar = el('<div class="progressbar"><i style="width:'+Math.round(((idx+1)/q.questions.length)*100)+'%"></i></div>');
    host.appendChild(bar);

    var t = topicById[question.topicId];
    var card = el('<div class="card qcard"></div>');
    var meta = el('<div class="qmeta">'+
      '<span class="badge '+question.tier.toLowerCase()+'">'+TIER_LABEL[question.tier]+'</span>'+
      '<span class="badge fmt">'+(t?t.name:"")+'</span>'+
      '<span class="badge fmt">'+FORMAT_LABEL[question.format]+'</span>'+
    '</div>');
    card.appendChild(meta);
    var qtext = el('<div class="qtext"></div>');
    qtext.innerHTML = question.stem;
    card.appendChild(qtext);

    var opts = el('<div class="opts"></div>');
    ["A","B","C","D","E"].forEach(function(letter){
      var chosen = q.answers[question.id] === letter;
      var opt = el('<div class="opt'+(chosen?' selected':'')+'" data-letter="'+letter+'">'+
        '<span class="letter">'+letter+'</span><div class="otext">'+question.options[letter]+'</div>'+
      '</div>');
      opt.addEventListener("click", function(){
        q.answers[question.id] = letter;
        renderRunner();
      });
      opts.appendChild(opt);
    });
    card.appendChild(opts);
    host.appendChild(card);

    var foot = el('<div class="runner-foot"></div>');
    var prevBtn = el('<button class="btn" '+(idx===0?"disabled":"")+'>← Anterior</button>');
    prevBtn.addEventListener("click", function(){ q.current = Math.max(0, q.current-1); renderRunner(); });
    var nextWrap = el('<div style="display:flex;gap:10px;"></div>');
    if (idx < q.questions.length-1){
      var nextBtn = el('<button class="btn primary">Próxima →</button>');
      nextBtn.addEventListener("click", function(){ q.current = Math.min(q.questions.length-1, q.current+1); renderRunner(); });
      nextWrap.appendChild(nextBtn);
    } else {
      var finishBtn = el('<button class="btn primary">Finalizar prova</button>');
      finishBtn.addEventListener("click", function(){
        var missing = q.questions.length - Object.keys(q.answers).length;
        if (missing>0 && !confirm(missing+" questão(ões) sem resposta. Finalizar mesmo assim?")) return;
        finishQuiz();
      });
      nextWrap.appendChild(finishBtn);
    }
    foot.appendChild(prevBtn); foot.appendChild(nextWrap);
    host.appendChild(foot);

    var jump = el('<div class="qjump"></div>');
    q.questions.forEach(function(qq, i){
      var b = el('<button>'+(i+1)+'</button>');
      if (q.answers[qq.id]) b.classList.add("answered");
      if (i===idx) b.classList.add("current");
      b.addEventListener("click", function(){ q.current = i; renderRunner(); });
      jump.appendChild(b);
    });
    host.appendChild(jump);

    updateTimer();
  }

  function finishQuiz(){
    var q = state.quiz;
    clearInterval(q.timerHandle);
    q.active = false;
    var elapsed = Math.floor((Date.now()-q.startedAt)/1000);

    var correct = 0;
    var topicStats = {};
    q.questions.forEach(function(question){
      var tId = question.topicId;
      topicStats[tId] = topicStats[tId] || { total:0, correct:0, name: topicById[tId].name };
      topicStats[tId].total++;
      var picked = q.answers[question.id];
      var isCorrect = picked === question.correct;
      if (isCorrect){ correct++; topicStats[tId].correct++; }
    });
    var pct = Math.round((correct / q.questions.length) * 100);

    var attempt = {
      mode: q.topicFilter ? "Treino por tópico" : (q.questions.length<=10 ? "Treino Rápido" : (q.questions.length<=20 ? "Simulado Médio" : "Simulado Completo")),
      topicFilter: q.topicFilter || null,
      total: q.questions.length,
      correct: correct,
      pct: pct,
      elapsedSec: elapsed,
      finishedAt: new Date().toISOString(),
      topicStats: topicStats,
      questionIds: q.questions.map(function(x){return x.id;}),
      answers: q.answers
    };

    state.lastResult = { attempt: attempt, questions: q.questions };
    saveAttempt(attempt);
    switchToView("results");
    renderResults(state.lastResult);
  }

  /* ============================================================
     RESULTS + REVISÃO
     ============================================================ */
  function renderResults(result){
    var attempt = result.attempt, questions = result.questions;
    var host = document.getElementById("view-results");
    host.innerHTML = "";

    var msg;
    if (attempt.pct>=70) msg = "Bom desempenho — o padrão da banca está entrando. Use a correção abaixo para fechar os últimos detalhes.";
    else if (attempt.pct>=50) msg = "Passou da linha de corte simbólica (50%), mas ainda dá para consolidar. Veja abaixo onde errou antes de repetir o treino.";
    else msg = "Está abaixo dos 50% — é exatamente o sinal para revisar a Área de Estudo destes tópicos antes de tentar de novo.";

    var hero = el('<div class="card score-hero" style="--pct:'+attempt.pct+'"></div>');
    hero.innerHTML =
      '<div class="score-ring" style="--pct:'+attempt.pct+'"><div class="inner"><div class="pct" style="color:'+pctColor(attempt.pct)+'">'+attempt.pct+'%</div><div class="lbl">'+attempt.correct+'/'+attempt.total+'</div></div></div>'+
      '<div class="score-copy"><h2>'+attempt.mode+'</h2><p>'+msg+' Tempo total: '+fmtTime(attempt.elapsedSec)+'.</p></div>';
    host.appendChild(hero);

    var bars = el('<div class="card" style="padding:24px 30px;"><h3 style="font-size:15px;margin-bottom:4px;">Desempenho por tópico</h3><div class="topicbars" id="topicBars"></div></div>');
    host.appendChild(bars);
    var tb = bars.querySelector("#topicBars");
    Object.keys(attempt.topicStats).forEach(function(tid){
      var s = attempt.topicStats[tid];
      var p = Math.round((s.correct/s.total)*100);
      var row = el('<div class="topicbar-row"><span>'+s.name+'</span><span class="track"><i style="width:'+p+'%;background:'+pctColor(p)+'"></i></span><span class="val">'+s.correct+'/'+s.total+'</span></div>');
      tb.appendChild(row);
    });

    var actions = el('<div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;"></div>');
    var reviewBtn = el('<button class="btn primary">Ver correção detalhada</button>');
    var homeBtn = el('<button class="btn">Nova prova</button>');
    homeBtn.addEventListener("click", function(){ switchTab("home"); });
    actions.appendChild(reviewBtn); actions.appendChild(homeBtn);
    host.appendChild(actions);

    var reviewHost = el('<div id="reviewHost"></div>');
    host.appendChild(reviewHost);

    reviewBtn.addEventListener("click", function(){
      if (reviewHost.dataset.built){ reviewHost.style.display = reviewHost.style.display==="none"?"block":"none"; return; }
      reviewHost.dataset.built = "1";
      renderReview(reviewHost, attempt, questions);
    });
  }

  function renderReview(host, attempt, questions){
    var wrap = el('<div style="margin-top:10px;"><h3 style="font-size:16px;margin:26px 0 4px;">Correção questão a questão</h3><p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;">Agora liberado — cada explicação foi escrita para ensinar o conceito, não só justificar o gabarito.</p></div>');
    questions.forEach(function(question, i){
      var picked = attempt.answers[question.id];
      var isCorrect = picked === question.correct;
      var t = topicById[question.topicId];
      var item = el('<div class="card review-item"></div>');
      var meta = el('<div class="qmeta">'+
        '<span class="badge '+question.tier.toLowerCase()+'">'+TIER_LABEL[question.tier]+'</span>'+
        '<span class="badge fmt">'+(t?t.name:"")+'</span>'+
        '<span class="badge fmt">'+FORMAT_LABEL[question.format]+'</span>'+
        '<span class="verdict '+(isCorrect?'ok':'no')+'">'+(isCorrect?"Você acertou":(picked?"Você errou":"Não respondida"))+'</span>'+
      '</div>');
      item.appendChild(meta);
      var qtext = el('<div class="qtext" style="font-size:15.5px;margin-bottom:16px;"></div>');
      qtext.innerHTML = "<b>"+(i+1)+".</b> "+question.stem;
      item.appendChild(qtext);

      ["A","B","C","D","E"].forEach(function(letter){
        var cls = "review-opt";
        if (letter===question.correct) cls += " correct";
        else if (letter===picked) cls += " wrong-pick";
        var tag = letter===question.correct ? " ✓ gabarito" : (letter===picked ? " ✗ sua resposta" : "");
        var o = el('<div class="'+cls+'"><span class="letter">'+letter+'</span><div class="otext">'+question.options[letter]+tag+'</div></div>');
        item.appendChild(o);
      });

      var exp = question.explanation;
      var whyList = Object.keys(exp.wrong||{}).map(function(l){
        return '<li><b>'+l+':</b> '+exp.wrong[l]+'</li>';
      }).join("");
      var explainBox = el('<div class="explain">'+
        '<h4>Explicação</h4>'+
        '<div class="core"><b>Conceito central:</b> '+exp.core+'</div>'+
        '<div class="core">'+exp.detail+'</div>'+
        (whyList ? '<h4 style="margin-top:14px;">Por que as outras erram</h4><ul class="why">'+whyList+'</ul>' : '')+
        '<button class="btn ghost studylink" data-topic="'+question.topicId+'">📖 Estudar este assunto na Área de Estudo →</button>'+
        '<div class="source-note">Questão inédita, no estilo Cesgranrio — mesmo tema/formato de: '+question.insp+'</div>'+
      '</div>');
      item.appendChild(explainBox);
      wrap.appendChild(item);
    });
    host.innerHTML = "";
    host.appendChild(wrap);
    host.querySelectorAll(".studylink").forEach(function(btn){
      btn.addEventListener("click", function(){
        switchTab("study");
        setTimeout(function(){ openStudyTopic(btn.dataset.topic); }, 30);
      });
    });
  }

  /* ============================================================
     ÁREA DE ESTUDO
     ============================================================ */
  function renderStudyList(){
    var host = document.getElementById("view-study");
    host.innerHTML = "";
    host.appendChild(el(
      '<header class="pagehead">'+
        '<span class="eyebrow"><span class="dot"></span>Livro de referência</span>'+
        '<h1>Área de Estudo</h1>'+
        '<p>Conteúdo condensado e otimizado para o contexto da prova — não é um curso completo, é o que basta para acertar a questão de múltipla escolha da Cesgranrio sobre cada tema.</p>'+
      '</header>'
    ));
    var list = el('<div class="topiclist"></div>');
    TOPICS.forEach(function(t){
      var count = QUESTIONS.filter(function(q){ return q.topicId===t.id; }).length;
      var row = el('<div class="card topicrow">'+
        '<span class="badge '+t.tier.toLowerCase()+'">'+TIER_LABEL[t.tier]+'</span>'+
        '<div class="ti"><h3>'+t.name+'</h3><p>'+t.summary+' · '+count+' questões vinculadas</p></div>'+
        '<span class="chev">→</span>'+
      '</div>');
      row.addEventListener("click", function(){ openStudyTopic(t.id); });
      list.appendChild(row);
    });
    host.appendChild(list);
    host.appendChild(el('<div id="studyDocHost"></div>'));
  }
  function openStudyTopic(id){
    var t = topicById[id];
    if (!t) return;
    var host = document.getElementById("view-study");
    var docHost = host.querySelector("#studyDocHost") || host.appendChild(el('<div id="studyDocHost"></div>'));
    var doc = el('<div class="card studydoc"></div>');
    doc.innerHTML = '<button class="btn ghost" id="backToList" style="margin-bottom:18px;">← Todos os tópicos</button>'+
      '<span class="ref">'+t.editalRef+'</span><h2>'+t.name+'</h2>'+t.html;
    docHost.innerHTML = "";
    docHost.appendChild(doc);
    doc.querySelector("#backToList").addEventListener("click", renderStudyList);
    doc.scrollIntoView({behavior:"smooth", block:"start"});
  }

  /* ============================================================
     HISTÓRICO
     ============================================================ */
  function renderHistory(){
    var host = document.getElementById("view-history");
    host.innerHTML = "";
    host.appendChild(el(
      '<header class="pagehead">'+
        '<span class="eyebrow"><span class="dot"></span>Progresso</span>'+
        '<h1>Histórico de provas</h1>'+
        '<p>Fica salvo entre visitas — volte quando quiser para acompanhar sua evolução por tópico.</p>'+
      '</header>'
    ));
    var loading = el('<div class="empty">Carregando…</div>');
    host.appendChild(loading);
    loadHistory().then(function(list){
      loading.remove();
      if (!list.length){
        host.appendChild(el('<div class="card empty"><div class="big">🗒️</div>Nenhuma prova feita ainda. Volte para a aba "Provas" para começar.</div>'));
        return;
      }
      list.forEach(function(a){
        var when = a.finishedAt ? new Date(a.finishedAt).toLocaleString("pt-BR") : "";
        var row = el('<div class="card hist-row">'+
          '<div class="hd"><div class="mode">'+a.mode+(a.topicFilter && topicById[a.topicFilter] ? " — "+topicById[a.topicFilter].name : "")+'</div><div class="when">'+when+' · '+fmtTime(a.elapsedSec||0)+'</div></div>'+
          '<div class="sc" style="color:'+pctColor(a.pct)+'">'+a.correct+'/'+a.total+' ('+a.pct+'%)</div>'+
        '</div>');
        host.appendChild(row);
      });
    });
  }

  /* ---------- boot ---------- */
  renderHome();
})();
</script>
