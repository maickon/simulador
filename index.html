<title>Simulador Cesgranrio TRANSPETRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Literata:opsz,wght@18..36,400;18..36,500;18..36,600&family=Literata:ital,opsz,wght@1,18..36,500&display=swap">
<style>
  :root{
    --bg:#eceef5;
    --surface:#ffffff;
    --surface-2:#e2e5f0;
    --ink:#1a1e2e;
    --ink-soft:#585f78;
    --line:#d3d7e6;
    --accent:#3a45a8;
    --accent-strong:#262f80;
    --accent-soft:#e1e3f6;
    --amber:#96631b;
    --amber-soft:#f3e6cd;
    --good:#1e7a4c;
    --good-soft:#dcf0e4;
    --bad:#b3392f;
    --bad-soft:#f7e0dd;
    --p1:#3a45a8;
    --p2:#96631b;
    --p3:#726b8a;
    --shadow: 0 1px 2px rgba(20,20,40,.05), 0 10px 26px -14px rgba(20,20,40,.25);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141f;
      --surface:#191c2b;
      --surface-2:#212437;
      --ink:#e8e9f5;
      --ink-soft:#9ea3c0;
      --line:#2c2f47;
      --accent:#8891ec;
      --accent-strong:#aeb5f5;
      --accent-soft:#242a52;
      --amber:#e0ac5c;
      --amber-soft:#332711;
      --good:#5bcf94;
      --good-soft:#153726;
      --bad:#f1897d;
      --bad-soft:#3a1c19;
      --p1:#8891ec;
      --p2:#e0ac5c;
      --p3:#b3abd6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141f;
    --surface:#191c2b;
    --surface-2:#212437;
    --ink:#e8e9f5;
    --ink-soft:#9ea3c0;
    --line:#2c2f47;
    --accent:#8891ec;
    --accent-strong:#aeb5f5;
    --accent-soft:#242a52;
    --amber:#e0ac5c;
    --amber-soft:#332711;
    --good:#5bcf94;
    --good-soft:#153726;
    --bad:#f1897d;
    --bad-soft:#3a1c19;
    --p1:#8891ec;
    --p2:#e0ac5c;
    --p3:#b3abd6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  h1,h2,h3,h4{ font-family:"Manrope",sans-serif; font-weight:800; text-wrap:balance; margin:0; color:var(--ink); }
  .stem, .qtext{ font-family:"Literata", Georgia, serif; }
  code, .mono{ font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .app{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- TOPBAR ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    max-width:1080px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:1px; margin-right:auto; }
  .brand .b1{ font-weight:800; font-size:15px; letter-spacing:-.01em; }
  .brand .b2{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  nav.tabs{ display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:10px; }
  nav.tabs button{
    border:none; background:transparent; padding:8px 16px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  nav.tabs button:hover:not(.active){ color:var(--ink); }

  .wrap{ max-width:1080px; margin:0 auto; padding:36px 24px 100px; width:100%; flex:1; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- shared bits ---------- */
  .eyebrow{ font-family:"Manrope",sans-serif; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); }
  .pagehead{ margin-bottom:30px; }
  .pagehead h1{ font-size:clamp(24px,3vw,32px); margin-bottom:8px; }
  .pagehead p{ color:var(--ink-soft); max-width:62ch; font-size:14.5px; margin:0; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px; }
  .badge.p1{ background:var(--accent-soft); color:var(--accent-strong); }
  .badge.p2{ background:var(--amber-soft); color:var(--amber); }
  .badge.p3{ background:var(--surface-2); color:var(--p3); }
  .badge.fmt{ background:var(--surface-2); color:var(--ink-soft); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  .btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px; padding:10px 18px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.block{ width:100%; justify-content:center; }

  /* ---------- HOME / MODE PICKER ---------- */
  .modegrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:8px; }
  .modecard{ padding:22px 22px 20px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .modecard:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .modecard h3{ font-size:16.5px; margin-bottom:6px; }
  .modecard p{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; min-height:34px; }
  .modecard .n{ font-family:"Manrope",sans-serif; font-weight:800; font-size:26px; color:var(--accent-strong); }
  .modecard .n small{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-left:4px; }

  .topicpick{ margin-top:14px; display:none; }
  .topicpick.show{ display:block; }
  .topicpick select{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; margin-bottom:10px; }

  .stat-strip{ display:flex; gap:26px; flex-wrap:wrap; margin-top:30px; padding-top:22px; border-top:1px solid var(--line); }
  .stat-strip .stat .n{ font-weight:800; font-size:20px; color:var(--accent-strong); font-variant-numeric:tabular-nums; }
  .stat-strip .stat .l{ font-size:12px; color:var(--ink-soft); }

  /* ---------- QUIZ RUNNER ---------- */
  .runner-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .runner-meta{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--ink-soft); font-weight:700; }
  .runner-meta .timer{ font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--surface-2); padding:4px 10px; border-radius:7px; }
  .progressbar{ height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .progressbar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); border-radius:99px; }

  .qcard{ padding:28px 30px 26px; }
  .qcard .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .qcard .qtext{ font-size:17px; line-height:1.6; margin-bottom:22px; white-space:pre-wrap; }
  .qtext table{ border-collapse:collapse; font-family:ui-monospace,monospace; font-size:13px; margin:12px 10px 12px 0; display:inline-table; vertical-align:top; font-variant-numeric:tabular-nums; }
  .qtext th,.qtext td{ border:1px solid var(--line); padding:5px 11px; text-align:left; }
  .qtext th{ background:var(--surface-2); }
  pre.codeblock{ background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:14px 16px; font-size:13px; overflow-x:auto; margin:14px 0; font-family:ui-monospace,monospace; line-height:1.5; max-width:100%; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ display:flex; gap:12px; align-items:flex-start; padding:13px 16px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); }
  .opt:hover{ border-color:var(--accent); }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .opt .letter{ font-family:"Manrope",sans-serif; font-weight:800; font-size:12.5px; width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .opt.selected .letter{ background:var(--accent); color:#fff; }
  .opt .otext{ font-size:14.5px; line-height:1.5; }

  .runner-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px; }
  .qjump{ display:flex; flex-wrap:wrap; gap:6px; margin-top:24px; }
  .qjump button{ width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:ui-monospace,monospace; }
  .qjump button.answered{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .qjump button.current{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---------- RESULTS ---------- */
  .score-hero{ display:flex; gap:34px; align-items:center; padding:32px 34px; flex-wrap:wrap; }
  .score-ring{ width:126px; height:126px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0); }
  .score-ring .inner{ width:98px; height:98px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring .pct{ font-weight:800; font-size:24px; font-family:"Manrope",sans-serif; }
  .score-ring .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .score-copy h2{ font-size:22px; margin-bottom:6px; }
  .score-copy p{ color:var(--ink-soft); font-size:14px; margin:0; max-width:52ch; }

  .topicbars{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  .topicbar-row{ display:grid; grid-template-columns:200px 1fr 60px; align-items:center; gap:14px; font-size:13px; }
  .topicbar-row .track{ height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .topicbar-row .track > i{ display:block; height:100%; border-radius:99px; }
  .topicbar-row .val{ text-align:right; font-family:ui-monospace,monospace; font-weight:700; color:var(--ink-soft); }

  .review-item{ padding:22px 26px; margin-top:14px; }
  .review-item .qmeta{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .review-item .verdict{ margin-left:auto; font-size:12px; font-weight:800; padding:3px 11px; border-radius:99px; }
  .review-item .verdict.ok{ background:var(--good-soft); color:var(--good); }
  .review-item .verdict.no{ background:var(--bad-soft); color:var(--bad); }
  .review-item .qtext{ font-size:15.5px; margin-bottom:16px; }
  .review-opt{ padding:10px 14px; border-radius:9px; font-size:13.5px; margin-bottom:6px; border:1px solid var(--line); display:flex; gap:10px; }
  .review-opt .letter{ font-weight:800; font-family:"Manrope",sans-serif; }
  .review-opt.correct{ background:var(--good-soft); border-color:transparent; }
  .review-opt.wrong-pick{ background:var(--bad-soft); border-color:transparent; }
  .explain{ margin-top:16px; background:var(--surface-2); border-radius:10px; padding:16px 18px; font-size:13.5px; }
  .explain h4{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:8px; }
  .explain .core{ margin-bottom:10px; }
  .explain .why{ margin:0; padding-left:18px; }
  .explain .why li{ margin-bottom:5px; }
  .explain .studylink{ margin-top:12px; display:inline-block; font-size:12.5px; font-weight:700; }
  .source-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; font-style:italic; }

  /* ---------- STUDY AREA ---------- */
  .topiclist{ display:flex; flex-direction:column; gap:10px; }
  .topicrow{ display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; }
  .topicrow:hover{ border-color:var(--accent); }
  .topicrow .ti{ flex:1; }
  .topicrow h3{ font-size:15px; margin-bottom:2px; }
  .topicrow p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .topicrow .chev{ color:var(--ink-soft); }

  .studydoc{ padding:30px 34px 34px; }
  .studydoc h2{ font-size:22px; margin-bottom:4px; }
  .studydoc .ref{ font-size:12px; color:var(--ink-soft); font-family:ui-monospace,monospace; margin-bottom:22px; display:block; }
  .studydoc h4{ font-size:14px; margin:22px 0 8px; color:var(--accent-strong); }
  .studydoc p{ font-size:14.5px; margin:0 0 12px; max-width:74ch; }
  .studydoc ul, .studydoc ol{ font-size:14.5px; padding-left:20px; margin:0 0 12px; max-width:74ch; }
  .studydoc li{ margin-bottom:5px; }
  .studydoc table{ width:100%; border-collapse:collapse; margin:14px 0; font-size:13.5px; }
  .studydoc th,.studydoc td{ text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  .studydoc th{ font-family:"Manrope",sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .studydoc code{ background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:.92em; }
  .studydoc .tip{ background:var(--accent-soft); border-radius:10px; padding:14px 18px; font-size:13.5px; margin:16px 0; }
  .studydoc .tip b{ color:var(--accent-strong); }

  /* ---------- HISTORY ---------- */
  .hist-row{ display:flex; align-items:center; gap:16px; padding:16px 20px; margin-bottom:10px; cursor:pointer; }
  .hist-row:hover{ border-color:var(--accent); }
  .hist-row .hd{ flex:1; }
  .hist-row .mode{ font-weight:700; font-size:14px; }
  .hist-row .when{ font-size:12px; color:var(--ink-soft); }
  .hist-row .sc{ font-family:ui-monospace,monospace; font-weight:800; font-size:16px; }
  .hist-row .chev{ color:var(--ink-soft); font-size:14px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty .big{ font-size:34px; margin-bottom:10px; }

  /* ---------- ÁREA (ÊNFASE) SELECTOR ---------- */
  .enfase-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .enfase-pill{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:9px 15px; border-radius:11px; border:1px solid var(--line); background:var(--surface); cursor:pointer; min-width:150px; }
  .enfase-pill:hover{ border-color:var(--accent); }
  .enfase-pill.active{ border-color:var(--accent); background:var(--accent-soft); }
  .enfase-pill .en{ font-weight:700; font-size:13px; }
  .enfase-pill.active .en{ color:var(--accent-strong); }
  .enfase-pill .ev{ font-size:11px; color:var(--ink-soft); }
  .enfase-pill .elock{ font-size:10.5px; font-weight:700; color:var(--muted); }
  .enfase-empty{ padding:40px 30px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .enfase-empty b{ color:var(--ink); }

  /* ---------- CONCURSO (INFO) ---------- */
  .infodoc{ padding:30px 34px 34px; margin-bottom:20px; }
  .infodoc h2{ font-size:19px; margin-bottom:14px; }
  .infodoc table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:6px; }
  .infodoc th,.infodoc td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  .infodoc th{ font-family:"Manrope",sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .infodoc td.dt{ font-family:ui-monospace,monospace; white-space:nowrap; color:var(--accent-strong); font-weight:700; }
  .infodoc tr.hi td{ background:var(--accent-soft); font-weight:700; }
  .infodoc p{ font-size:14px; color:var(--ink-soft); margin:0 0 10px; max-width:74ch; }
  .infodoc .note{ background:var(--amber-soft); border-radius:10px; padding:12px 16px; font-size:13px; color:var(--amber); margin-top:14px; }

  footer.appfoot{ text-align:center; padding:26px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); }

  @media (max-width:640px){
    .topbar-row{ flex-wrap:wrap; }
    nav.tabs{ order:3; width:100%; }
    .qcard{ padding:20px 18px; }
    .score-hero{ flex-direction:column; text-align:center; }
    .topicbar-row{ grid-template-columns:110px 1fr 44px; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="b1">Simulador Cesgranrio · TI</span>
        <span class="b2">TRANSPETRO 2026 · estilo Cesgranrio</span>
      </div>
      <nav class="tabs" id="mainTabs">
        <button data-tab="home" class="active">Provas</button>
        <button data-tab="study">Área de Estudo</button>
        <button data-tab="history">Histórico</button>
        <button data-tab="concurso">Concurso</button>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <!-- ===================== HOME / MODE PICKER ===================== -->
    <section class="view active" id="view-home"></section>

    <!-- ===================== QUIZ RUNNER ===================== -->
    <section class="view" id="view-run"></section>

    <!-- ===================== RESULTS ===================== -->
    <section class="view" id="view-results"></section>

    <!-- ===================== STUDY AREA ===================== -->
    <section class="view" id="view-study"></section>

    <!-- ===================== HISTORY ===================== -->
    <section class="view" id="view-history"></section>

    <!-- ===================== CONCURSO (INFO) ===================== -->
    <section class="view" id="view-concurso"></section>

  </div>

  <footer class="appfoot">Banco de questões em construção área por área — Processos de Negócios já cobre as Prioridades 1, 2 e 3 do padrão Cesgranrio. Ver a aba "Concurso" para dados do edital.</footer>
</div>

<script>
/* ============================================================
   ÊNFASES (ÁREAS) DO CONCURSO — dados do Anexo I do edital
   Cada uma tem seu polo, vaga imediata e cadastro de reserva reais.
   Hoje só "processos-negocio" tem banco de questões: foi a área
   recomendada para o perfil do usuário (dev/engenharia de software).
   ============================================================ */
window.ENFASES = [
  { id:"processos-negocio", nome:"Análise de Sistemas — Processos de Negócios", polo:"Rio de Janeiro", vagaImediata:"1 vaga (PCD)", cr:{AC:5,PCD:3,PN:3,PI:0,PQ:0}, crTotal:11 },
  { id:"infraestrutura", nome:"Análise de Sistemas — Infraestrutura", polo:"Rio de Janeiro", vagaImediata:"1 vaga (AC)", cr:{AC:6,PCD:2,PN:3,PI:0,PQ:0}, crTotal:11 },
  { id:"sap", nome:"Análise de Sistemas — SAP", polo:"Rio de Janeiro", vagaImediata:"1 vaga (PN)", cr:{AC:5,PCD:2,PN:4,PI:0,PQ:0}, crTotal:11 },
  { id:"seguranca-cibernetica", nome:"Análise de Sistemas — Segurança Cibernética e da Informação", polo:"Rio de Janeiro", vagaImediata:"1 vaga (AC)", cr:{AC:5,PCD:2,PN:3,PI:0,PQ:1}, crTotal:11 },
  { id:"ciencia-dados", nome:"Ciência de Dados", polo:"Rio de Janeiro", vagaImediata:"1 vaga (PN)", cr:{AC:9,PCD:2,PN:5,PI:0,PQ:0}, crTotal:16 }
];

/* ============================================================
   TÓPICOS DE ESTUDO — Prioridade 1
   ============================================================ */
window.TOPICS = [
{
  id:"sql-dados", tier:"P1", enfase:["processos-negocio","infraestrutura"],
  name:"Modelagem de Dados & SQL",
  editalRef:"Anexo IV · itens 1.1–1.17",
  summary:"ER→relacional, chaves, normalização, SQL com JOIN/subconsultas, transações e ACID.",
  html: `
    <h4>Do modelo ER ao relacional</h4>
    <p>Toda questão de modelagem parte de um cenário (pedidos, funcionários, dependentes) e pede para você decidir a <b>cardinalidade</b> e resolver o mapeamento para tabelas. Regras que a banca cobra sem exceção:</p>
    <ul>
      <li><b>1:N</b> — a chave primária do lado "1" vira chave estrangeira no lado "N".</li>
      <li><b>N:N</b> — cria-se uma tabela associativa nova, cuja chave primária é composta pelas duas chaves estrangeiras (ex: <code>Pedido_Produto(id_pedido, id_produto)</code>).</li>
      <li><b>Entidade fraca</b> — não tem chave própria; sua chave primária é composta pela chave da entidade forte + um discriminador (ex: <code>Dependente(cpf_titular, nome_dependente)</code>).</li>
      <li><b>Chave candidata</b> é qualquer atributo (ou conjunto) que poderia ser primária; <b>chave primária</b> é a escolhida; as demais candidatas viram <b>chaves alternativas</b> (com <code>UNIQUE</code>).</li>
    </ul>

    <h4>Normalização — identifique a forma, não só defina</h4>
    <p>A banca dá uma tabela com dependências funcionais escritas (ex: <code>matricula → nome, curso</code> e <code>curso → coordenador</code>) e pergunta em que forma normal ela está ou o que falta para normalizar. Cheque nesta ordem:</p>
    <table>
      <tr><th>Forma</th><th>Exige</th><th>Viola quando…</th></tr>
      <tr><td>1FN</td><td>Atributos atômicos, sem grupos repetidos</td><td>uma célula guarda uma lista (ex: "telefones: 111, 222")</td></tr>
      <tr><td>2FN</td><td>1FN + nenhum atributo não-chave depende de <i>parte</i> de uma chave composta</td><td>chave é (matricula, curso) e <code>nome</code> depende só de <code>matricula</code></td></tr>
      <tr><td>3FN</td><td>2FN + nenhum atributo não-chave depende de outro atributo não-chave</td><td><code>curso → coordenador</code>, ambos não-chave (dependência transitiva)</td></tr>
    </table>

    <h4>SQL — a banca sempre dá o schema</h4>
    <p>O formato clássico: duas ou três tabelas com colunas e chaves declaradas, seguidas de uma consulta para você "rodar" mentalmente. Pontos que decidem a questão:</p>
    <ul>
      <li><code>INNER JOIN</code> só traz linhas com correspondência nos dois lados; <code>LEFT JOIN</code> traz todas as linhas da tabela da esquerda mesmo sem par (com <code>NULL</code> nas colunas da direita).</li>
      <li><code>GROUP BY</code> exige que toda coluna do <code>SELECT</code> fora de função de agregação apareça no <code>GROUP BY</code>.</li>
      <li><code>HAVING</code> filtra depois do agrupamento (sobre o resultado agregado); <code>WHERE</code> filtra antes.</li>
      <li><code>EXISTS</code> costuma ser mais eficiente que <code>IN</code> com subconsulta grande, mas o resultado lógico pode ser idêntico — a banca gosta de pedir a tradução de um <code>IN (subquery)</code> para <code>EXISTS</code> equivalente.</li>
    </ul>
    <pre class="codeblock">SELECT d.nome, COUNT(p.id) AS total
FROM departamento d
LEFT JOIN pedido p ON p.id_dept = d.id
GROUP BY d.nome
HAVING COUNT(p.id) > 0;</pre>
    <p>Nesse exemplo: o <code>LEFT JOIN</code> mantém departamentos sem pedido (com contagem 0), mas o <code>HAVING COUNT(p.id) > 0</code> os remove no final — pegadinha clássica de misturar os dois efeitos numa questão só.</p>

    <h4>Transações e ACID</h4>
    <ul>
      <li><b>A</b>tomicidade — tudo ou nada; <b>C</b>onsistência — o banco sai de um estado válido para outro; <b>I</b>solamento — transações concorrentes não se enxergam parcialmente; <b>D</b>urabilidade — commit sobrevive a falha.</li>
      <li><b>Leitura fantasma (phantom read)</b>: uma transação repete a mesma consulta e vê linhas novas inseridas por outra transação — resolvido apenas no nível de isolamento <code>SERIALIZABLE</code>.</li>
      <li><b>Leitura suja (dirty read)</b>: ler dado de uma transação que ainda não deu commit — só acontece no nível mais baixo, <code>READ UNCOMMITTED</code>.</li>
    </ul>

    <div class="tip"><b>Como a banca cobra:</b> quase sempre com o schema desenhado no enunciado. Treine "rodar" o SQL na mão, linha por linha, antes de olhar as alternativas — a maioria dos erros vem de responder pela definição teórica em vez de executar a consulta de verdade.</div>
  `
},

      <tr><td>Floco de neve (snowflake schema)</td><td>as dimensões são <b>normalizadas</b> em subtabelas adicionais — menos redundância, mais joins</td></tr>
    </table>
    <p>A <b>tabela fato</b> guarda as métricas numéricas (valor vendido, quantidade); as <b>tabelas de dimensão</b> guardam os atributos descritivos usados para filtrar/agrupar (produto, tempo, cliente, região).</p>

    <h4>Operações OLAP — não confunda os termos</h4>
    <ul>
      <li><b>Drill down</b>: aumenta o nível de detalhe (ano → mês → dia).</li>
      <li><b>Drill up / roll-up</b>: diminui o nível de detalhe (agrega, o oposto do drill down).</li>
      <li><b>Slice</b>: fixa UMA dimensão em um único valor (ex: "só o ano de 2025"), mantendo as outras livres.</li>
      <li><b>Dice</b>: fixa VÁRIAS dimensões simultaneamente, criando um sub-cubo menor.</li>
      <li><b>Pivotagem (rotate)</b>: gira os eixos de análise, trocando o que está em linha pelo que está em coluna.</li>
    </ul>

    <h4>ETL</h4>
    <p><b>E</b>xtração (busca dados nos sistemas de origem) → <b>T</b>ransformação (limpeza, padronização, cálculo de métricas) → <b>L</b>oad/Carga (grava no Data Warehouse). É o processo que alimenta o ambiente analítico a partir dos sistemas transacionais.</p>

    <h4>Data Mart × Data Warehouse</h4>
    <p>Data Mart é um subconjunto de dados voltado a um departamento/área específica (ex: Data Mart de Vendas), geralmente derivado do Data Warehouse corporativo mais amplo — não o substitui.</p>

    <h4>OLTP × OLAP</h4>
    <p><b>OLTP</b> (sistemas transacionais): otimizado para inserir/atualizar registros rapidamente, um de cada vez. <b>OLAP</b> (sistemas analíticos): otimizado para consultas complexas sobre grandes volumes históricos, normalmente somente leitura.</p>

    <div class="tip"><b>Como a banca cobra:</b> historicamente esse bloco apareceu mais forte na prova de SAP do que na de Processos de Negócio no mesmo edital — mas com os mesmos enunciados. Decore a diferença exata entre drill down/up e slice/dice, que é onde mora a maior parte das pegadinhas.</div>
  `
},

  summary:"Conectivos, tabelas-verdade, negação de proposições, quantificadores, validade de argumentos.",
  html: `
    <h4>Conectivos e tabela-verdade do condicional</h4>
    <p>A proposição P → Q ("se P, então Q") só é <b>falsa</b> quando P é verdadeira e Q é falsa — em todos os outros três casos, é verdadeira. É a tabela-verdade mais cobrada e mais errada por intuição.</p>

    <h4>Negação de proposições — a pegadinha mais comum</h4>
    <ul>
      <li>Negação de <b>P → Q</b> é <b>P ∧ ¬Q</b> (não é "se não P, então não Q" — esse é um erro clássico).</li>
      <li>Negação de <b>P ∧ Q</b> (De Morgan) é <b>¬P ∨ ¬Q</b>.</li>
      <li>Negação de <b>P ∨ Q</b> (De Morgan) é <b>¬P ∧ ¬Q</b>.</li>
      <li>Negação de <b>∀x P(x)</b> ("para todo x, P(x)") é <b>∃x ¬P(x)</b> ("existe x tal que não P(x)").</li>
      <li>Negação de <b>∃x P(x)</b> é <b>∀x ¬P(x)</b>.</li>
    </ul>

    <h4>Contrapositiva × recíproca × inversa</h4>
    <p>Dada P → Q: a <b>contrapositiva</b> (¬Q → ¬P) é logicamente <b>equivalente</b> à original. A <b>recíproca</b> (Q → P) e a <b>inversa</b> (¬P → ¬Q) NÃO são equivalentes à original — são pegadinhas frequentes.</p>

    <h4>Validade de argumentos (silogismos)</h4>
    <p>Um argumento é válido quando, SE as premissas forem verdadeiras, a conclusão necessariamente também é. Clássico: "Todo A é B" + "X é A" ⊢ "X é B" (modus ponens aplicado a um quantificador universal).</p>

    <h4>Contagem de linhas da tabela-verdade</h4>
    <p>Uma proposição composta com <i>n</i> proposições simples distintas tem <b>2ⁿ</b> linhas na tabela-verdade completa.</p>

    <div class="tip"><b>Como a banca cobra:</b> bloco pequeno (2-3 questões) mas presente em quase toda prova — a maior fonte de erro não é desconhecer a regra, é a pressa: monte a tabela-verdade ou aplique a regra de negação por escrito antes de escolher a alternativa.</div>
  `
},

    <h4>Resposta a incidentes (NIST SP 800-61)</h4>
    <p>Quatro fases, nesta ordem: <b>Preparação</b> (antes de qualquer incidente) → <b>Detecção e Análise</b> → <b>Contenção, Erradicação e Recuperação</b> → <b>Atividades Pós-Incidente</b> (lições aprendidas).</p>

    <h4>Threat Intelligence × Threat Hunting</h4>
    <p><b>Threat Intelligence</b>: coleta, análise e disseminação de informações sobre ameaças (atores, táticas, indicadores de comprometimento) para embasar decisões de defesa. <b>Threat Hunting</b>: busca proativa e manual por ameaças que já podem estar no ambiente, mas que as ferramentas automatizadas ainda não detectaram.</p>

    <h4>MITRE ATT&CK × MITRE CAPEC</h4>
    <p><b>ATT&CK</b>: matrizes de <b>táticas</b> (o objetivo do atacante, ex: "acesso inicial") e <b>técnicas</b> (como cada tática é executada), baseadas em comportamento adversário real observado. <b>CAPEC</b>: catálogo de padrões de ataque em nível mais amplo (mecanismos e domínios de ataque) — os dois se complementam, não são a mesma coisa.</p>

    <h4>STRIDE — modelagem de ameaças</h4>
    <table>
      <tr><th>Letra</th><th>Ameaça</th></tr>
      <tr><td>S</td><td>Spoofing — personificação (fingir ser outro usuário/sistema)</td></tr>
      <tr><td>T</td><td>Tampering — alteração não autorizada de dados/código</td></tr>
      <tr><td>R</td><td>Repudiation — negar ter realizado uma ação, sem auditoria que prove o contrário</td></tr>
      <tr><td>I</td><td>Information disclosure — exposição indevida de informação</td></tr>
      <tr><td>D</td><td>Denial of service — indisponibilidade proposital de um serviço</td></tr>
      <tr><td>E</td><td>Elevation of privilege — obter acesso maior do que o autorizado</td></tr>
    </table>

    <h4>Etapas de um teste de penetração (pentest)</h4>
    <p>Reconhecimento (Footprinting) → Varredura (Scanning) → Enumeração → <b>Ganho de Acesso (Exploitation)</b> → Escalação de Privilégios → Encobrimento de Rastros → Relatório final.</p>

    <h4>ISO 31000 × ISO 22301 × Sarbanes-Oxley</h4>
    <p><b>ISO 31000</b>: diretrizes gerais de <b>gestão de riscos</b> (qualquer tipo de risco, não só segurança). <b>ISO 22301</b>: sistema de gestão de <b>continuidade de negócios</b> especificamente. <b>Sarbanes-Oxley (SOX)</b>: lei americana de controles internos e governança financeira, frequentemente citada junto por exigir controles rigorosos de TI em empresas com ações negociadas nos EUA.</p>

    <h4>Segurança em nuvem — responsabilidade compartilhada</h4>
    <p>O provedor de nuvem responde pela segurança <b>DA nuvem</b> (infraestrutura física, virtualização); o cliente responde pela segurança <b>NA nuvem</b> (configuração de acesso, dados, aplicações que ele implanta) — a divisão exata varia conforme o modelo (IaaS/PaaS/SaaS), mas o cliente nunca fica isento de responsabilidade.</p>

      <li><b>DHCP/DNS</b>: mesmos conceitos gerais de redes, mas configurados via daemons Linux (ex: <code>dhcpd</code>, <code>bind/named</code>).</li>
      <li><b>NIS</b> (Network Information Service): centraliza autenticação/configuração entre máquinas Unix de uma rede — precursor mais simples do que o LDAP.</li>
      <li><b>NFS</b> (Network File System): compartilha sistemas de arquivo entre máquinas Unix pela rede.</li>
      <li><b>CIFS/Samba</b>: implementa o protocolo de compartilhamento de arquivos do Windows em ambiente Linux — é a peça central de <b>integração com ambiente Windows</b>.</li>
    </ul>

    <h4>Apache — instalação e configuração básica</h4>
    <p>Arquivo principal de configuração (<code>httpd.conf</code> ou <code>apache2.conf</code>), diretivas como <code>DocumentRoot</code> (raiz dos arquivos servidos), <code>Listen</code> (porta), <code>VirtualHost</code> (hospedar múltiplos sites num único servidor).</p>

    <h4>Shell script — o básico que a banca cobra</h4>
    <pre class="codeblock">#!/bin/bash
for arquivo in /var/log/*.log; do
  if [ -s "$arquivo" ]; then
    echo "Arquivo não vazio: $arquivo"
  fi
done</pre>
    <p>Estruturas mais cobradas: <code>if/then/fi</code>, <code>for/do/done</code>, variáveis (<code>$VAR</code>), teste de arquivo (<code>-s</code> não vazio, <code>-f</code> existe e é arquivo, <code>-d</code> é diretório), redirecionamento (<code>&gt;</code>, <code>&gt;&gt;</code>, <code>|</code>).</p>

    <h4>Agendamento — cron</h4>
    <p>Arquivo <code>crontab</code>, cinco campos (minuto, hora, dia do mês, mês, dia da semana) antes do comando — ex: <code>0 3 * * * /script/backup.sh</code> roda todo dia às 3h.</p>

    <div class="tip"><b>Como a banca cobra:</b> "Administração Linux/Windows" é classificada como tema de peso alto historicamente em Infraestrutura — espere questões objetivas sobre sintaxe de comando/permissão/diretiva, não só definição teórica.</div>
  `
},

  html: `
    <h4>NAS × SAN</h4>
    <p><b>NAS</b> (Network Attached Storage): dispositivo de armazenamento acessado pela rede no nível de ARQUIVO (protocolos NFS/CIFS) — aparece para o sistema como uma pasta compartilhada. <b>SAN</b> (Storage Area Network): rede dedicada de armazenamento acessada no nível de BLOCO — aparece para o servidor como se fosse um disco local próprio, geralmente mais rápida e usada para cargas de trabalho mais exigentes.</p>

    <h4>RAID — níveis mais cobrados</h4>
    <table>
      <tr><th>Nível</th><th>Técnica</th><th>Tolerância a falha</th></tr>
      <tr><td>RAID 0</td><td>Striping (distribui dados entre discos)</td><td>nenhuma — mais rápido, mais arriscado</td></tr>
      <tr><td>RAID 1</td><td>Mirroring (espelha os dados)</td><td>tolera falha de 1 disco (mantém cópia idêntica)</td></tr>
      <tr><td>RAID 5</td><td>Striping + paridade distribuída</td><td>tolera falha de 1 disco</td></tr>
      <tr><td>RAID 6</td><td>Striping + paridade dupla</td><td>tolera falha de 2 discos</td></tr>
      <tr><td>RAID 10</td><td>Combinação de mirror (1) + stripe (0)</td><td>tolera falha, com bom desempenho</td></tr>
    </table>

    <h4>Virtualização — tipos</h4>
    <p><b>De computação</b>: várias VMs compartilham um hardware físico. <b>De rede</b>: recursos de rede (switches, firewalls) recriados em software, desacoplados do hardware físico. <b>De armazenamento</b>: agrega múltiplos dispositivos físicos de storage num único pool lógico gerenciado de forma centralizada.</p>

    <h4>Hypervisor — tipo 1 × tipo 2</h4>
    <p><b>Tipo 1 (bare-metal)</b>: roda diretamente sobre o hardware, sem sistema operacional hospedeiro por baixo (ex: uso comum em servidores de produção) — mais eficiente. <b>Tipo 2 (hosted)</b>: roda como um aplicativo sobre um sistema operacional já instalado — mais comum em uso de desktop/testes.</p>

    <div class="tip"><b>Como a banca cobra:</b> sem precedente direto nas provas antigas, mas é extensão natural do bloco de administração de sistemas (RAID apareceu na prova de 2018). Espere definição conceitual e comparação NAS×SAN, hypervisor tipo 1×2.</div>
  `

  html: `
    <h4>ITIL v4 — mudança de estrutura em relação a versões antigas</h4>
    <p>O ITIL v4 organiza o gerenciamento de serviços em torno do <b>Sistema de Valor de Serviço (SVS)</b>, que inclui a <b>Cadeia de Valor de Serviço</b> (6 atividades: planejar, engajar, projetar e transição, obter/construir, entregar e suportar, melhorar) e um conjunto de <b>práticas</b> (o ITIL v3 usava "processos" dentro de 5 fases de ciclo de vida — Estratégia, Desenho, Transição, Operação, Melhoria Contínua; o v4 substitui essa estrutura rígida de fases por práticas mais flexíveis).</p>
    <p>Práticas mais citadas: Gerenciamento de Incidente (restaurar o serviço o mais rápido possível), Gerenciamento de Problema (encontrar a causa raiz), Gerenciamento de Mudança, Central de Serviço (Service Desk, ponto único de contato).</p>

    <h4>Incidente × Problema — não confunda</h4>
    <p><b>Incidente</b>: interrupção não planejada ou redução de qualidade de um serviço — o foco é restaurar rápido. <b>Problema</b>: causa raiz de um ou mais incidentes — o foco é investigar e eliminar a causa, prevenindo recorrência.</p>

    <h4>COBIT 4.1 — domínio de Entrega de Serviço (DS)</h4>
    <p>O COBIT 4.1 organiza a governança de TI em 4 domínios: Planejamento e Organização (PO), Aquisição e Implementação (AI), <b>Entrega e Suporte (DS — Delivery and Support)</b> e Monitoramento e Avaliação (ME). O edital foca especificamente no domínio de <b>Entrega de Serviço</b>, que trata da execução operacional dos serviços de TI já implementados (gerenciamento de nível de serviço, capacidade, disponibilidade, continuidade, segurança, entre outros processos operacionais).</p>

    <div class="tip"><b>Como a banca cobra:</b> ITIL/COBIT tiveram presença real nas provas antigas até 2012, mas desapareceram em 2018 — o edital de 2026 os traz de volta explicitamente. Espere definição de termo e diferenciação incidente×problema, mais do que memorização de processo por processo.</div>
  `
},

  summary:"Cluster×grid, balanceamento de carga, DevOps, containers×VM, microsserviços, infraestrutura como código.",
  html: `
    <h4>Cluster × Grid</h4>
    <p><b>Cluster</b>: conjunto de máquinas fisicamente próximas (mesma rede local), fortemente acopladas, trabalhando como se fossem um único sistema. <b>Grid</b>: recursos computacionais geograficamente distribuídos e heterogêneos, coordenados para resolver um problema comum — mais fracamente acoplado que um cluster.</p>

    <h4>Balanceamento de carga</h4>
    <p>Distribui requisições entre múltiplos servidores para evitar sobrecarga de um único ponto, melhorando disponibilidade e desempenho — algoritmos comuns incluem round-robin, menor número de conexões ativas, e balanceamento por hash.</p>

    <h4>Containers × Máquinas Virtuais</h4>
    <p>Uma <b>VM</b> virtualiza o hardware inteiro, incluindo um sistema operacional completo próprio por VM. Um <b>container</b> compartilha o kernel do sistema operacional hospedeiro, isolando apenas processos/bibliotecas da aplicação — por isso é mais leve e rápido para iniciar do que uma VM completa.</p>

    <h4>Microsserviços</h4>
    <p>Arquitetura que decompõe uma aplicação em serviços pequenos, independentes, com responsabilidade única, que se comunicam por rede (geralmente APIs) — em oposição a uma aplicação monolítica única.</p>

    <h4>DevOps</h4>
    <p>Conjunto de práticas culturais e técnicas que busca integrar as equipes de Desenvolvimento e Operações, com entregas mais frequentes, automação de build/teste/deploy (CI/CD) e colaboração contínua entre quem escreve o código e quem o opera em produção.</p>

    <h4>Infraestrutura como Código (IaC)</h4>
    <p>Gerenciar e provisionar infraestrutura (servidores, redes, storage) através de arquivos de definição versionáveis, em vez de configuração manual — permite reproduzir ambientes de forma automatizada e consistente.</p>

    <div class="tip"><b>Como a banca cobra:</b> nenhum precedente nas provas antigas — containers, DevOps e infraestrutura como código nunca apareceram nas 7 provas do acervo, apesar de estarem no edital 2026. Trate como leitura de nivelamento conceitual, sem aprofundar demais.</div>
  `
},

  html: `
    <h4>Benefícios centrais</h4>
    <p><b>Escalabilidade</b>: capacidade de aumentar recursos conforme a demanda cresce. <b>Elasticidade</b>: além de escalar, a capacidade de ajustar automaticamente para CIMA e para BAIXO conforme a demanda varia (não é a mesma coisa que escalabilidade pura). <b>Alta disponibilidade</b>: manter o serviço no ar mesmo com falha de componentes individuais. <b>Recuperação de desastres</b>: capacidade de restaurar operação após uma falha catastrófica.</p>

    <h4>Modelos de serviço</h4>
    <table>
      <tr><th>Modelo</th><th>O provedor cuida de</th><th>O cliente cuida de</th></tr>
      <tr><td>IaaS</td><td>hardware físico, virtualização</td><td>sistema operacional, runtime, aplicação, dados</td></tr>
      <tr><td>PaaS</td><td>hardware + sistema operacional + runtime</td><td>aplicação e dados</td></tr>
      <tr><td>SaaS</td><td>tudo, inclusive a aplicação</td><td>apenas seus dados e configuração de uso</td></tr>

    <h4>Distribuição geográfica</h4>
    <p><b>Região</b>: área geográfica ampla onde o provedor mantém data centers (ex: "Sudeste do Brasil"). <b>Zona de disponibilidade</b>: um ou mais data centers isolados fisicamente dentro de uma mesma região, usados para tolerância a falha (se uma zona cai, outra na mesma região continua no ar).</p>

    <h4>Gestão de custos na nuvem</h4>
    <p>Modelo de cobrança tipicamente sob demanda (pay-as-you-go, paga pelo que usa), com opções de desconto por reserva de capacidade a longo prazo. Gerenciamento de subscrições/contas organiza o faturamento por projeto/departamento.</p>

  SELECT 1 FROM Projeto pr WHERE pr.id_funcionario = f.id AND pr.ano = 2025
);</pre>`,
    B:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f
WHERE EXISTS (
  SELECT 1 FROM Projeto pr WHERE pr.ano = 2025
);</pre>`,
    C:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f

    D:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario f

  source:"inedita", insp:"Subconsulta correlacionada com agregação — extensão do bloco de SQL/JOIN",
  stem:`Considere a tabela Funcionario(id, nome, id_departamento, salario). Qual consulta retorna corretamente o nome de todos os funcionários que ganham MAIS do que a média salarial do PRÓPRIO departamento (comparando cada funcionário apenas com a média do seu departamento, não com a média geral da empresa)?`,
  options:{
    A:`<pre class="codeblock" style="margin:0;">SELECT f.nome FROM Funcionario f
WHERE f.salario > (
  SELECT AVG(f2.salario) FROM Funcionario f2
  WHERE f2.id_departamento = f.id_departamento
);</pre>`,
    B:`<pre class="codeblock" style="margin:0;">SELECT f.nome FROM Funcionario f
WHERE f.salario > (
  SELECT AVG(salario) FROM Funcionario
);</pre>`,
    C:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario
GROUP BY id_departamento
HAVING salario > AVG(salario);</pre>`,
    D:`<pre class="codeblock" style="margin:0;">SELECT f.nome FROM Funcionario f, Funcionario f2
WHERE f.salario > f2.salario;</pre>`,
    E:`<pre class="codeblock" style="margin:0;">SELECT nome FROM Funcionario
WHERE salario > AVG(salario);</pre>`
  },
  correct:"A",
  explanation:{
    core:"A subconsulta precisa ser CORRELACIONADA — recalculada para cada funcionário, filtrando pelo mesmo id_departamento dele (f2.id_departamento = f.id_departamento) — para comparar cada um com a média do seu próprio departamento.",
    detail:"Sem essa correlação, a subconsulta calcula uma única média (geral da empresa) e a compara com todo mundo, o que responde a uma pergunta diferente da que foi pedida.",
    wrong:{
      B:"Essa subconsulta calcula a média salarial de TODA a empresa, não a média de cada departamento — responde a uma pergunta diferente.",
      C:"salario não pode aparecer solto no HAVING sem estar dentro de uma função de agregação nem estar no GROUP BY — sintaticamente inválido na maioria dos SGBDs, além de nome não estar agregado nem agrupado corretamente.",
      D:"Compara cada funcionário com TODOS os outros individualmente (produto cartesiano), sem nenhuma relação com a média do departamento — não responde à pergunta.",
      E:"Uso de função de agregação (AVG) diretamente no WHERE sem subconsulta e sem GROUP BY é inválido na sintaxe padrão de SQL."
    }
  }
},
{
  id:"sql-11", topicId:"sql-dados", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Melhoria de performance de banco de dados — item 1.17 do Anexo IV",
  stem:"Sobre o uso de índices em bancos de dados relacionais, é correto afirmar que:",
  options:{
    A:"índices sempre melhoram o desempenho de qualquer operação, sem nenhuma contrapartida negativa.",
    B:"criar um índice em uma coluna acelera buscas que filtram por ela, mas adiciona custo às operações de escrita (INSERT/UPDATE/DELETE), pois o índice também precisa ser atualizado a cada modificação.",
    C:"um índice só pode ser criado sobre a coluna definida como chave primária da tabela.",
    D:"índices eliminam a necessidade de normalização do banco de dados.",
    E:"quanto mais índices uma tabela tiver, mais rápidas serão todas as operações de escrita nela."
  },
  correct:"B",
  explanation:{
    core:"Índice é uma estrutura de dados auxiliar que acelera a leitura (busca), mas tem um custo: toda escrita na tabela precisa também atualizar o índice.",
    detail:"Por isso a decisão de indexar é sempre um trade-off leitura×escrita — colunas muito consultadas (WHERE, JOIN) costumam se beneficiar; tabelas com escrita intensa e poucas leituras podem sofrer com índices em excesso.",
    wrong:{
      A:"Todo índice tem custo de armazenamento e de escrita — não existe melhoria sem contrapartida.",
      C:"Índices podem ser criados sobre qualquer coluna (ou conjunto de colunas), não apenas sobre a chave primária.",
      D:"Índice e normalização resolvem problemas diferentes (desempenho de consulta × redundância/consistência dos dados); um não substitui o outro.",
      E:"É o oposto: mais índices tornam as operações de ESCRITA mais lentas, pois cada índice precisa ser atualizado a cada modificação."
    }
  }
},
{
  id:"sql-12", topicId:"sql-dados", tier:"P1", format:"cenario",
  source:"inedita", insp:"Integridade referencial e opcionalidade de relacionamento — item 1.5 do Anexo IV",
  stem:"Na tabela Pedido(id, id_cliente, id_vendedor), id_cliente é uma chave estrangeira NOT NULL, enquanto id_vendedor é uma chave estrangeira que ACEITA valores NULL. Isso indica que, no modelo de negócio representado:",
  options:{
    A:"todo pedido deve obrigatoriamente ter um cliente associado, mas pode não ter um vendedor associado — por exemplo, um pedido feito diretamente pelo site, sem intermediação de vendedor.",
    B:"um pedido nunca pode existir sem um vendedor associado.",
    C:"a tabela Pedido é uma entidade fraca em relação à tabela Vendedor.",
    D:"id_cliente e id_vendedor devem sempre apontar para a mesma linha na tabela de origem.",
    E:"um valor NULL em chave estrangeira é sempre um erro de integridade referencial e deveria ser proibido pelo SGBD."
  },
  correct:"A",
  explanation:{
    core:"A obrigatoriedade (NOT NULL) ou opcionalidade (aceita NULL) de uma chave estrangeira reflete diretamente a cardinalidade mínima do relacionamento no modelo de negócio.",
    detail:"id_cliente NOT NULL modela um relacionamento obrigatório (todo pedido tem cliente); id_vendedor aceitando NULL modela um relacionamento opcional (nem todo pedido precisa ter vendedor).",
    wrong:{
      B:"É exatamente o contrário do que o NULL permitido em id_vendedor representa — o relacionamento com vendedor é opcional, não obrigatório.",
      C:"Entidade fraca é um conceito estrutural sobre a própria chave primária da tabela, não sobre a obrigatoriedade de uma chave estrangeira qualquer.",
      D:"Não há nenhuma restrição no enunciado que relacione os valores de id_cliente e id_vendedor entre si.",
      E:"NULL em chave estrangeira é uma prática padrão e válida em SQL para modelar relacionamentos opcionais — não é um erro de integridade."
    }
  }
},
{
  id:"sql-13", topicId:"sql-dados", tier:"P1", format:"conceitual",
  source:"inedita", insp:"SGBD — funções e recursos, item 1.13 do Anexo IV",
  stem:"Sobre visões (VIEWs) em SQL, é correto afirmar que:",
  options:{
    A:"uma VIEW armazena fisicamente uma cópia dos dados no momento de sua criação, e não reflete alterações posteriores feitas nas tabelas base.",
    B:"uma VIEW é uma consulta armazenada, tratada como uma tabela virtual; seu conteúdo é calculado a partir das tabelas base no momento em que a VIEW é consultada.",
    C:"não é possível utilizar cláusulas WHERE ou JOIN na definição de uma VIEW.",
    D:"toda VIEW aceita operações de INSERT, UPDATE e DELETE sem qualquer restrição, independentemente de como foi definida.",
    E:"uma VIEW substitui a necessidade de índices nas tabelas base que ela consulta."
  },
  correct:"B",
  explanation:{
    core:"Uma VIEW não guarda dados por padrão — ela guarda a definição de uma consulta, que é reexecutada (contra as tabelas base) toda vez que a VIEW é acessada.",
    detail:"Por isso uma VIEW comum sempre reflete o estado atual das tabelas base, ao contrário de uma tabela materializada (que aí sim armazena uma cópia física, atualizada periodicamente).",
    wrong:{
      A:"Isso descreve uma VIEW materializada, um recurso à parte — a VIEW comum (a regra, no padrão SQL) não guarda cópia física dos dados.",
      C:"WHERE, JOIN, GROUP BY e praticamente qualquer cláusula de SELECT podem compor a definição de uma VIEW.",
      D:"VIEWs que envolvem múltiplas tabelas, agregações ou DISTINCT costumam ter restrições ou ficar somente-leitura, dependendo do SGBD — não é irrestrito.",
      E:"VIEW e índice resolvem problemas diferentes; uma VIEW não acelera fisicamente a consulta às tabelas base por si só."
    }
  }
},
{
  id:"sql-14", topicId:"sql-dados", tier:"P1", format:"conceitual",
  source:"inedita", insp:"Gerência de bloqueios — item 1.8 do Anexo IV",
  stem:"Um deadlock entre transações em um SGBD ocorre quando:",
  options:{
    A:"duas (ou mais) transações ficam aguardando indefinidamente, cada uma por um recurso bloqueado pela outra, de modo que nenhuma delas consegue prosseguir.",
    B:"uma transação demora mais do que o tempo limite configurado para ser concluída.",
    C:"duas transações leem o mesmo dado simultaneamente, sem qualquer tipo de bloqueio envolvido.",
    D:"uma transação tenta inserir um valor duplicado em uma coluna com restrição UNIQUE.",
    E:"o SGBD fica temporariamente indisponível por excesso de conexões simultâneas."
  },
  correct:"A",
  explanation:{
    core:"Deadlock é um impasse circular de espera por bloqueios: a transação X espera um recurso que a transação Y detém, enquanto Y espera um recurso que X detém — nenhuma consegue avançar.",
    detail:"A saída típica de um SGBD é detectar esse ciclo e forçar o rollback de uma das transações envolvidas (a 'vítima'), liberando o impasse.",
    wrong:{
      B:"Isso descreve um timeout de transação, uma situação diferente (e uma das possíveis consequências de um deadlock, não sua definição).",
      C:"Leitura simultânea sem conflito de escrita normalmente não gera deadlock — o impasse exige disputa por bloqueios de escrita/atualização.",
      D:"Isso é uma violação de restrição de unicidade, tratada como erro de integridade, não como deadlock.",
      E:"Isso descreve esgotamento de conexões/recursos do servidor, um problema de capacidade, não de espera circular entre transações."
    }
  }
},

  stem:"Em um diagrama de casos de uso, o caso de uso 'Realizar Pagamento' possui uma relação &lt;&lt;include&gt;&gt; com 'Validar Cartão de Crédito', e o caso de uso 'Aplicar Cupom de Desconto' possui uma relação &lt;&lt;extend&gt;&gt; sobre 'Realizar Pagamento'. Isso significa que:",
  options:{

{
  id:"es-12", topicId:"eng-software", tier:"P1", format:"cenario",
  source:"inedita", insp:"Design Pattern Abstract Factory identificado na prova de 2011 — mesmo formato aplicado a Singleton",
  stem:"Um sistema precisa garantir que exista, em toda a aplicação, apenas uma única instância de uma classe responsável por gerenciar a conexão com um recurso compartilhado, além de fornecer um ponto de acesso global a essa instância. O padrão de projeto (GoF) mais adequado para esse cenário é:",
  options:{ A:"Factory Method", B:"Observer", C:"Singleton", D:"Adapter", E:"Strategy" },
  correct:"C",
  explanation:{
    core:"Singleton garante exatamente essas duas coisas: uma única instância da classe em toda a aplicação, e um ponto de acesso global a essa instância.",
    detail:"É diferente de simplesmente 'usar uma variável global' porque o padrão controla a criação da instância dentro da própria classe, impedindo que outra parte do código crie uma segunda instância.",
    wrong:{
      A:"Factory Method delega a criação de objetos a subclasses, sem garantir unicidade de instância — resolve um problema diferente.",
      B:"Observer trata de notificação automática entre objetos quando um estado muda, não de controle de instância única.",
      D:"Adapter resolve incompatibilidade entre interfaces diferentes, sem relação com unicidade de instância.",
      E:"Strategy trata de trocar algoritmos intercambiáveis em tempo de execução, sem relação com o problema descrito."
    }
  }
},
{
  id:"es-13", topicId:"eng-software", tier:"P1", format:"cenario",
  source:"inedita", insp:"Design Patterns GoF — bloco aberto pela prova de 2011",
  stem:"Um sistema de cálculo de frete precisa permitir a troca do algoritmo de cálculo (por peso, por distância, por valor da mercadoria) em tempo de execução, sem alterar o código da classe que utiliza esse cálculo. O padrão de projeto (GoF) mais adequado para esse cenário é:",
  options:{ A:"Strategy", B:"Singleton", C:"Composite", D:"Decorator", E:"Template Method" },
  correct:"A",
  explanation:{
    core:"Strategy encapsula uma família de algoritmos intercambiáveis em classes separadas, permitindo trocar o algoritmo usado em tempo de execução sem alterar a classe cliente.",
    detail:"Cada forma de cálculo de frete (peso, distância, valor) vira uma implementação separada da mesma interface de estratégia — a classe cliente só conhece a interface, não a implementação escolhida.",
    wrong:{
      B:"Singleton controla instância única de uma classe — não tem relação com troca de algoritmos.",

      D:"Decorator adiciona responsabilidades a um objeto dinamicamente, envolvendo-o — não é o padrão focado em troca de algoritmo.",
      E:"Template Method define o esqueleto de um algoritmo na superclasse, deixando só alguns passos para as subclasses — diferente de trocar o algoritmo inteiro em tempo de execução."
    }
  }
},
{

  source:"inedita", insp:"Design Patterns GoF — bloco aberto pela prova de 2011",
  stem:"Em um sistema de notificações, múltiplos módulos (e-mail, SMS, push notification) precisam ser avisados automaticamente sempre que um pedido muda de status, sem que a classe Pedido precise conhecer os detalhes de implementação de cada módulo notificado. O padrão de projeto (GoF) mais adequado para esse cenário é:",

      D:"Builder separa a construção de um objeto complexo de sua representação — não tem relação com o cenário descrito.",
      E:"Command encapsula uma solicitação como um objeto, permitindo parametrizar e enfileirar ações — não é o padrão focado em notificação automática de múltiplos interessados."
    }
  }
},

{

  source:"inedita", insp:"Pontos de Função — EI complementa a questão de EQ já cadastrada",
  stem:"Em Análise de Pontos de Função, uma funcionalidade que recebe dados vindos de fora do sistema e os processa para atualizar um arquivo lógico interno (ex: uma tela de cadastro de novo cliente, que grava o registro no banco) é classificada como:",
  options:{ A:"ILF (Arquivo Lógico Interno)", B:"EIF (Arquivo de Interface Externa)", C:"EQ (Consulta Externa)", D:"EI (Entrada Externa)", E:"EO (Saída Externa)" },

  explanation:{
